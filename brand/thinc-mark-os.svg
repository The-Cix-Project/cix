<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240">
  <title>thinC OS mark + badge</title>
  <desc>The thinC mark plus the circular "OS" badge, no wordmark -- the medium lockup, for contexts like a compact app icon.</desc>
  <g transform="translate(42,48)">
    <g transform="scale(1.02)">
      <g id="ck" fill="#00C8FF">
        <!-- C: rigid open boundary, chamfered inner lip flowing into the K arrow -->
        <path d="M 0 18
                 Q 0 0 18 0
                 H 150
                 L 126 24
                 H 30
                 Q 24 24 24 30
                 V 110
                 Q 24 116 30 116
                 H 126
                 L 150 140
                 H 18
                 Q 0 140 0 122
                 Z"/>
        <!-- K upper arm -->
        <path d="M 130 70 L 196 0 H 232 L 164 70 Z"/>
        <!-- K lower arm -->
        <path d="M 130 70 L 164 70 L 232 140 H 196 Z"/>
      </g>
    </g>
    <g transform="translate(276,0)">
      <circle cx="78" cy="70" r="58" fill="none" stroke="#F2F5FA" stroke-width="8"/>
      <text x="78" y="83"
            fill="#F2F5FA"
            text-anchor="middle"
            font-family="Roboto Mono, Noto Sans Mono, monospace"
            font-size="42"
            font-weight="700"
            letter-spacing="3">OS</text>
    </g>
  </g>
</svg>
