<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <title>thinC OS full logo</title>
  <desc>Full thinC OS logo with the "thin" wordmark, the CK mark, the OS circle, and the "Thin host. C core." tagline.</desc>
  <g transform="translate(36,52)">
    <text x="0" y="132"
          fill="#F2F5FA"
          font-family="Roboto, Arial, sans-serif"
          font-size="132"
          font-weight="200"
          letter-spacing="-4">thin</text>

    <g transform="translate(325,0) scale(1.18)">
      <g id="ck" fill="#00C8FF">
        <!-- C: rigid open boundary, chamfered inner lip flowing into the K arrow -->
        <path d="M 0 18
                 Q 0 0 18 0
                 H 150
                 L 126 24
                 H 30
                 Q 24 24 24 30
                 V 110
                 Q 24 116 30 116
                 H 126
                 L 150 140
                 H 18
                 Q 0 140 0 122
                 Z"/>
        <!-- K upper arm -->
        <path d="M 130 70 L 196 0 H 232 L 164 70 Z"/>
        <!-- K lower arm -->
        <path d="M 130 70 L 164 70 L 232 140 H 196 Z"/>
      </g>
    </g>

    <g transform="translate(610,0)">
      <circle cx="78" cy="70" r="58" fill="none" stroke="#F2F5FA" stroke-width="8"/>
      <text x="78" y="83"
            fill="#F2F5FA"
            text-anchor="middle"
            font-family="Roboto Mono, Noto Sans Mono, monospace"
            font-size="42"
            font-weight="700"
            letter-spacing="3">OS</text>
    </g>

    <text x="16" y="226"
          fill="#F2F5FA"
          font-family="Roboto Mono, Noto Sans Mono, monospace"
          font-size="26"
          font-weight="400"
          letter-spacing="12">THIN HOST.</text>
    <text x="318" y="226"
          fill="#00C8FF"
          font-family="Roboto Mono, Noto Sans Mono, monospace"
          font-size="26"
          font-weight="600"
          letter-spacing="12">C</text>
    <text x="356" y="226"
          fill="#F2F5FA"
          font-family="Roboto Mono, Noto Sans Mono, monospace"
          font-size="26"
          font-weight="400"
          letter-spacing="12">CORE.</text>
  </g>
</svg>
