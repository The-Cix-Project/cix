<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260">
  <title>thinC OS full logo</title>
  <desc>Full thinC OS lockup: "thin" wordmark, the C+K mark, the OS badge, and the "THIN HOST. C CORE." tagline. Use only when the full lockup is explicitly requested -- the concise mark (thinc-mark.svg) is the default everywhere else.</desc>
  <defs>
    <linearGradient id="thinc-full-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FE0FF"/>
      <stop offset="55%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0090E8"/>
    </linearGradient>
  </defs>

  <text x="0" y="150"
        fill="#F2F5FA"
        font-family="Space Grotesk, Roboto, Arial, sans-serif"
        font-size="140"
        font-weight="300"
        letter-spacing="-4">thin</text>

  <g transform="translate(300,10) scale(0.93)" fill="url(#thinc-full-grad)">
    <path d="M 23,0
             L 172,0
             L 172,46
             L 46,46
             L 46,154
             L 172,154
             L 172,200
             L 23,200
             A 23,23 0 0 1 0,177
             L 0,23
             A 23,23 0 0 1 23,0
             Z"/>
    <path d="M 172,8 L 172,38 L 60,100 Z"/>
    <path d="M 172,162 L 172,192 L 60,100 Z"/>
  </g>

  <g transform="translate(500,20)">
    <circle cx="60" cy="90" r="54" fill="none" stroke="#F2F5FA" stroke-width="8"/>
    <text x="60" y="103"
          fill="#F2F5FA"
          text-anchor="middle"
          font-family="JetBrains Mono, Roboto Mono, Noto Sans Mono, monospace"
          font-size="36"
          font-weight="700"
          letter-spacing="2">OS</text>
  </g>

  <text x="4" y="240"
        fill="#F2F5FA"
        font-family="JetBrains Mono, Roboto Mono, Noto Sans Mono, monospace"
        font-size="24"
        font-weight="400"
        letter-spacing="8">THIN HOST.</text>
  <text x="262" y="240"
        fill="#00C8FF"
        font-family="JetBrains Mono, Roboto Mono, Noto Sans Mono, monospace"
        font-size="24"
        font-weight="700"
        letter-spacing="8">C</text>
  <text x="296" y="240"
        fill="#F2F5FA"
        font-family="JetBrains Mono, Roboto Mono, Noto Sans Mono, monospace"
        font-size="24"
        font-weight="400"
        letter-spacing="8">CORE.</text>
</svg>
