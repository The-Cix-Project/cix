<svg xmlns="http://www.w3.org/2000/svg" width="232" height="140" viewBox="0 0 232 140">
  <title>thinC mark</title>
  <desc>The bare thinC CK mark -- the concise logo, used everywhere unless the full lockup is explicitly needed.</desc>
  <g id="ck" fill="#00C8FF">
    <!-- C: rigid open boundary, chamfered inner lip flowing into the K arrow -->
    <path d="M 0 18
             Q 0 0 18 0
             H 150
             L 126 24
             H 30
             Q 24 24 24 30
             V 110
             Q 24 116 30 116
             H 126
             L 150 140
             H 18
             Q 0 140 0 122
             Z"/>
    <!-- K upper arm -->
    <path d="M 130 70 L 196 0 H 232 L 164 70 Z"/>
    <!-- K lower arm -->
    <path d="M 130 70 L 164 70 L 232 140 H 196 Z"/>
  </g>
</svg>
