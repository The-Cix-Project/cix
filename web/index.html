<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanxeo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
	<h1>Kanxeo</h1>
	<span id="health" class="badge badge-unknown">checking&hellip;</span>
</header>

<main>
	<section id="status" class="status" hidden></section>

	<section class="panel">
		<h2>Run a container</h2>
		<form id="run-form">
			<label>
				Name
				<input type="text" id="f-name" pattern="[A-Za-z0-9_-]+" required>
			</label>
			<label>
				Image
				<input type="text" id="f-image" required>
			</label>
			<label class="wide">
				Command
				<input type="text" id="f-cmd" placeholder="/bin/echo hello world" required>
			</label>
			<label>
				Memory max (bytes)
				<input type="number" id="f-memory-max" min="0">
			</label>
			<label>
				PIDs max
				<input type="number" id="f-pids-max" min="0">
			</label>
			<label>
				Networks
				<input type="text" id="f-network" placeholder="(none), or comma-separated: internal,dmz">
			</label>
			<label class="checkbox">
				<input type="checkbox" id="f-ip-forward">
				IP forwarding
			</label>
			<label class="checkbox">
				<input type="checkbox" id="f-dns-register">
				Register DNS name
			</label>
			<label class="wide">
				Static routes
				<input type="text" id="f-routes" placeholder="(none), or comma-separated: dest/prefix:via, e.g. 172.32.0.0/24:172.31.0.2">
			</label>
			<button type="submit">Run</button>
		</form>
	</section>

	<section class="panel">
		<h2>Networks</h2>
		<form id="network-form">
			<label>
				Name
				<input type="text" id="nf-name" pattern="[A-Za-z0-9_-]{1,15}" required>
			</label>
			<label>
				Subnet
				<input type="text" id="nf-subnet" placeholder="172.31.0.0" required>
			</label>
			<label>
				Prefix length
				<input type="number" id="nf-prefix" min="8" max="30" value="24" required>
			</label>
			<button type="submit">Create</button>
		</form>
		<table id="networks">
			<thead>
				<tr>
					<th>Name</th>
					<th>Subnet</th>
					<th>Prefix</th>
					<th>Gateway</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="networks-body">
				<tr><td colspan="5" class="empty">Loading&hellip;</td></tr>
			</tbody>
		</table>
	</section>

	<section class="panel">
		<h2>DNS Records</h2>
		<form id="dns-record-form">
			<label>
				Name
				<input type="text" id="df-name" placeholder="db.internal" required>
			</label>
			<label>
				IP
				<input type="text" id="df-ip" placeholder="172.31.0.5" required>
			</label>
			<button type="submit">Create</button>
		</form>
		<table id="dns-records">
			<thead>
				<tr>
					<th>Name</th>
					<th>IP</th>
					<th>Owner</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="dns-records-body">
				<tr><td colspan="4" class="empty">Loading&hellip;</td></tr>
			</tbody>
		</table>
	</section>

	<section class="panel">
		<h2>DNS Servers</h2>
		<form id="dns-server-form">
			<label>
				Container
				<input type="text" id="sf-container" pattern="[A-Za-z0-9_-]+" required>
			</label>
			<label class="wide">
				Hosts path
				<input type="text" id="sf-hosts-path" placeholder="/etc/dnsmasq-hosts" required>
			</label>
			<button type="submit">Register</button>
		</form>
		<table id="dns-servers">
			<thead>
				<tr>
					<th>Container</th>
					<th>Hosts path</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="dns-servers-body">
				<tr><td colspan="3" class="empty">Loading&hellip;</td></tr>
			</tbody>
		</table>
	</section>

	<section class="panel">
		<h2>Containers</h2>
		<table id="containers">
			<thead>
				<tr>
					<th>Name</th>
					<th>Status</th>
					<th>PID</th>
					<th>Exit status</th>
					<th>IP</th>
					<th>Fwd</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="containers-body">
				<tr><td colspan="7" class="empty">Loading&hellip;</td></tr>
			</tbody>
		</table>
	</section>
</main>

<script src="/app.js"></script>
</body>
</html>
