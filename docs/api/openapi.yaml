openapi: 3.0.3
info:
  title: Kanxeo Host API
  version: "1"
  description: >
    The single control surface for the Kanxeo host. Per the project's
    API-First Mandate (see /CLAUDE.md), this daemon is the only process
    with direct access to the container runtime library or any other
    host/network/DNS/PKI primitive. The CLI and the web dashboard are
    pure clients of this API -- every capability either surface offers
    must exist here first.
servers:
  - url: http://127.0.0.1:7620/v1

paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Daemon is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /system/shutdown:
    post:
      summary: >
        Stop kanxeod. When running as real PID 1 (--init-mode, i.e. an
        installed system), also powers off the host via reboot(2) once
        the event loop has stopped cleanly -- the only correct way for
        an init process to end its own life without the kernel treating
        it as "init exited" and panicking. A dev/interactive kanxeod
        (no --init-mode) just exits, same as it always has on SIGTERM.
      operationId: shutdownSystem
      responses:
        "202":
          description: Shutdown accepted; the connection may drop before a reply completes
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: ["shutting down"]

  /system/reboot:
    post:
      summary: Like /system/shutdown, but restarts the host instead of powering it off
      operationId: rebootSystem
      responses:
        "202":
          description: Reboot accepted; the connection may drop before a reply completes
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [rebooting]

  /containers:
    get:
      summary: List all containers known to this daemon
      operationId: listContainers
      responses:
        "200":
          description: Container list
          content:
            application/json:
              schema:
                type: object
                required: [containers]
                properties:
                  containers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Container"
    post:
      summary: Create and start a container
      operationId: createContainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerCreateRequest"
      responses:
        "201":
          description: Container created and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "400":
          description: Invalid request (bad fields, or the named image's rootfs does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A container with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /networks:
    get:
      summary: List all networks known to this daemon
      operationId: listNetworks
      responses:
        "200":
          description: Network list
          content:
            application/json:
              schema:
                type: object
                required: [networks]
                properties:
                  networks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Network"
    post:
      summary: Create a network (a real bridge, created immediately and persisted across daemon restarts)
      operationId: createNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreateRequest"
      responses:
        "201":
          description: Network created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          description: Invalid name, invalid/misaligned subnet, prefix_len out of range, or subnet overlaps an existing network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A network with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /networks/{name}:
    get:
      summary: Inspect one network
      operationId: getNetwork
      parameters:
        - $ref: "#/components/parameters/NetworkName"
      responses:
        "200":
          description: Network detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "404":
          description: No network with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a network (deletes its bridge)
      operationId: deleteNetwork
      parameters:
        - $ref: "#/components/parameters/NetworkName"
      responses:
        "204":
          description: Removed
        "404":
          description: No network with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Still in use by at least one container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dns/records:
    get:
      summary: List all DNS records known to this daemon
      operationId: listDnsRecords
      responses:
        "200":
          description: Record list
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/DnsRecord"
    post:
      summary: Create a DNS record (name -> IPv4 address), persisted across daemon restarts
      operationId: createDnsRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DnsRecordCreateRequest"
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsRecord"
        "400":
          description: Invalid hostname or ip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A record with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dns/records/{name}:
    get:
      summary: Inspect one DNS record
      operationId: getDnsRecord
      parameters:
        - $ref: "#/components/parameters/DnsRecordName"
      responses:
        "200":
          description: Record detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsRecord"
        "404":
          description: No record with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a DNS record
      operationId: deleteDnsRecord
      parameters:
        - $ref: "#/components/parameters/DnsRecordName"
      responses:
        "204":
          description: Removed
        "404":
          description: No record with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dns/servers:
    get:
      summary: List all registered DNS server bindings
      operationId: listDnsServers
      responses:
        "200":
          description: Binding list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DnsServerBinding"
    post:
      summary: >
        Register a running container as a DNS-serving target: writes the current full
        record set (dnsmasq --addn-hosts format) to hosts_path inside that container's
        own filesystem, and sends it SIGHUP to reload. Every subsequent record change
        re-writes the file and re-sends SIGHUP for as long as this binding exists.
      operationId: createDnsServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DnsServerBindingCreateRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsServerBinding"
        "400":
          description: hosts_path missing, not absolute, or contains ".."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No running container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This container is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dns/servers/{container}:
    delete:
      summary: Unregister a DNS server binding (does not touch the file or the container itself)
      operationId: deleteDnsServer
      parameters:
        - $ref: "#/components/parameters/DnsServerContainerName"
      responses:
        "204":
          description: Unregistered
        "404":
          description: No binding for this container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/ca:
    get:
      summary: Inspect the root CA (never includes the private key)
      operationId: getPkiCa
      responses:
        "200":
          description: CA detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCa"
        "404":
          description: CA not bootstrapped yet -- POST /pki/ca first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: >
        Bootstraps the single root CA (self-signed keypair, generated via the system's
        real openssl binary). The CA private key is never returned over the API, in any
        endpoint, ever. No CA regeneration in v1 -- a second call is a 409.
      operationId: createPkiCa
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkiCaCreateRequest"
      responses:
        "201":
          description: CA bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCa"
        "400":
          description: Invalid common_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: CA is already bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/certs:
    get:
      summary: List all issued leaf certificates (metadata only -- never a key)
      operationId: listPkiCerts
      responses:
        "200":
          description: Cert list
          content:
            application/json:
              schema:
                type: object
                required: [certs]
                properties:
                  certs:
                    type: array
                    items:
                      $ref: "#/components/schemas/PkiCert"
    post:
      summary: >
        Issues a leaf certificate signed by the root CA. The response is the ONLY place
        the leaf private key is ever returned -- neither the list nor the single-get
        endpoint includes one again afterward.
      operationId: createPkiCert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkiCertCreateRequest"
      responses:
        "201":
          description: Cert issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCertIssued"
        "400":
          description: Invalid name/sans, or CA not bootstrapped yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A cert with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/certs/{name}:
    get:
      summary: Inspect one issued certificate (metadata + cert_pem -- never the key)
      operationId: getPkiCert
      parameters:
        - $ref: "#/components/parameters/PkiCertName"
      responses:
        "200":
          description: Cert detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCert"
        "404":
          description: No cert with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove an issued certificate (deletes its key and cert files on disk)
      operationId: deletePkiCert
      parameters:
        - $ref: "#/components/parameters/PkiCertName"
      responses:
        "204":
          description: Removed
        "404":
          description: No cert with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/bootstrap:
    post:
      summary: >
        Stages a real build toolchain (gcc/make/ld/as/cc1/sh/tar and their real headers
        and shared libraries) from the daemon's own host into the sandboxed build image,
        by copying whole /usr/{include,lib,lib64,bin,libexec} directories with the real
        `cp -a`. Idempotent -- safe to call again, skips a subdirectory already staged.
        Not automatic at daemon startup; an explicit, one-time action.
      operationId: pkgBootstrap
      responses:
        "204":
          description: Build toolchain image staged (or already was)
        "500":
          description: Staging failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/recipes:
    get:
      summary: List recipes found on disk (provisioned out of band -- metadata only, never sourced/executed)
      operationId: listPkgRecipes
      responses:
        "200":
          description: Recipe list
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: "#/components/schemas/PkgRecipe"

  /pkg/install:
    post:
      summary: >
        Starts installing a package: fetches its recipe's source (a host-side `curl`
        subprocess, tracked asynchronously -- this endpoint returns immediately, it does
        not wait for the fetch or the build to finish), then, once fetched and its
        checksum verified, builds it inside an isolated, network-less container and
        merges the result into the shared base image every "base"-image container uses.
        v1 serializes installs: only one may be in flight at a time.
      operationId: pkgInstall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkgInstallRequest"
      responses:
        "202":
          description: Install started -- poll GET /pkg/{name} for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgEntry"
        "400":
          description: >
            name missing; no such recipe / it failed to parse; or a dependency it names
            (transitively) is missing its own recipe or forms a circular dependency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already installed (see upgrade), or another install is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg:
    get:
      summary: List every known package (installed or in-flight) with its current state
      operationId: listPkg
      responses:
        "200":
          description: Package list
          content:
            application/json:
              schema:
                type: object
                required: [packages]
                properties:
                  packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/PkgEntry"

  /pkg/{name}:
    get:
      summary: Inspect one package's current state (fetching/building/installed/failed)
      operationId: getPkg
      parameters:
        - $ref: "#/components/parameters/PkgName"
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgEntry"
        "404":
          description: No such package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Uninstalls a package (unlinks its manifested files from the base image)
      operationId: deletePkg
      parameters:
        - $ref: "#/components/parameters/PkgName"
      responses:
        "204":
          description: Removed
        "404":
          description: No such package, or not currently installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This package is currently mid-install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}:
    get:
      summary: Inspect one container
      operationId: getContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Container detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "404":
          description: No container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Stop (if running) and remove a container
      operationId: deleteContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "204":
          description: Removed
        "404":
          description: No container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    ContainerName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

    NetworkName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,15}$"

    DnsRecordName:
      name: name
      in: path
      required: true
      schema:
        type: string

    DnsServerContainerName:
      name: container
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

    PkiCertName:
      name: name
      in: path
      required: true
      schema:
        type: string

    PkgName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

  schemas:
    ContainerCreateRequest:
      type: object
      required: [name, image, cmd]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: >
            Unique container name. Used verbatim as the on-disk directory
            name under /var/lib/kanxeo/containers/, so it is restricted to
            [A-Za-z0-9_-].
        image:
          type: string
          description: >
            Name of a pre-existing, pre-populated image whose rootfs lives
            at /var/lib/kanxeo/images/{image}/rootfs. This daemon never
            creates image content itself -- only 400s if it's missing.
        cmd:
          type: array
          items:
            type: string
          minItems: 1
          description: argv for the container's entry process (cmd[0] is the executable path, relative to the container's own root).
        memory_max:
          type: integer
          format: int64
          description: cgroup v2 memory.max in bytes. Omit for no limit.
        pids_max:
          type: integer
          format: int64
          description: cgroup v2 pids.max. Omit for no limit.
        networks:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 64
          description: >
            Names of networks (see POST /networks) to attach to, in
            order -- any name not currently known to this daemon is a
            400. Omit for no networking at all (an isolated netns with
            only lo, the same as every container got before this field
            existed). The first entry is "primary" and receives the
            default route; any further entries only get their own
            subnet's connected route (no default route of their own).
        ip_forward:
          type: boolean
          default: false
          description: >
            Enables net.ipv4.ip_forward inside this container's own
            netns -- combined with two or more networks, lets it act
            as a router between them. Per-netns; never affects the
            host or other containers.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteSpec"
          maxItems: 8
          description: >
            Extra static routes installed inside the container's netns
            at creation time, after the primary default route. Set
            once at creation; not modifiable on an already-running
            container. Format only is validated (dest/via must be
            well-formed IPv4, prefix_len 0-32) -- whether via is
            actually reachable is the caller's responsibility.
        dns_register:
          type: boolean
          default: false
          description: >
            If true, automatically creates a DNS record (see POST
            /dns/records) named after this container, pointing at its
            primary network's IP, as part of container creation --
            requires networks to be set (400 otherwise). Best-effort:
            if a record with this name already exists (e.g. a stale
            persisted one from a same-named container created before a
            daemon restart), registration is silently skipped and the
            container is still created successfully -- it never
            overwrites a colliding record. The record's owner field is
            set to this container's name, and it is automatically
            removed when the container is deleted.
        pki_issue:
          type: boolean
          default: false
          description: >
            If true, automatically issues a leaf TLS certificate (see POST
            /pki/certs) named after this container (CN and sole SAN) and
            delivers it into the container's own filesystem as part of
            container creation -- requires the CA to already be
            bootstrapped (400 otherwise; unlike dns_register this does NOT
            require networks, since the cert identifies the container by
            name and delivery works regardless of networking). Best-effort
            past that point: if a cert with this name already exists (e.g.
            a stale one from a same-named container created before a
            daemon restart), issuance is silently skipped and the
            container is still created successfully -- it never overwrites
            a colliding cert. The cert's owner field is set to this
            container's name, and it is automatically removed when the
            container is deleted. Delivery is one-time (no live resync) --
            reused verbatim from POST /pki/certs's own reasoning, since a
            cert doesn't change after a container starts.
        pki_cert_dir:
          type: string
          default: "/etc/kanxeo-tls"
          description: >
            Destination directory inside the container (its own filesystem
            view) that the cert (tls.crt) and key (tls.key, chmod 0600)
            are written into when pki_issue is true. Ignored otherwise.
        pki_days:
          type: integer
          default: 365
          description: Validity period in days for the pki_issue certificate. Ignored otherwise.

    RouteSpec:
      type: object
      required: [dest, prefix_len, via]
      properties:
        dest:
          type: string
          description: Destination network address (dotted-quad).
        prefix_len:
          type: integer
          minimum: 0
          maximum: 32
        via:
          type: string
          description: Gateway IPv4 address (dotted-quad). Required -- v1 has no on-link/direct route support.

    Container:
      type: object
      required: [name, status, pid]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [running, exited]
        pid:
          type: integer
          description: PID in the daemon's own PID namespace. Meaningless once status is exited.
        exit_status:
          type: integer
          nullable: true
          description: Exit status once status is exited; null while running.
        networks:
          type: array
          items:
            $ref: "#/components/schemas/ContainerNetworkAttachment"
          description: Every network this container is attached to, in the order given at creation (first is primary). Empty if not networked.
        ip_forward:
          type: boolean
          description: >
            Whether net.ipv4.ip_forward is enabled inside this
            container's netns. Static routes given at creation are not
            echoed back here -- the caller already has them, and v1
            doesn't support introspecting or modifying them after
            creation.

    ContainerNetworkAttachment:
      type: object
      required: [name, ip]
      properties:
        name:
          type: string
          description: Name of the attached network (see /networks).
        ip:
          type: string
          description: Assigned IPv4 address (dotted-quad) within that network.

    NetworkCreateRequest:
      type: object
      required: [name, subnet, prefix_len]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,15}$"
          description: >
            Unique network name. Used verbatim as the Linux bridge
            interface's name, so it is restricted to IFNAMSIZ (15
            chars) and [A-Za-z0-9_-].
        subnet:
          type: string
          description: >
            The network's address (dotted-quad), with prefix_len's
            host bits already zero -- e.g. "172.31.0.0" for a /24.
            Rejected (400) if the host bits aren't actually zero, or
            if it overlaps any existing network's range.
        prefix_len:
          type: integer
          minimum: 8
          maximum: 30
          description: >
            CIDR prefix length. The gateway is always the first host
            address in the range (e.g. "172.31.0.1" for a /24) --
            there is no separate gateway field on this request.

    Network:
      type: object
      required: [name, subnet, prefix_len, gateway]
      properties:
        name:
          type: string
        subnet:
          type: string
        prefix_len:
          type: integer
        gateway:
          type: string
          description: Derived as subnet's first host address; never independently settable.

    DnsRecordCreateRequest:
      type: object
      required: [name, ip]
      properties:
        name:
          type: string
          description: >
            Hostname: dot-separated labels of [A-Za-z0-9-], each 1-63 chars, ≤253 chars
            total (RFC 1035). Deliberately a different charset from network/container
            names, which don't allow dots.
        ip:
          type: string
          description: IPv4 address (dotted-quad) this name resolves to.

    DnsRecord:
      type: object
      required: [name, ip]
      properties:
        name:
          type: string
        ip:
          type: string
        owner:
          type: string
          nullable: true
          description: >
            Name of the container this record was auto-registered for
            (via ContainerCreateRequest.dns_register), or null for a
            record created directly via POST /dns/records. Owned
            records are automatically deleted when their container is.

    DnsServerBindingCreateRequest:
      type: object
      required: [container, hosts_path]
      properties:
        container:
          type: string
          description: Name of an existing, running container (see /containers) to keep in sync.
        hosts_path:
          type: string
          description: >
            Absolute path, as the container's own filesystem sees it (e.g.
            "/etc/dnsmasq-hosts"), that the daemon writes the current record set into
            (dnsmasq --addn-hosts format) and re-writes on every future record change.
            Rejected if not absolute or if it contains "..".

    DnsServerBinding:
      type: object
      required: [container, hosts_path]
      properties:
        container:
          type: string
        hosts_path:
          type: string

    PkiCaCreateRequest:
      type: object
      properties:
        common_name:
          type: string
          default: "Kanxeo Root CA"
          description: >
            A free-form display label (not a hostname -- dots/spaces are fine), embedded
            as the CA's subject CN. Must not contain "/" (would inject additional,
            unintended DN fields into the openssl -subj argument) or control characters.
        days:
          type: integer
          default: 3650
          description: Validity period in days.

    PkiCa:
      type: object
      required: [subject, serial, not_before, not_after, cert_pem]
      properties:
        subject:
          type: string
        serial:
          type: string
        not_before:
          type: string
        not_after:
          type: string
        cert_pem:
          type: string
          description: PEM-encoded CA certificate. The CA private key is never included here or anywhere else.

    PkiCertCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Hostname (same RFC 1035 rules as DnsRecord.name) -- becomes the leaf
            certificate's CN, and this endpoint's REST identifier.
        sans:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 8
          description: >
            Subject Alternative Names (each a hostname). Omit to default to [name] --
            a cert always carries at least its own name as a SAN.
        days:
          type: integer
          default: 365
          description: Validity period in days.

    PkiCert:
      type: object
      required: [name, serial, not_after, sans]
      properties:
        name:
          type: string
        serial:
          type: string
        not_after:
          type: string
        sans:
          type: array
          items:
            type: string
        cert_pem:
          type: string
          description: PEM-encoded leaf certificate. Present on GET /pki/certs/{name}; omitted from the GET /pki/certs list view.
        owner:
          type: string
          nullable: true
          description: >
            Name of the container this cert was auto-issued for (via
            ContainerCreateRequest.pki_issue), or null for a cert created
            directly via POST /pki/certs. Owned certs are automatically
            deleted when their container is.

    PkiCertIssued:
      allOf:
        - $ref: "#/components/schemas/PkiCert"
        - type: object
          required: [cert_pem, key_pem]
          properties:
            key_pem:
              type: string
              description: >
                PEM-encoded private key. Present ONLY in this POST /pki/certs response --
                never returned again by any later GET, list, or any other endpoint.

    PkgRecipe:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
        depends:
          type: string
          description: >
            Raw pkg_depends= value from the recipe. Parsed and surfaced for visibility
            only in v1 -- not acted on (no automatic dependency installation yet).

    PkgInstallRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Must match an existing <name>.recipe file's own pkg_name=. Its pkg_depends
            are resolved and installed first automatically (already-installed
            dependencies are skipped; a circular or unresolvable dependency is a 400).
        upgrade:
          type: boolean
          default: false
          description: >
            If name is already installed, a plain POST (upgrade omitted or false) is
            always 409, even if the recipe's version has since changed -- explicit intent
            is required to rebuild a working install. Set true to allow it: still 409 if
            the recipe's version already matches what's installed (nothing to do),
            otherwise proceeds -- the old version's files are removed and the new
            version's are installed once the rebuild succeeds. Only ever applies to name
            itself, never to a dependency pulled in transitively.

    PkgEntry:
      type: object
      required: [name, version, state, files]
      properties:
        name:
          type: string
        version:
          type: string
        state:
          type: string
          enum: [fetching, building, installed, failed]
          description: >
            The response to POST /pkg/install describes whichever package actually
            started fetching first, which may be a dependency rather than the requested
            name if that name needed something installed first.
        error:
          type: string
          nullable: true
          description: Populated only when state is "failed".
        available_version:
          type: string
          nullable: true
          description: >
            Only meaningful when state is "installed": null if the installed version
            matches the recipe currently on disk, otherwise the recipe's current
            pkg_version= -- re-read fresh on every response, not cached. The concrete
            answer to "is this out of date."
        files:
          type: array
          items:
            type: string
          description: >
            Paths (relative to the base image root) this package installed. Empty until
            state is "installed". Symlinks in a package's own DESTDIR output are skipped
            in v1 (a documented boundary) -- only regular files are copied and manifested.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
