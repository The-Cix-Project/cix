openapi: 3.0.3
info:
  title: Kanxeo Host API
  version: "1"
  description: >
    The single control surface for the Kanxeo host. Per the project's
    API-First Mandate (see /CLAUDE.md), this daemon is the only process
    with direct access to the container runtime library or any other
    host/network/DNS/PKI primitive. The CLI and the web dashboard are
    pure clients of this API -- every capability either surface offers
    must exist here first.
servers:
  - url: http://127.0.0.1/v1

paths:
  /health:
    get:
      summary: Liveness check
      description: >
        A minimal, low-latency status only -- both clients poll this
        every few seconds purely for a status dot. Build/slot/kernel
        identity (a lower-frequency check) is `GET /system/boot`.
      operationId: getHealth
      responses:
        "200":
          description: Daemon is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /login:
    post:
      summary: Authenticate and obtain a session token (ADR-0144)
      description: >
        Always reachable regardless of write-gating state (this is the
        one endpoint exempt from the Authorization check every other
        mutating request needs -- see the write-gating note under
        `components.securitySchemes.bearerAuth` below). Verifies
        username/password against this platform's own LDAP user store
        -- a live LDAP bind against a configured `glauth` server first
        when `PUT /system/hostauth-config`'s own `ldap_enabled` is set
        (falling back to a local, in-process bcrypt check if every
        configured server is unreachable), or the local check alone
        when LDAP is disabled. `expires_in_seconds` is `null` when
        `idle_timeout_seconds` is configured as `0` -- the returned
        token is then single-use, consumed by the very next request
        that presents it, matching that configuration's own documented
        "every write re-authenticates" contract.
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in_seconds]
                properties:
                  token:
                    type: string
                    description: "Opaque bearer token -- present as `Authorization: Bearer <token>` on subsequent requests."
                  expires_in_seconds:
                    type: integer
                    nullable: true
                    description: Idle-timeout window in seconds, refreshed on every use; null means the token is single-use (idle_timeout_seconds == 0).
        "400":
          description: Missing username or password, or an invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logout:
    post:
      summary: Invalidate the current session (ADR-0144)
      description: >
        Idempotent: always `204`, whether the presented token names a
        real, still-live session or not -- a client never needs to
        know or care whether its session had already lapsed
        server-side. Also exempt from write-gating, the same as
        `POST /login` (a client that isn't authenticated has nothing
        meaningful to log out of, but the call still succeeds).
      operationId: postLogout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session invalidated (or was already gone)

  /system/hostauth-config:
    get:
      summary: Current host-authentication configuration (ADR-0144)
      operationId: getHostauthConfig
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostauthConfig"
    put:
      summary: Replace the host-authentication configuration (ADR-0144)
      description: >
        Full replacement, not a partial merge -- a request that omits
        `admin_groups`/`idle_timeout_seconds` is rejected outright
        (`400`); the four `ldap_*` fields are each individually
        optional and default to disabled/empty when omitted, so an
        older-shaped request body (from before the live-LDAP backend
        existed) still works unchanged. Write-gating (see
        `components.securitySchemes.bearerAuth`) only ever activates
        once at least one user is a member of one of `admin_groups` --
        a fresh install can never lock itself out of its own API by
        misconfiguring this endpoint, no separate break-glass
        credential exists or is needed.
      operationId: putHostauthConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admin_groups, idle_timeout_seconds]
              properties:
                admin_groups:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                  description: LDAP group names whose members may perform mutating requests.
                idle_timeout_seconds:
                  type: integer
                  minimum: 0
                  description: Sliding idle window for a session token; 0 means every token is single-use (no session reuse at all).
                ldap_enabled:
                  type: boolean
                  default: false
                  description: When true, POST /login tries a live LDAP bind against ldap_servers first (see that endpoint's own description).
                ldap_servers:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                  description: Host or IP of each configured glauth server, tried in order. Required (at least one) when ldap_enabled is true.
                ldap_port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 3893
                  description: Shared port every entry in ldap_servers is queried on (glauth's own real default is 3893).
                ldap_base_dn:
                  type: string
                  description: e.g. "dc=glauth,dc=com" -- required, non-empty, when ldap_enabled is true (this daemon has no other way to learn a running glauth server's own configured baseDN).
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostauthConfig"
        "400":
          description: Invalid JSON body, or a field outside its documented bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Write-gating is active and the caller isn't an authenticated admin-group member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not persist the config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/boot:
    get:
      summary: Build/slot/kernel identity
      description: >
        Reports which build is actually running, which A/B slot it
        booted from, and the running kernel version -- the
        deploy/reboot verification signal referenced throughout
        docs/guides/kernel-build-and-ab-updates.md, so a
        `system/update` + `system/reboot` round trip can be confirmed
        against the real running daemon instead of inferred. Split out
        of `GET /health` (ADR-0077) so the liveness poll stays cheap.
      operationId: getSystemBoot
      responses:
        "200":
          description: Build/slot/kernel identity
          content:
            application/json:
              schema:
                type: object
                required: [build_version, build_time, slot, kernel_version]
                properties:
                  build_version:
                    type: string
                    description: >
                      `git describe --tags --always --dirty` at build
                      time (e.g. `v1.6.0-7-g66265a5-dirty`), or
                      `unknown` if built outside a git checkout.
                  build_time:
                    type: string
                    description: UTC build timestamp, RFC 3339 (e.g. `2026-08-08T00:00:00Z`).
                  slot:
                    type: string
                    nullable: true
                    enum: ["a", "b", null]
                    description: >
                      The A/B slot this boot's `--slot=` was started
                      with, or `null` for a dev/test daemon started
                      without one (see `kanxeo-install.c`'s A/B
                      mechanism).
                  kernel_version:
                    type: string
                    nullable: true
                    description: >
                      The running kernel's `uname(2)` release string
                      (e.g. `6.18.40`), or `null` if `uname(2)` itself
                      failed.
                  bootroot_assembly_started_generation:
                    type: integer
                    description: >
                      Real freshness signal for `pkg hostbuild kanxeo
                      --deploy` (ADR-0058-follow-on, task #737): a
                      monotonic counter incremented once per server-side
                      kanxeo bootroot assembly attempt (ADR-0057). 0 if
                      no attempt has ever run this daemon lifetime.
                  bootroot_assembly_completed_generation:
                    type: integer
                    description: >
                      The generation number of the last assembly attempt
                      that *actually succeeded* -- never advanced on
                      failure. A client that captured this value before
                      triggering a new hostbuild round can wait for it
                      to advance past that baseline to know the fresh
                      artifact (not a stale leftover from an earlier
                      round) is now on disk.
                  bootroot_assembly_running:
                    type: boolean
                    description: >
                      true while an assembly attempt is in flight --
                      lets a client distinguish "still working" from
                      "gave up, that attempt failed" instead of polling
                      completed_generation forever after a failure.

  /system/shutdown:
    post:
      summary: >
        Stop kanxeod. When running as real PID 1 (--init-mode, i.e. an
        installed system), also powers off the host via reboot(2) once
        the event loop has stopped cleanly -- the only correct way for
        an init process to end its own life without the kernel treating
        it as "init exited" and panicking. A dev/interactive kanxeod
        (no --init-mode) just exits, same as it always has on SIGTERM.
      operationId: shutdownSystem
      responses:
        "202":
          description: Shutdown accepted; the connection may drop before a reply completes
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: ["shutting down"]

  /system/reboot:
    post:
      summary: Like /system/shutdown, but restarts the host instead of powering it off
      operationId: rebootSystem
      responses:
        "202":
          description: Reboot accepted; the connection may drop before a reply completes
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [rebooting]

  /system/update:
    post:
      summary: >
        Write a fresh control-plane squashfs and/or a fresh kernel onto
        this daemon's own inactive A/B slot (see ADR-0014, ADR-0031,
        ADR-0032) and stage a fresh systemd-boot loader entry for it
        with a fresh Automatic Boot Assessment tries-left counter.
        image_path/kernel_path are local paths the operator has already
        transferred the files to (e.g. scp) -- no upload is performed.
        Independent and both optional (at least one required): update
        just the root, just the kernel (both slots already carry a
        kernel file from install time, so this always has something to
        replace), or both together in one call. ADR-0095: whichever of
        image_path/kernel_path is omitted is auto-filled from the
        *active* slot's own currently-running copy (already booted,
        already known-good) rather than left as whatever was
        previously written to the inactive slot -- a one-sided update
        can no longer pair a fresh kernel with a stale root (or vice
        versa) the way it used to. Requires this daemon to be running
        with --slot=a or --slot=b (a real --init-mode boot); otherwise
        there is no meaningful "inactive slot" and the request is
        rejected. Does NOT reboot -- call /system/reboot separately
        once ready to cut over; the existing boot-counter/
        confirm_boot() machinery, unchanged, decides whether the fresh
        slot sticks.
      operationId: updateSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_path:
                  type: string
                  description: Local filesystem path to a squashfs image (checked via its own on-disk magic)
                kernel_path:
                  type: string
                  description: Local filesystem path to a bzImage kernel (checked via its own on-disk boot-sector/setup_header magic)
      responses:
        "200":
          description: Whatever was given was written to the inactive slot and a fresh loader entry staged
          content:
            application/json:
              schema:
                type: object
                required: [status, slot, updated]
                properties:
                  status:
                    type: string
                    enum: [staged]
                  slot:
                    type: string
                    enum: [a, b]
                    description: Which slot ("a" or "b") was just written -- always this daemon's own inactive slot
                  updated:
                    type: array
                    items:
                      type: string
                      enum: [root, kernel]
                    description: >
                      Always ["root", "kernel"] (ADR-0095) -- both are genuinely
                      fresh content in the inactive slot after this call, whether
                      the caller supplied both explicitly or one was auto-filled
                      from the active slot's own running copy.
        "400":
          description: >
            No --slot= on this daemon, neither image_path nor
            kernel_path given, either path missing/unreadable, or
            either file fails its own on-disk magic check -- the
            inactive slot is left completely untouched in every 400
            case (both files are validated before either is written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            A real disk write failed after validation passed: writing
            image_path to the inactive slot device, writing kernel_path
            to the ESP, or writing the fresh systemd-boot loader entry
            itself. Whichever step failed is named in the error message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/backup:
    get:
      summary: >
        Bundles platform *configuration* state -- container
        definitions, networks, DNS records, package install state and
        recipes (see ADR-0033) -- as one response, for a client to save
        and later feed back to POST /system/restore. Deliberately does
        NOT include: workload data (each container's own persistent
        data -- gitea's repos, a resolver's zone files, a metrics
        TSDB -- is that container's own concern, with its own native
        export tooling); image rootfs content (reproducible by
        re-running pkg install for whatever pkg_installed records,
        since everything is compiled from source -- this is the
        "shopping list," not the built bytes); and PKI, which is never
        referenced by this endpoint at all -- the CA private key (and
        every issued leaf's own key) is never returned over the API by
        existing, deliberate design (see /pki/ca, /pki/certs), and
        backing it up is a separate, host-level concern entirely, not
        partially folded into this mechanism.
      operationId: getSystemBackup
      responses:
        "200":
          description: The platform state bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemBackupBundle"

  /system/restore:
    post:
      summary: >
        The reverse of GET /system/backup -- writes each field present
        in the bundle back to its own real state file. Fields are
        independent and all optional (at least one required): restore
        just container definitions, just networks, or the whole
        bundle. Every field is validated (container_defs/networks/
        dns_records/pkg_installed/site_config must each themselves
        parse as valid JSON; pkg_recipes must be an object of string
        values) before any file is written, so one malformed field can
        never leave
        the others half-applied. Deliberately does NOT reboot or hot-
        reload anything -- restored state only takes effect on the
        next boot (the same daemon-startup replay path, including
        container autostart, that already runs on every normal boot);
        call the pre-existing POST /system/reboot separately once
        ready, the same "write, don't reboot, caller decides when to
        cut over" shape /system/update already established (ADR-0031).
      operationId: postSystemRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemBackupBundle"
      responses:
        "200":
          description: Every present field written to its real state file
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [restored]
        "400":
          description: >
            No recognized field present, or a present field failed its
            own validation (not valid JSON / pkg_recipes not an
            object of strings) -- nothing is written in either case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            Every field passed validation but a real disk write failed
            while applying one of them (its own state file, or, for
            pkg_recipes, the recipes directory/an individual .recipe
            file) -- the specific field is named in the error message.
            Fields written before the failing one are NOT rolled back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/backup-config:
    get:
      summary: Automatic backup-snapshot configuration (ADR-0141 Phase 5)
      description: >
        Turns the `backup` disk role (present since multi-disk
        management Phase B, but until this phase a pure inert label
        nothing ever acted on) into a real, working mechanism.
        `disk: null` means no automatic snapshots are possible
        regardless of `enabled` -- a disk must be configured first.
      operationId: getBackupConfig
      responses:
        "200":
          description: Current backup-snapshot configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
    put:
      summary: Update automatic backup-snapshot configuration
      description: >
        Mirrors PUT /system/daemon-config's own "only the fields given
        are changed" convention -- a request may set just `disk`, just
        `enabled`, just `interval_hours`, or any combination. `disk`
        must already carry the `backup` role -- validated at snapshot
        time (GET .../status shows the real outcome), not at PUT time,
        the same "pure bookkeeping, real validation happens where the
        real action happens" split every other storage-placement
        endpoint in this API already uses. `interval_hours: 0` means no
        automatic schedule -- POST .../snapshot-now remains the only
        trigger. When `enabled` or `interval_hours` actually change,
        the daemon's own periodic timer is re-armed immediately.
      operationId: putBackupConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupConfigUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "400":
          description: A present field failed its own type/range validation (interval_hours must be >= 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not persist the config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/backup-config/status:
    get:
      summary: Outcome of the most recent backup-snapshot attempt (manual or automatic)
      description: >
        `state: "never"` if no attempt has ever run this daemon
        lifetime. A snapshot attempt is synchronous (a plain JSON write
        to the configured disk, not a network fetch or external
        process), so this reports the immediately-preceding attempt,
        not an in-flight job the way disk format/storage migration
        status does.
      operationId: getBackupConfigStatus
      responses:
        "200":
          description: Most recent snapshot attempt outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSnapshotStatus"
  /system/backup-config/snapshot-now:
    post:
      summary: Writes a backup snapshot to the configured disk right now, regardless of schedule
      description: >
        Writes exactly the same bundle GET /system/backup itself
        produces (container definitions, networks, DNS records,
        installed-package state, every on-disk package recipe version,
        site config -- deliberately, and pre-existingly, never PKI
        keys/certs, the same scope GET /system/backup itself has always
        had) to "<mount_path>/backup.json" on the configured disk -- a
        single, always-current snapshot, not a timestamped history.
        `400` if no disk is configured, the configured disk doesn't
        carry the `backup` role, or it isn't currently mounted -- the
        real reason is in GET .../status's own `error` field either
        way, since this endpoint's own response is that same status
        object.
      operationId: postBackupConfigSnapshotNow
      responses:
        "200":
          description: >
            The snapshot attempt's own outcome (state may be "ok" or
            "failed" -- this always returns 200, since a failed
            snapshot attempt is a real, valid, fully-reported outcome,
            not a malformed request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSnapshotStatus"

  /system/site:
    get:
      summary: This install's declared identity (ADR-0046)
      description: >
        A real, operator-configurable instance_name/site_name/
        domain_suffix triple. instance_name labels this specific
        install (dashboard header, CLI, backup bundle) and is always
        non-empty (defaults to "kanxeo"); site_name/domain_suffix are
        client tooling's own suggested-FQDN pair
        (`<name>.<site_name>.<domain_suffix>`, or
        `<name>.<domain_suffix>` when site_name is empty) offered when
        creating a DNS record or issuing a PKI cert. All three are a
        convenience only, never enforced: DNS records and PKI SANs
        remain plain operator-supplied strings, unaffected by this
        endpoint's own value. Always 200s -- defaults (instance_name
        "kanxeo", site_name "", domain_suffix "internal") apply until
        the first PUT.
      operationId: getSystemSite
      responses:
        "200":
          description: Current site config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"
    put:
      summary: Sets this install's site identity
      description: >
        On success, also reissues this install's own "host" PKI leaf (ADR-0050) if a
        root CA is already bootstrapped, and reconciles a single auto-maintained DNS
        record for the same FQDN (ADR-0053) if this daemon was started with a real,
        specific --bind= address (not "0.0.0.0"/"127.0.0.1", neither of which has a
        single correct address to publish) -- both best-effort, never fail this request.
        The DNS record is also reconciled once at daemon startup, so it exists without
        needing a PUT after every restart.
      operationId: putSystemSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteConfig"
      responses:
        "200":
          description: Updated site config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"
        "400":
          description: >
            Invalid instance_name, site_name, or domain_suffix, or
            instance_name/domain_suffix missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Validated but persisting the new site config to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/daemon-config:
    get:
      summary: kanxeod's own listen port, HTTP/HTTPS exposure, and which network is currently its management one (Part 0.5)
      description: >
        A dedicated resource, distinct from generic network CRUD, since
        changing any of these fields has a real side effect -- a live
        listen-socket start/stop/rebind -- that plain network endpoints
        were never meant to trigger. management_network is not this
        resource's own stored state: it's reported here by querying
        network.c's own is_management flag live (GET /networks), the
        one source of truth for which network kanxeod is bound to.
        Always 200s -- defaults (port 80, http_enabled true,
        https_enabled false, https_port 443) apply until the first PUT.
      operationId: getDaemonConfig
      responses:
        "200":
          description: Current daemon configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonConfig"
    put:
      summary: Live-reconfigure kanxeod's listen port, HTTP/HTTPS listeners, or management network -- no restart
      description: >
        Accepts a partial body -- only the fields being changed. Since
        kanxeod runs as real PID 1 on an installed system (ADR-0011),
        there is no "restart the daemon" to pick up a change: each
        affected listener is created, bound, and added to epoll before
        the old one is torn down, so a failure rolls back to the
        still-working previous listener rather than leaving a gap. The
        request that triggered the change always finishes normally over
        its own already-accepted connection. Refuses (400) to leave
        both http_enabled and https_enabled false -- this daemon must
        always have at least one working listener. https_enabled=true
        fails (500) if no PKI host certificate exists yet to serve TLS
        with (see POST /pki/ca). management_network, if given, must
        name an existing network with has_address true (400/404
        otherwise); repointing clears is_management from whichever
        network previously held it and sets it on the new one, in a
        single all-or-nothing rebind alongside any port/http/https
        change in the same request. bind_ip (ADR-0068), if given, must
        be a real address within the (possibly just-repointed)
        management network's own subnet -- added to that network's
        bridge before the rebind. Any previous bind_ip is removed from
        its own bridge a couple of seconds later rather than
        immediately, to avoid a real race with this same request's own
        response delivery (see ADR-0068) -- the response itself
        already reflects the fully-applied new state by the time it's
        sent. port/https_port/http_enabled/https_enabled/https_port/
        bind_ip are only persisted once their real listener/bridge
        change has actually succeeded, so a stored value never claims
        a state that isn't really running.
      operationId: putDaemonConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonConfigPutRequest"
      responses:
        "200":
          description: Updated daemon configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonConfig"
        "400":
          description: >
            port/https_port out of range, both http_enabled and
            https_enabled false, management_network not a string, the
            named network has no address for kanxeod to bind to,
            bind_ip not a string/null, bind_ip not a valid address
            within the management network's subnet, or bind_ip given
            with no management network to bind it within
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: management_network names a network that doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            A listener failed to start/rebind (including https_enabled
            with no usable host certificate yet), the rtnetlink socket
            could not be opened or bind_ip could not be assigned to the
            bridge, or listener(s)/bridge changed live but the new
            state could not be persisted to disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/routes:
    get:
      summary: The box's own real kernel IPv4 routing table (ADR-0066)
      description: >
        A read-only rtnetlink dump (RTM_GETROUTE), not a Kanxeo-managed
        resource -- this exists purely so a real, installed box (no
        SSH, no general shell, ADR-0034) can be diagnosed at all. The
        "default" dest entry (if present) is the box's own upstream
        default route; gateway/interface are null for on-link routes
        the kernel derives automatically from each network's own
        assigned address (see GET /networks).
      operationId: getSystemRoutes
      responses:
        "200":
          description: The kernel's current IPv4 routing table
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items:
                      $ref: "#/components/schemas/KernelRoute"
        "500":
          description: The rtnetlink dump itself failed (transport-level, not a "no routes" case)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add a real IPv4 route to the host's own kernel routing table (ADR-0067 Part 3)
      description: >
        A thin wrapper over rtnl_route_add_ipv4() -- not a persisted
        Kanxeo resource, same as the GET above: nothing added here
        survives a reboot. Scoped to exactly what that primitive
        supports -- no interface/RTA_OIF binding, no route-replace
        semantics beyond plain NLM_F_CREATE.
      operationId: postSystemRoute
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteMutationRequest"
      responses:
        "204":
          description: Route added
        "400":
          description: >
            Invalid JSON body, prefix out of [0, 32], dest missing/invalid
            when prefix > 0, gateway invalid, or the kernel itself rejected
            the route (already exists, unreachable gateway, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not open the rtnetlink socket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a route from the host's own kernel routing table (ADR-0067 Part 3)
      description: >
        The mirror-image of the POST above, via rtnl_route_del_ipv4() --
        same body shape identifies which route to remove.
      operationId: deleteSystemRoute
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteMutationRequest"
      responses:
        "204":
          description: Route removed
        "400":
          description: Invalid JSON body, prefix out of [0, 32], dest missing/invalid when prefix > 0, or gateway invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No matching route found to delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not open the rtnetlink socket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/stats:
    get:
      summary: Host-wide load/CPU/memory/disk/network snapshot (ADR-0073)
      description: >
        The host-level counterpart to GET /containers/{name}/stats,
        mirroring its own conventions exactly: nested per-category
        objects, raw cumulative/monotonic counters only (never a
        pre-computed rate -- callers compute their own deltas). Every
        field is best-effort: a missing/unreadable source leaves that
        section zeroed rather than failing the whole request.
      operationId: getSystemStats
      responses:
        "200":
          description: Current host stats snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStats"
  /system/processes:
    get:
      summary: Every real process on the box, correlated to a container if any (ADR-0131)
      description: >
        A real, direct /proc scan -- every process on the host, not
        just ones this daemon itself spawned. Each entry's "container"
        field is populated by walking the process's own real host ppid
        chain against every currently-running container's own root pid
        (see ADR-0131 for why this, not a pid-namespace comparison) --
        empty string if the process isn't inside any known container.
        A point-in-time snapshot, same as GET /system/stats -- no
        history, call again for a fresh one.
      operationId: listSystemProcesses
      responses:
        "200":
          description: Current process list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostProcess"
  /system/processes/{pid}:
    delete:
      summary: Kill a host process (ADR-0131)
      description: >
        A real, immediate SIGKILL -- no grace period, unlike DELETE
        /containers/{name} (which has real container-lifecycle
        semantics). Refuses pid 1 and this daemon's own real pid
        outright (400) -- every other pid is allowed, including one
        that happens to belong to a running container (equivalent to
        that container crashing on its own; the existing exit handling
        already covers it).
      operationId: killSystemProcess
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Killed
        "400":
          description: pid is not a positive integer, or is pid 1 / this daemon's own pid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such pid currently running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/ping:
    get:
      summary: Poll the current/last ICMP ping job's status (ADR-0075)
      operationId: getSystemPing
      responses:
        "200":
          description: Current ping job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingStatus"
    post:
      summary: Start a real ICMP echo request against an IPv4 address (ADR-0075)
      description: >
        A real, hand-rolled ping -- no DNS involved, host must be a
        literal IPv4 address. 202 with the job's initial (pending)
        status; GET on this same path polls it. Resolves within a
        fixed ~2s timeout either way. v1 single-job constraint: 409 if
        a ping is already in flight.
      operationId: postSystemPing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host:
                  type: string
                  description: A literal IPv4 address (not a hostname).
      responses:
        "202":
          description: Ping started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingStatus"
        "400":
          description: Invalid JSON body or host is not a valid IPv4 address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another ping is already in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not send the ICMP echo (raw socket failed -- e.g. no CAP_NET_RAW)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/resolv:
    get:
      summary: The host's own outbound DNS resolver config (ADR-0076)
      operationId: getSystemResolv
      responses:
        "200":
          description: Current nameservers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvConfig"
    put:
      summary: Replace the host's own outbound DNS resolver config (ADR-0076)
      description: >
        Takes effect immediately -- writes the real, persisted file a
        real --init-mode boot bind-mounts onto /etc/resolv.conf, no
        reboot needed. An empty array clears it entirely (falls back
        to no outbound resolution, the historical default). Covers
        both pointing at one of this platform's own DNS containers
        (resolve its IP once, PUT it) and a real external resolver --
        this endpoint has no notion of containers, just a plain IP
        list.
      operationId: putSystemResolv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nameservers]
              properties:
                nameservers:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                  description: Up to 3 IPv4 addresses, tried in order (matches glibc's own MAXNS).
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvConfig"
        "400":
          description: Invalid JSON body, an entry isn't a valid IPv4 address, or more than 3 given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not persist the config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/state-storage:
    get:
      summary: Which disk (if any) is the active placement for Kanxeo's own state (ADR-0141 Phase 2)
      description: >
        `disk: null` means the default OS-disk placement (the original,
        pre-ADR-0141 behavior). A non-null disk is one that currently
        carries the `state-storage` role (POST /diskroles) and was
        successfully migrated onto via POST .../migrate below --
        state-storage covers this platform's own definition of itself:
        networks, DNS/LDAP/NTP/syslog-forwarding config, PKI (CA keys
        and every issued cert), container definitions, device mappings,
        site identity, and daemon/rolling-restart/TLS-throttle
        configuration -- never container workload data, never
        rebuildable content (images/packages/artifacts, their own
        separate `rebuildable-storage` concern), never logs (`log-
        storage`, its own separate concern).
      operationId: getStateStorage
      responses:
        "200":
          description: Current state-storage placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePlacement"
  /system/state-storage/migrate:
    get:
      summary: Status of the most recent (or currently running) state-storage migration job
      description: >
        Only one state-storage migration may be in flight at a time.
        Reports `{"state":"none"}` if no migration has ever run this
        daemon lifetime.
      operationId: getStateStorageMigrateStatus
      responses:
        "200":
          description: Migration job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
    post:
      summary: Moves Kanxeo's own state to a new disk, or back to the default OS-disk placement
      description: >
        `disk` is required -- a real disk name (must already carry the
        `state-storage` role and be currently mounted) or `null` to
        migrate back to the default OS-disk placement; omitting the
        field entirely is a 400, deliberately distinct from an explicit
        null. Async, two-phase (ADR-0141's own "Migration mechanics"):
        a forked child does the bulk permission-preserving copy while
        the daemon keeps operating normally against the *current*
        location the entire time (no pause, no readonly window); once
        that finishes, this daemon's own single-threaded reactor does
        one more synchronous pass (a second, fast copy -- cheap, since
        little changes during the bulk phase) and then repoints every
        affected subsystem's own live path, re-establishes the real
        `/etc/resolv.conf` bind mount against the new location,
        persists the new placement, and removes the old location's
        data. Returns 202 immediately with the job's initial
        `{"state":"running",...}` status; poll GET on this same path
        for completion -- a `state:"failed"` migration leaves the
        daemon still using the old location, completely untouched.
      operationId: migrateStateStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disk]
              properties:
                disk:
                  type: string
                  nullable: true
                  description: A Disk.name from GET /disks, or null for the default OS-disk placement.
      responses:
        "202":
          description: Migration job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
        "400":
          description: >
            disk field missing, invalid/unknown disk, disk is the OS
            disk, disk doesn't carry the state-storage role, or disk
            carries the role but isn't currently mounted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A migration is already running, or this is already the active placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not start the migration job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/log-storage:
    get:
      summary: Which disk (if any) is the active placement for Kanxeo's own consolidated log store (ADR-0141 Phase 3)
      description: >
        Same shape and same singleton-placement model as
        GET /system/state-storage above -- `disk: null` means the
        default OS-disk placement. A non-null disk carries the
        `log-storage` role and was successfully migrated onto via
        POST .../migrate below. Covers the consolidated log store
        (ADR-0070/ADR-0126: kernel dmesg, this daemon's own diagnostics,
        the per-request audit trail, and every container's stdout/
        stderr) -- never state, never rebuildable content.
      operationId: getLogStorage
      responses:
        "200":
          description: Current log-storage placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePlacement"
  /system/log-storage/migrate:
    get:
      summary: Status of the most recent (or currently running) log-storage migration job
      description: >
        Same shape as GET /system/state-storage/migrate above -- only
        one log-storage migration may be in flight at a time
        (independent of any concurrent state-storage migration, each
        kind has its own job slot).
      operationId: getLogStorageMigrateStatus
      responses:
        "200":
          description: Migration job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
    post:
      summary: Moves Kanxeo's own consolidated log store to a new disk, or back to the default OS-disk placement
      description: >
        Same contract as POST /system/state-storage/migrate above --
        `disk` required (a real, `log-storage`-role, currently-mounted
        disk name, or `null` for the default). Async, live, no pause:
        the finalize step is simpler than state-storage's own (a single
        consumer, `logstore.c`, no `/etc/resolv.conf`-style bind mount
        to re-establish) but handles the one real wrinkle this concern
        has that state-storage's files don't -- `logstore.c` holds a
        persistently-open file handle across writes, closed and
        re-opened against the new location as part of the repoint, not
        left silently writing to the old disk.
      operationId: migrateLogStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disk]
              properties:
                disk:
                  type: string
                  nullable: true
                  description: A Disk.name from GET /disks, or null for the default OS-disk placement.
      responses:
        "202":
          description: Migration job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
        "400":
          description: >
            disk field missing, invalid/unknown disk, disk is the OS
            disk, disk doesn't carry the log-storage role, or disk
            carries the role but isn't currently mounted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A migration is already running, or this is already the active placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not start the migration job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/rebuildable-storage:
    get:
      summary: Which disk (if any) is the active placement for images/packages/artifacts (ADR-0141 Phase 4)
      description: >
        Same shape and singleton-placement model as GET /system/state-
        storage. Covers content that's regenerable from recipes/sources
        if lost -- container images, installed packages, build
        artifacts, staged ISOs -- never state, never logs.
      operationId: getRebuildableStorage
      responses:
        "200":
          description: Current rebuildable-storage placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePlacement"
  /system/rebuildable-storage/migrate:
    get:
      summary: Status of the most recent (or currently running) rebuildable-storage migration job
      description: >
        Same shape as GET /system/state-storage/migrate -- its own
        independent job slot, alongside any concurrent state-storage or
        log-storage migration.
      operationId: getRebuildableStorageMigrateStatus
      responses:
        "200":
          description: Migration job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
    post:
      summary: Moves images/packages/artifacts to a new disk, or back to the default OS-disk placement
      description: >
        Same contract as POST /system/state-storage/migrate -- `disk`
        required (a real, `rebuildable-storage`-role, currently-mounted
        disk name, or `null` for the default). Async, live, no pause.
        Every consumer of this content (`image.c`, and `pkg.c`'s several
        distinct concerns -- package state, repo-sync config, cache
        config, artifact-fetch config, image-recipe-apply state) was
        confirmed, not assumed, to cache nothing but plain path strings
        with no persistently-open file handle of its own, so the
        finalize step is a straightforward repoint of each.
      operationId: migrateRebuildableStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disk]
              properties:
                disk:
                  type: string
                  nullable: true
                  description: A Disk.name from GET /disks, or null for the default OS-disk placement.
      responses:
        "202":
          description: Migration job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
        "400":
          description: >
            disk field missing, invalid/unknown disk, disk is the OS
            disk, disk doesn't carry the rebuildable-storage role, or
            disk carries the role but isn't currently mounted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A migration is already running, or this is already the active placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not start the migration job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/swap:
    get:
      summary: Whether the host swap file is enabled (ADR-0069)
      operationId: getSystemSwap
      responses:
        "200":
          description: Current swap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapStatus"
    post:
      summary: Create and activate a host swap file of the given size (ADR-0069)
      description: >
        Creates size_mb megabytes' worth of real, fallocate()'d disk
        space (never sparse), writes a real kernel swap-file header
        directly, and activates it via swapon(2). 409 if swap is
        already enabled -- disable it first to resize.
      operationId: postSystemSwap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size_mb]
              properties:
                size_mb:
                  type: integer
                  minimum: 64
                  maximum: 1048576
      responses:
        "200":
          description: Swap enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapStatus"
        "400":
          description: Invalid JSON body or size_mb out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Swap is already enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Swap file creation or activation failed (fallocate/swapon)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Deactivate and remove the host swap file (ADR-0069)
      operationId: deleteSystemSwap
      responses:
        "204":
          description: Swap disabled
        "409":
          description: Swap was not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: swapoff(2) failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/rolling-config:
    get:
      summary: >
        The configured rolling-restart jitter window (ADR-0124) -- how far
        apart a rolling image's own follow_rolling containers spread their
        restarts when that image auto-rebuilds.
      operationId: getSystemRollingConfig
      responses:
        "200":
          description: Current rolling-restart config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollingConfig"
    put:
      summary: Set the rolling-restart jitter window (ADR-0124)
      description: >
        Each follow_rolling container that needs restarting on a given
        reconciliation pass gets an independent, uniformly-random delay in
        [0, jitter_window_seconds] before its own restart fires -- 0 means
        no jitter, restart immediately. Spreads out the restarts of many
        containers following the same rolling image instead of firing them
        all in the same instant.
      operationId: putSystemRollingConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jitter_window_seconds]
              properties:
                jitter_window_seconds:
                  type: integer
                  minimum: 0
                  maximum: 3600
      responses:
        "200":
          description: Updated rolling-restart config (same shape as GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollingConfig"
        "400":
          description: jitter_window_seconds missing, not a number, or out of the 0-3600 range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/tls-throttle:
    get:
      summary: >
        Per-source-IP throttling config for repeated failed HTTPS handshakes
        (ADR-0134).
      operationId: getSystemTlsThrottle
      responses:
        "200":
          description: Current throttle config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsThrottleConfig"
    put:
      summary: Partially update the TLS throttle config (ADR-0134)
      description: >
        Fields omitted from the body are left unchanged, same convention
        GET/PUT /system/daemon-config and PUT /pkg/repo-config already use.
        A source that fails `threshold` HTTPS handshakes within
        `window_seconds` is refused outright -- on both the HTTPS and plain
        HTTP listeners -- for `block_seconds`. Loopback (127.0.0.1) is never
        throttled, so this daemon's own local admin access can't be locked
        out by a hostile source sharing the box.
      operationId: putSystemTlsThrottle
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                threshold:
                  type: integer
                  minimum: 1
                  maximum: 100000
                window_seconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                block_seconds:
                  type: integer
                  minimum: 1
                  maximum: 604800
                log_interval_seconds:
                  type: integer
                  minimum: 0
                  maximum: 3600
      responses:
        "200":
          description: Updated throttle config (same shape as GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsThrottleConfig"
        "400":
          description: A given field is out of range, or the JSON body is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/tls-throttle/status:
    get:
      summary: >
        Every source currently tracked for failed HTTPS handshakes (ADR-0134)
        -- live, in-memory state, not persisted, forgotten across a daemon
        restart the same way any other in-flight tracking this daemon keeps
        is.
      operationId: getSystemTlsThrottleStatus
      responses:
        "200":
          description: Currently tracked sources
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/TlsThrottleStatusEntry"

  /system/ntp:
    get:
      summary: Upstream NTP server address list used to sync the host clock (ADR-0110)
      operationId: getSystemNtp
      responses:
        "200":
          description: Current upstream list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NtpConfig"
    put:
      summary: Replace the upstream NTP server address list (ADR-0110)
      description: >
        Same list convention GET/PUT /system/resolv already has for
        DNS nameservers -- an empty array clears it entirely (the host
        then relies solely on any registered /ntp/servers container,
        if any). Tried after any registered server, in the order
        added, at every sync attempt (the hourly automatic one, or an
        on-demand POST /system/ntp/sync).
      operationId: putSystemNtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upstream]
              properties:
                upstream:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                  description: Up to 3 IPv4 addresses, tried in the order given.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NtpConfig"
        "400":
          description: Invalid JSON body, an entry isn't a valid IPv4 address, or more than 3 given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not persist ntp.conf
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/ntp/status:
    get:
      summary: Outcome of the most recent sync attempt (ADR-0110)
      operationId: getSystemNtpStatus
      responses:
        "200":
          description: Current sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NtpStatus"

  /system/ntp/sync:
    post:
      summary: Trigger one sync attempt now, rather than waiting for the next hourly automatic one (ADR-0110)
      description: >
        Builds the ordered candidate list (registered, currently-running
        /ntp/servers containers first, then the configured upstream
        addresses) and sends the first candidate its own SNTP request --
        the same v1 one-job-in-flight/202-then-poll-status shape POST
        /system/ping already established. Check GET /system/ntp/status
        once it lands for the outcome.
      operationId: postSystemNtpSync
      responses:
        "202":
          description: Sync started
        "400":
          description: Nothing configured -- no upstream addresses and no registered server containers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A sync attempt is already in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not start the sync job (socket/timer setup failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/time:
    get:
      summary: The host's current date/time (ADR-0110)
      operationId: getSystemTime
      responses:
        "200":
          description: Current host clock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeConfig"
    put:
      summary: Manually set the host clock (ADR-0110)
      description: >
        Real clock_settime(CLOCK_REALTIME, ...) -- immediate, host-wide
        effect, no reboot needed, same live-apply posture every other
        resource here has. Independent of NTP sync, which will
        overwrite it again at its own next scheduled or on-demand
        attempt.
      operationId: putSystemTime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unixtime]
              properties:
                unixtime:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Clock set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeConfig"
        "400":
          description: Invalid JSON body, unixtime negative, or clock_settime() failed (e.g. missing CAP_SYS_TIME)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ntp/servers:
    get:
      summary: List all registered NTP server bindings (ADR-0110)
      operationId: listNtpServers
      responses:
        "200":
          description: Binding list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/NtpServerBinding"
    post:
      summary: >
        Register a running container as an available internal NTP time source
        (task #753, mirrors POST /dns/servers and POST /ldap/servers). Simpler
        than either: NTP is itself a live query/response protocol, so this is
        pure bookkeeping -- no pid/pidfd, no config-file push, no signal. The
        container's own live IP is resolved fresh from the registry at every
        sync attempt, never cached here.
      operationId: createNtpServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NtpServerBindingCreateRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NtpServerBinding"
        "404":
          description: No such container, or it exists but isn't running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This container is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Too many registered NTP servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ntp/servers/{container}:
    delete:
      summary: Unregister an NTP server binding (does not touch the container itself)
      operationId: deleteNtpServer
      parameters:
        - name: container
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unregistered
        "404":
          description: No binding for this container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /syslog/targets:
    get:
      summary: List all registered syslog forward targets (ADR-0127)
      operationId: listSyslogTargets
      responses:
        "200":
          description: Target list
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyslogTarget"
    post:
      summary: >
        Register a running container as an optional, redundant syslog
        forward target (logging epic Part 2, ADR-0127, mirrors POST
        /ntp/servers). Every subsequent container-sourced log line
        (source="container" only) is also sent to it as a real RFC 3164
        UDP datagram -- alongside, never instead of, the consolidated
        log store (GET /system/logs), which stays the one source of
        truth this API and the web UI ever read from. Pure bookkeeping,
        same as NTP server registration: no pid/pidfd, the target's own
        live IP is resolved fresh from the registry at every send,
        never cached here. A send failure is silently dropped -- UDP
        syslog has never had delivery guarantees.
      operationId: createSyslogTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyslogTargetCreateRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyslogTarget"
        "404":
          description: No such container, or it exists but isn't running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This container is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Too many registered syslog forward targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /syslog/targets/{container}:
    delete:
      summary: Unregister a syslog forward target (does not touch the container itself)
      operationId: deleteSyslogTarget
      parameters:
        - name: container
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unregistered
        "404":
          description: No binding for this container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/logs:
    get:
      summary: Tail the consolidated log (kernel dmesg + kanxeod diagnostics + per-request audit trail + every container's own stdout/stderr, ADR-0070/ADR-0126)
      description: >
        Every kanxeoctl command and every web UI action is, underneath,
        a REST call this daemon already handles -- one entry is logged
        per mutating request (source "audit"; POST/PUT/DELETE only --
        every GET is excluded, ADR-0132, since a GET is a query never
        an action, and the web dashboard's own routine ~30-request
        poll cycle every 2s would otherwise drown real actions in
        noise for no diagnostic value). Combined with real kernel
        dmesg (source "kernel"), kanxeod's
        own internal diagnostics (source "kanxeod"), and -- since
        ADR-0126 -- every container's own stdout/stderr (source
        "container", always captured regardless of that container's
        own "capture_output" opt-in, which only additionally mirrors
        the same bytes into that one container's own
        GET /containers/{name} tail) in one chronologically-ordered
        store.
      operationId: getSystemLogs
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [kernel, kanxeod, audit, container]
        - name: level
          in: query
          required: false
          schema:
            type: string
        - name: container
          in: query
          required: false
          description: >
            Exact match against an entry's own "container" field --
            only ever non-empty on a source="container" entry.
            ADR-0126.
          schema:
            type: string
        - name: regex
          in: query
          required: false
          description: >
            POSIX extended regular expression (case-insensitive),
            matched against "msg". A malformed pattern is a 400, not a
            silent empty result. ADR-0126.
          schema:
            type: string
        - name: tail
          in: query
          required: false
          description: Max entries to return, newest last. Defaults to 1000 if omitted or out of [1, 5000].
          schema:
            type: integer
        - name: since
          in: query
          required: false
          description: Unix seconds -- only entries at or after this time.
          schema:
            type: integer
      responses:
        "200":
          description: Matching entries, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "400":
          description: Malformed regex pattern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/logs/config:
    get:
      summary: The log store's current total size cap and minimum severity floor (ADR-0070)
      operationId: getSystemLogsConfig
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsConfig"
    put:
      summary: Set the log store's total size cap and/or its minimum severity floor (ADR-0070)
      description: >
        Both fields are optional and independent (at least one is
        required) -- setting one never requires resupplying the other.
        `max_bytes` is enforced at segment granularity (8 rotating
        segments), not byte-exact -- a few percent of slop against this
        value is expected. Affects future segment rotation only, never
        retroactively shrinks an already-large segment. `min_level` is
        checked at write time, before an entry ever touches a segment
        file -- not merely at `GET`'s own `level` query filter (which
        only filters what's already stored). Real, deployment-motivated
        addition: this closes a genuine gap where a real build failure's
        own captured output was truncated away entirely by the old,
        far smaller `LOGSTORE_MSG_MAX` (raised 512 -> 4096 in the same
        change) before this field even existed -- `min_level` lets an
        operator suppress routine chatter (e.g. verbose kernel
        `debug`/`notice` dmesg lines) without losing anything more
        severe, addressing "settable so we do not over-log" without
        sacrificing "extensive enough to catch real issues."
      operationId: putSystemLogsConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogsConfig"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsConfig"
        "400":
          description: >
            Neither field given, max_bytes out of [1 MB, 100 GB], or
            min_level not a recognized severity name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not persist the new config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/iso:
    get:
      summary: Status of the most recent server-side installer ISO build (ADR-0064)
      description: >
        Polling endpoint for POST /system/iso's own async job -- the
        exact shape GET /pkg/hostbuild/{name} already established for
        its own fire-and-forget job. state is "none" until the first
        POST this daemon has ever handled.
      operationId: getSystemIso
      responses:
        "200":
          description: Current ISO build status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsoStatus"
    post:
      summary: Assembles a fresh installer ISO server-side, non-blocking (ADR-0064)
      description: >
        Closes the API-First Mandate gap ADR-0063 deliberately left
        open: image/src/mkinstalleriso.c was a dev-machine-only tool an
        operator had to run by hand; this makes ISO assembly a real
        daemon capability, forked and pidfd-tracked exactly like POST
        /pkg/hostbuild's own async jobs (the response is 202, poll GET
        /system/iso for the result). Reuses whatever the most recent
        "kanxeo"/"kernel"/"isotools" hostbuild rounds already harvested
        (POST /pkg/hostbuild) -- it does not trigger any of them itself.
        Every field is optional; an empty body reproduces mkinstalleriso's
        own original default, a generic ISO with kernel_args left as the
        "CHANGEME" placeholder an operator edits at the GRUB boot menu.
        Requires a real Secure Boot signing key pair, staged out of band
        by the operator at <data-dir>/keys/kanxeo-signing.{key,crt,cer}
        -- deliberately never generated, fetched, or copied there by
        kanxeod itself (the same real security posture this project's
        own image/keys/ already has: a release-signing private key must
        never propagate onto every deployed box).
      operationId: postSystemIso
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IsoBuildRequest"
      responses:
        "202":
          description: ISO build started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsoStatus"
        "400":
          description: >
            Invalid JSON body, or a real precondition is missing --
            the "kanxeo"/"kernel"/"isotools" hostbuild artifacts, or
            the operator-provided signing key pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An ISO build is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers:
    get:
      summary: List all containers known to this daemon
      operationId: listContainers
      responses:
        "200":
          description: Container list
          content:
            application/json:
              schema:
                type: object
                required: [containers]
                properties:
                  containers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Container"
    post:
      summary: Create and start a container
      operationId: createContainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerCreateRequest"
      responses:
        "201":
          description: Container created and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "400":
          description: Invalid request (bad fields, or the named image's rootfs does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A container with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            A real internal failure partway through creation: no free IP
            addresses left on an auto-allocated network, the container
            table is full, the container's own on-disk directory or its
            staged files[] content could not be written, or the
            underlying clone3()/registry create itself failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devices:
    get:
      summary: List host PCI/USB devices discoverable via sysfs, available for passthrough
      description: >
        Read-only: unlike /networks, devices are real host hardware, not
        something this daemon creates. Re-enumerated fresh from
        /sys/bus/usb/devices and /sys/bus/pci/devices on every call, never
        persisted. Reference a device by its `id` in a container's own
        `devices` field (see ContainerCreateRequest) to grant it access.
      operationId: listDevices
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"

  /disks:
    get:
      summary: List real host block devices (whole disks only), for multi-disk management
      description: >
        Read-only, live-enumerated from /sys/class/block on every call
        (never persisted), the same real-hardware convention /devices
        already established -- partitions are never listed, only
        independently assignable whole disks. `is_os_disk` flags the
        one disk holding this platform's own fixed ESP/root-a/root-b/
        config/containers partition layout (never a candidate for role
        assignment or formatting); every other disk is available for a
        role (POST /diskroles) and, once role-assigned, formatting
        (POST /disks/{disk_name}/format). A container's own storage
        disk is selected at creation time (POST /containers' `disk`
        field, ADR-0102) -- moving an *existing* container's storage
        after creation is a separate, not-yet-built follow-up
        (ADR-0142, see docs/roadmap/ROADMAP.md).
      operationId: listDisks
      responses:
        "200":
          description: Disk list
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Disk"

  /disks/{disk_name}/format:
    get:
      summary: Status of the most recent (or currently running) format+mount job for this disk
      description: >
        Only one format job may be in flight at this daemon at a time
        (the same v1 single-job constraint pkg install/hostbuild, ISO
        assembly, and pkg bootstrap's toolchain_url fetch already have).
        Reports `{"state":"none"}` if no job has ever run for this
        specific disk_name this daemon lifetime -- including when a
        job ran/is running for a *different* disk, since a status check
        should never show another disk's unrelated job.
      operationId: getDiskFormatStatus
      parameters:
        - name: disk_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Format job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskFormatStatus"
    post:
      summary: Destructively formats (mkfs.ext4 or mkfs.btrfs) and mounts a disk that already has an assigned role
      description: >
        Multi-disk management Phase C. Deliberately a SEPARATE, explicit
        action from POST /diskroles (role assignment never has a
        destructive side effect of its own) -- confirmed with the
        operator during design. The request body's `confirm_disk_name`
        must match disk_name in the URL exactly, a deliberate double-
        confirmation before anything irreversible happens: this
        overwrites every byte of existing content on the disk with a
        fresh filesystem (ext4 by default, or btrfs via `fs_type`,
        ADR-0104), then mounts it. The target disk must currently exist
        (GET /disks), must not be the OS disk, and must already have a
        role assigned (POST /diskroles) -- format is never allowed to
        run against a disk nothing has expressed intent for yet. Async:
        returns 202 immediately with the job's initial
        `{"state":"running",...}` status; poll GET on this same path for
        completion. Mounted at a fixed path under this platform's own
        data directory by default; a container-storage-role disk can
        also be selected explicitly per container via POST /containers'
        own `disk` field (ADR-0102, Phase D, already built).
      operationId: formatDisk
      parameters:
        - name: disk_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiskFormatRequest"
      responses:
        "202":
          description: Format job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskFormatStatus"
        "400":
          description: >
            confirm_disk_name missing/mismatched, invalid disk name,
            disk not found, disk is the OS disk, or disk has no
            assigned role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            A format job is already running (this daemon-wide, v1
            single-job limit), or this disk is the active placement for
            state-storage, log-storage, or rebuildable-storage, or the
            currently configured backup-config disk (ADR-0141), or one
            or more containers currently have their own storage on this
            disk (ADR-0102/ADR-0142) -- formatting it would destroy
            live data; migrate away first (POST
            /containers/{name}/migrate-storage for a container, or for
            the daemon-wide kinds POST .../migrate / PUT a different
            backup-config disk/null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Could not create the mount point directory, or could not start the format job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devicemaps:
    get:
      summary: List persistent, operator-named device mappings (ADR-0048)
      description: >
        Unlike /devices (ephemeral, re-enumerated every call, never
        persisted), a device mapping is a real, named, persisted
        binding an operator creates once and references by name
        thereafter -- in a container's own `devices` field, or here.
        Each entry is still resolved fresh against current hardware on
        every call (`present`/`resolved_ids`), never cached -- only the
        *mapping itself* (name -> selector) persists, not a hardware
        snapshot.
      operationId: listDeviceMaps
      responses:
        "200":
          description: Mapping list
          content:
            application/json:
              schema:
                type: object
                required: [devicemaps]
                properties:
                  devicemaps:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceMap"
    post:
      summary: Creates a new device mapping
      description: >
        Real and creatable even for hardware that isn't currently
        plugged in -- an operator predefining a mapping before
        plugging the device in, or one that's temporarily unplugged,
        are both legitimate states (`present: false`), not errors.
      operationId: createDeviceMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceMapCreateRequest"
      responses:
        "201":
          description: Mapping created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceMap"
        "400":
          description: Invalid name, kind, or selector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A mapping with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The mapping table is full, or persisting the new mapping to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devicemaps/{name}:
    delete:
      summary: Removes a device mapping
      description: >
        Does not touch anything about a container already using this
        mapping's name -- device grants are resolved once, at
        container-creation time, not re-resolved live afterward.
      operationId: deleteDeviceMap
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: No mapping with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The mapping exists but persisting its removal to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /diskroles:
    get:
      summary: List persisted disk role assignments -- multi-disk management Phase B (ROADMAP.md)
      description: >
        Unlike /disks (ephemeral, re-enumerated every call, never
        persisted), a disk role is a real, persisted binding an
        operator assigns once to a real disk name (from GET /disks)
        and that role stays assigned until explicitly removed. Each
        entry is still resolved fresh against currently-present disks
        on every call (`present`), never cached -- only the binding
        itself (disk_name -> role) persists, not a hardware snapshot.
      operationId: listDiskRoles
      responses:
        "200":
          description: Disk role list
          content:
            application/json:
              schema:
                type: object
                required: [diskroles]
                properties:
                  diskroles:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiskRole"
    post:
      summary: Assigns a role to a disk
      description: >
        Real and creatable even for a disk_name that isn't currently
        present (`present: false` on GET, not an error -- the same
        tolerant convention /devicemaps already established for
        hardware that might be temporarily absent). Always rejected
        for the one disk currently holding this platform's own fixed
        OS-disk layout (`is_os_disk` on GET /disks) -- it is never a
        role-assignment candidate.
      operationId: createDiskRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiskRoleCreateRequest"
      responses:
        "201":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskRole"
        "400":
          description: Invalid disk_name, invalid role, or disk_name is the real OS disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This disk already has a role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The role table is full, or persisting the new assignment to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /diskroles/{disk_name}:
    delete:
      summary: Removes a disk's role assignment
      operationId: deleteDiskRole
      parameters:
        - name: disk_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: No role assigned to this disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            This disk is the active placement for state-storage,
            log-storage, or rebuildable-storage, or the currently
            configured backup-config disk (ADR-0141), or one or more
            containers currently have their own storage on this disk
            (ADR-0102/ADR-0142) -- migrate away first (POST
            /system/{state,log,rebuildable}-storage/migrate, PUT
            /system/backup-config with a different disk/null, or POST
            /containers/{name}/migrate-storage for a container).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The role exists but persisting its removal to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /networks:
    get:
      summary: List all networks known to this daemon
      operationId: listNetworks
      responses:
        "200":
          description: Network list
          content:
            application/json:
              schema:
                type: object
                required: [networks]
                properties:
                  networks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Network"
    post:
      summary: Create a network (a real bridge, created immediately and persisted across daemon restarts)
      operationId: createNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreateRequest"
      responses:
        "201":
          description: Network created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          description: Invalid name, invalid/misaligned subnet, prefix_len out of range, or subnet overlaps an existing network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A network with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The network table is full, or creating the real bridge failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /networks/{name}:
    get:
      summary: Inspect one network
      operationId: getNetwork
      parameters:
        - $ref: "#/components/parameters/NetworkName"
      responses:
        "200":
          description: Network detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "404":
          description: No network with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a network (deletes its bridge)
      operationId: deleteNetwork
      parameters:
        - $ref: "#/components/parameters/NetworkName"
      responses:
        "204":
          description: Removed
        "404":
          description: No network with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Still in use by at least one container, or this is the
            management network (is_management -- repoint kanxeod's own
            bind address to a different network first via
            PUT /system/daemon-config, then delete this one)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The network exists but deleting its real bridge failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /networks/{name}/interfaces:
    post:
      summary: >
        Attach a real host network interface to this network's bridge --
        the "physical ethernet on a host-managed switch" mechanism.
        ifname must be a currently assignable "net:<ifname>" device (see
        GET /devices) -- not already moved into a container's netns, and
        not already attached anywhere via this endpoint. vlan_id 0/omitted
        enslaves ifname directly (untagged); a nonzero vlan_id instead
        creates and enslaves an 802.1q "<ifname>.<vlan_id>" sub-interface,
        leaving ifname itself free to attach (with a different vlan_id) to
        other networks.
      operationId: attachNetworkInterface
      parameters:
        - $ref: "#/components/parameters/NetworkName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkInterfaceAttachRequest"
      responses:
        "201":
          description: Attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          description: Unknown/unassignable interface, invalid vlan_id, or the derived name wouldn't fit IFNAMSIZ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No network with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This interface is already attached to this network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: This network's own interface table is full, or the real attach operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /networks/{name}/interfaces/{ifname}:
    delete:
      summary: Detach a previously-attached interface -- releases it from the bridge, or deletes its VLAN sub-interface
      operationId: detachNetworkInterface
      parameters:
        - $ref: "#/components/parameters/NetworkName"
        - name: ifname
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,15}$"
      responses:
        "204":
          description: Detached
        "404":
          description: No such network, or this interface isn't attached to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            This is the management network (is_management) -- repoint
            kanxeod's own bind address to a different network first via
            PUT /system/daemon-config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Attached but the real detach operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images:
    get:
      summary: List every image known to this daemon (each a directory under images_dir with its own rootfs/)
      operationId: listImages
      responses:
        "200":
          description: Image list
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/Image"
    post:
      summary: >
        Creates an empty image (just a rootfs/ directory) and immediately seeds its
        C runtime (ld.so/libc.so.6/libtinfo.so.6, see ADR-0023) so it's usable right
        away -- POST /pkg/install's own image field would otherwise only create one
        implicitly, on its first successful install into a name never seen before.
      operationId: createImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageCreateRequest"
      responses:
        "201":
          description: Image created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An image with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Creating the rootfs directory or seeding its C runtime failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images/{name}:
    get:
      summary: Inspect one image
      operationId: getImage
      parameters:
        - $ref: "#/components/parameters/ImageName"
      responses:
        "200":
          description: Image detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          description: No image with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The image exists but reading its detail back failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: >
        Removes an image's entire rootfs directory. Refused (400) for "base" itself
        (every container's own default, never removable); refused (409) if a running
        container still references it, or if any package (see GET /pkg) is still
        tracked against it -- remove those first.
      operationId: deleteImage
      parameters:
        - $ref: "#/components/parameters/ImageName"
      responses:
        "204":
          description: Removed
        "400":
          description: This is the base image, which cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No image with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Still referenced by a running container, or still has packages installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The image exists and is otherwise removable, but deleting its rootfs directory failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images/{name}/manifest:
    post:
      summary: >
        Upserts one {package, mode, version} entry into name's own manifest
        (ADR-0107) -- package already present has its mode/version updated
        in place, otherwise appended. Declares operator intent only; does
        not itself trigger a rebuild (a separate, automatic mechanism for
        rolling entries).
      operationId: setImageManifestEntry
      parameters:
        - $ref: "#/components/parameters/ImageName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package, mode, version]
              properties:
                package:
                  type: string
                mode:
                  type: string
                  enum: [pinned, rolling]
                version:
                  type: string
      responses:
        "204":
          description: Manifest entry set
        "400":
          description: package/mode/version missing, invalid package name, mode not "pinned"/"rolling", or version empty/too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No image with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The image's manifest is full, or writing manifest.json failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images/{name}/manifest/{package}:
    delete:
      summary: >
        Removes package's entry from name's own manifest (ADR-0107), if
        present -- a no-op, not an error, if it's already absent.
      operationId: unsetImageManifestEntry
      parameters:
        - $ref: "#/components/parameters/ImageName"
        - name: package
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Manifest entry removed (or was already absent)
        "404":
          description: No image with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Writing manifest.json failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images/recipes:
    get:
      summary: >
        List image recipes found on disk (ADR-0123, Part 4 of the pkg/
        redesign) -- metadata only, one entry per image name (a recipe's
        own name is always its target image's name, a 1:1 relationship).
      operationId: listImageRecipes
      responses:
        "200":
          description: Recipe list
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageRecipe"
    post:
      summary: >
        Adds or replaces the image recipe for name. content is parsed and
        validated before anything on disk changes -- image_packages= is
        required (whitespace-separated "package:mode:version" entries,
        mode one of pinned/rolling); image_artifact_sha256= is optional.
      operationId: addImageRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name:
                  type: string
                  description: The target image's own name -- an image recipe's name is always its image's name.
                content:
                  type: string
                  description: The full text of an image recipe file (image_packages=/image_artifact_sha256=).
      responses:
        "204":
          description: Recipe added/replaced
        "400":
          description: name/content missing, invalid name, or content failed to parse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Validated but writing the recipe file to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images/recipes/{name}:
    get:
      summary: One image recipe's own {name,content} -- the raw recipe text.
      operationId: getImageRecipe
      parameters:
        - $ref: "#/components/parameters/ImageName"
      responses:
        "200":
          description: Recipe detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRecipeDetail"
        "404":
          description: No recipe for this image name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Removes name's own image recipe. Does not affect the image itself or anything already installed via it.
      operationId: deleteImageRecipe
      parameters:
        - $ref: "#/components/parameters/ImageName"
      responses:
        "204":
          description: Recipe removed
        "404":
          description: No recipe for this image name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images/{name}/apply-recipe:
    post:
      summary: >
        Applies name's own already-stored image recipe (ADR-0123). The
        common case bulk-declares the manifest synchronously (204) --
        exactly what N manual POST /images/{name}/manifest calls would
        already do, no rootfs touched; packages still need real
        POST /pkg/install calls afterward to actually be built. A fully
        "pinned" recipe with a matching image_artifact_sha256 and a
        configured plain-HTTP artifact server (PUT /pkg/artifact-config,
        reused from Part 3 under a distinct images/ URL prefix) instead
        starts an async whole-rootfs fetch (202) -- poll
        GET /images/recipe-apply-status for the outcome.
      operationId: applyImageRecipe
      parameters:
        - $ref: "#/components/parameters/ImageName"
      responses:
        "204":
          description: Recipe applied synchronously (bulk-declare path)
        "202":
          description: Async artifact fetch started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRecipeApplyStatus"
        "404":
          description: No recipe stored for this image name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A package install/hostbuild/image-recipe-apply is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /images/recipe-apply-status:
    get:
      summary: The most recent image-recipe-apply artifact fetch's own state/image/error.
      operationId: getImageRecipeApplyStatus
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRecipeApplyStatus"

  /dns/records:
    get:
      summary: List all DNS records known to this daemon
      operationId: listDnsRecords
      responses:
        "200":
          description: Record list
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/DnsRecord"
    post:
      summary: Create a DNS record (name -> IPv4 address), persisted across daemon restarts
      description: >
        A `name` with no `.` gets this install's own site suffix appended by default
        (`<name>.<site_name>.<domain_suffix>`, ADR-0052) -- fully overridable by
        including a `.` in the submitted name, in which case it's stored exactly as
        given. Convenience only: an already-existing bare record is never retroactively
        touched.
      operationId: createDnsRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DnsRecordCreateRequest"
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsRecord"
        "400":
          description: Invalid hostname or ip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A record with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The record table is full, or persisting the new record to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dns/records/{name}:
    get:
      summary: Inspect one DNS record
      operationId: getDnsRecord
      parameters:
        - $ref: "#/components/parameters/DnsRecordName"
      responses:
        "200":
          description: Record detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsRecord"
        "404":
          description: No record with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Edit an existing DNS record's ip in place (task #749)
      description: >
        Full field replacement of `ip` only -- `name` is authoritative from the URL
        path and is never re-qualified or renamed by this call (unlike `POST
        /dns/records`'s own bare-label qualification, which only ever applies at
        creation time).
      operationId: updateDnsRecord
      parameters:
        - $ref: "#/components/parameters/DnsRecordName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                  format: ipv4
      responses:
        "200":
          description: Record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsRecord"
        "400":
          description: Invalid ip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No record with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a DNS record
      operationId: deleteDnsRecord
      parameters:
        - $ref: "#/components/parameters/DnsRecordName"
      responses:
        "204":
          description: Removed
        "404":
          description: No record with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The record exists but persisting its removal to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dns/servers:
    get:
      summary: List all registered DNS server bindings
      operationId: listDnsServers
      responses:
        "200":
          description: Binding list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DnsServerBinding"
    post:
      summary: >
        Register a running container as a DNS-serving target: writes the current full
        record set (dnsmasq --addn-hosts format) to hosts_path inside that container's
        own filesystem, and sends it SIGHUP to reload. Every subsequent record change
        re-writes the file and re-sends SIGHUP for as long as this binding exists.
      operationId: createDnsServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DnsServerBindingCreateRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsServerBinding"
        "400":
          description: hosts_path missing, not absolute, or contains ".."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No running container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This container is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The binding table is full, or the initial hosts_path write failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dns/servers/{container}:
    delete:
      summary: Unregister a DNS server binding (does not touch the file or the container itself)
      operationId: deleteDnsServer
      parameters:
        - $ref: "#/components/parameters/DnsServerContainerName"
      responses:
        "204":
          description: Unregistered
        "404":
          description: No binding for this container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ldap/servers:
    get:
      summary: List all registered LDAP server bindings
      operationId: listLdapServers
      responses:
        "200":
          description: Binding list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/LdapServerBinding"
    post:
      summary: >
        Register a running container as the LDAP-serving target (task #725, mirrors
        POST /dns/servers). Unlike DNS, registration itself never touches the
        container's filesystem or sends any signal -- glauth runs a real fsnotify
        watcher on its own config file (`watchconfig = true`) and reloads
        automatically on any change, so registration is pure bookkeeping: it
        records where config_path (glauth's own config file, the one it was
        started with -c) lives, for the LDAP user/group CRUD endpoints (task #726)
        to render into.
      operationId: createLdapServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapServerBindingCreateRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapServerBinding"
        "400":
          description: config_path missing, not absolute, or contains ".."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No running container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This container is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The binding table is full, or persisting the binding failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ldap/servers/{container}:
    delete:
      summary: Unregister an LDAP server binding (does not touch the container itself)
      operationId: deleteLdapServer
      parameters:
        - $ref: "#/components/parameters/LdapServerContainerName"
      responses:
        "204":
          description: Unregistered
        "404":
          description: No binding for this container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ldap/groups:
    get:
      summary: List every LDAP group (task #726)
      operationId: listLdapGroups
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/LdapGroup"
    post:
      summary: >
        Create an LDAP group. Kanxeo itself is the durable source of truth
        (same model as DNS records); the group is also written through into
        every currently-registered, currently-running LDAP server's own
        config file immediately (glauth's own fsnotify watcher picks up the
        change, no signal needed).
      operationId: createLdapGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapGroupCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapGroup"
        "400":
          description: Invalid name or gidnumber
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A group with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ldap/groups/{name}:
    get:
      summary: Fetch one LDAP group
      operationId: getLdapGroup
      parameters:
        - $ref: "#/components/parameters/LdapGroupName"
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapGroup"
        "404":
          description: No such group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Edit an existing LDAP group's gidnumber in place, or rename it (task #750, ADR-0147)
      description: >
        Full field replacement of `gidnumber`, `name` is authoritative from
        the URL path for identifying WHICH group -- but a real, different
        `name` given in the body renames the group (ADR-0147; omitted or
        identical means no rename, the original behavior). Unlike `POST
        /ldap/groups`, gidnumber is never auto-allocated here: it is always
        required in the body, matching every other PUT resource's "full
        replacement, no create-time convenience" semantics. gidnumber changes
        do not cascade to any user currently referencing the old gidnumber --
        callers are responsible for updating affected users themselves if
        needed. A rename, however, DOES cascade in exactly one place: if the
        group's old name is currently a member of `hostauth-config`'s own
        `admin_groups` list, that list is rewritten to the new name too,
        automatically -- a renamed admin group can never silently fall out of
        write-gating. External config referencing the group's old rendered
        LDAP DN (`cn=<user>,ou=<old-name>,<base-dn>` for each of its members)
        is not automatically updated -- this daemon has no visibility into
        config it didn't itself render.
      operationId: updateLdapGroup
      parameters:
        - $ref: "#/components/parameters/LdapGroupName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gidnumber]
              properties:
                gidnumber:
                  type: integer
                name:
                  type: string
                  description: >
                    Omit, or repeat the current name, to leave it unchanged.
                    A real, different name renames the group in place.
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapGroup"
        "400":
          description: Invalid gidnumber, or invalid new name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: gidnumber already used by a different group, or new name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an LDAP group (also removed from every registered server's config)
      operationId: deleteLdapGroup
      parameters:
        - $ref: "#/components/parameters/LdapGroupName"
      responses:
        "204":
          description: Deleted
        "404":
          description: No such group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ldap/users:
    get:
      summary: List every LDAP user (task #726)
      operationId: listLdapUsers
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/LdapUser"
    post:
      summary: >
        Create an LDAP user. Same durable-record-store + write-through model
        as groups. password, if given, is hashed with SHA-256 (glauth's own
        "passsha256" config field, via kanxeod's already-linked OpenSSL
        libcrypto) -- never stored or echoed in plaintext, and never
        returned by any GET (only a has_password boolean is).
      operationId: createLdapUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapUserCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapUser"
        "400":
          description: Invalid name/uidnumber, or primarygroup doesn't name an existing group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A user with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ldap/users/{name}:
    get:
      summary: Fetch one LDAP user
      operationId: getLdapUser
      parameters:
        - $ref: "#/components/parameters/LdapUserName"
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapUser"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: >
        Update an existing LDAP user -- full field replacement, except
        password: omitting it from the request body leaves the existing
        credential unchanged (an empty string is treated the same as
        omitting it).
      description: >
        `name` in the URL path identifies WHICH user; a real, different
        `name` in the body renames it (ADR-0147 -- omitted or identical means
        no rename). No cascade needed on the user side (nothing in this
        directory indexes another record by a user's own name the way
        `admin_groups` indexes `hostauth-config` by group name); external
        config referencing the user's old rendered LDAP DN is not
        automatically updated, same caveat as an LDAP group rename.
      operationId: updateLdapUser
      parameters:
        - $ref: "#/components/parameters/LdapUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapUserCreateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapUser"
        "400":
          description: Invalid uidnumber, invalid new name, or primarygroup doesn't name an existing group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: New name already taken by a different user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an LDAP user (also removed from every registered server's config)
      operationId: deleteLdapUser
      parameters:
        - $ref: "#/components/parameters/LdapUserName"
      responses:
        "204":
          description: Deleted
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ldap/config:
    get:
      summary: >
        Fetch the current start_uid/start_gid floor used by ldap_uid_alloc()
        and ldap_gid_alloc() (task #748) -- the value POST /ldap/users and
        POST /ldap/groups auto-allocate from when uidnumber/gidnumber is
        omitted from the request body. Defaults to 10000/10000 until changed.
      operationId: getLdapConfig
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapConfig"
    put:
      summary: >
        Set the start_uid/start_gid floor. Takes effect immediately for the
        next auto-allocated uidnumber/gidnumber; does not renumber any
        existing user or group. Both fields are required and must be > 0.
      operationId: updateLdapConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapConfig"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapConfig"
        "400":
          description: start_uid or start_gid not a positive integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/ca:
    get:
      summary: Inspect the root CA (never includes the private key)
      operationId: getPkiCa
      responses:
        "200":
          description: CA detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCa"
        "404":
          description: CA not bootstrapped yet -- POST /pki/ca first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The CA is bootstrapped but reading it back from disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: >
        Bootstraps the single root CA (self-signed keypair, generated via the system's
        real openssl binary). The CA private key is never returned over the API, in any
        endpoint, ever. A second call is a 409 -- this endpoint never regenerates an
        existing CA; see POST /pki/reset (ADR-0049) for that. On success, also (re)issues
        this install's own "host" leaf (ADR-0050) if site config is already set --
        best-effort, never fails this request.
      operationId: createPkiCa
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkiCaCreateRequest"
      responses:
        "201":
          description: CA bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCa"
        "400":
          description: Invalid common_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: CA is already bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The underlying openssl keypair/cert generation or the resulting write to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/intermediate:
    get:
      summary: Inspect the intermediate CA (never includes the private key)
      operationId: getPkiIntermediate
      responses:
        "200":
          description: Intermediate CA detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCa"
        "404":
          description: Intermediate not bootstrapped yet -- POST /pki/intermediate first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The intermediate is bootstrapped but reading it back from disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: >
        Bootstraps a second CA tier (ADR-0046): a real intermediate keypair and cert,
        signed BY the root (not self-signed). Requires the root to already be
        bootstrapped (400 otherwise); a second call is a 409, same as /pki/ca's own
        one-shot-only precedent. Once this succeeds, every future POST /pki/certs leaf
        is signed by the intermediate instead of the root automatically -- transparent
        to that endpoint, no separate opt-in. GET /pki/certs/{name} and the tls.crt a
        running container receives via pki_issue both then carry the real, complete
        chain (leaf + intermediate). The intermediate private key is never returned
        over the API, same as the root's. On success, also reissues this install's own
        "host" leaf (ADR-0050) so it's signed by the intermediate too -- best-effort,
        never fails this request.
      operationId: createPkiIntermediate
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkiIntermediateCreateRequest"
      responses:
        "201":
          description: Intermediate bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCa"
        "400":
          description: Invalid common_name, or the root CA isn't bootstrapped yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Intermediate is already bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The underlying openssl keypair/cert generation or the resulting write to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/certs:
    get:
      summary: List all issued leaf certificates (metadata only -- never a key)
      operationId: listPkiCerts
      responses:
        "200":
          description: Cert list
          content:
            application/json:
              schema:
                type: object
                required: [certs]
                properties:
                  certs:
                    type: array
                    items:
                      $ref: "#/components/schemas/PkiCert"
    post:
      summary: >
        Issues a leaf certificate signed by the root CA. The response is the ONLY place
        the leaf private key is ever returned -- neither the list nor the single-get
        endpoint includes one again afterward. A `name` with no `.` gets this install's
        own site suffix appended by default (CN and, when `sans` is omitted, the default
        SAN too -- ADR-0052), fully overridable by including a `.`. Never applied to an
        explicitly-supplied `sans` entry.
      operationId: createPkiCert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkiCertCreateRequest"
      responses:
        "201":
          description: Cert issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCertIssued"
        "400":
          description: Invalid name/sans, or CA not bootstrapped yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A cert with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            The cert table is full, or the underlying openssl signing
            operation or the resulting write to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/certs/{name}:
    get:
      summary: Inspect one issued certificate (metadata + cert_pem -- never the key)
      operationId: getPkiCert
      parameters:
        - $ref: "#/components/parameters/PkiCertName"
      responses:
        "200":
          description: Cert detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkiCert"
        "404":
          description: No cert with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The cert is tracked but reading its files back from disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove an issued certificate (deletes its key and cert files on disk)
      operationId: deletePkiCert
      parameters:
        - $ref: "#/components/parameters/PkiCertName"
      responses:
        "204":
          description: Removed
        "404":
          description: No cert with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Tracked but deleting its key/cert files from disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pki/reset:
    post:
      summary: Wipes and regenerates the entire CA chain, reissuing every currently-tracked leaf
      description: >
        Destructive. pki_ca_create()/pki_intermediate_create() are one-shot by design and refuse
        a second call outright (409) -- this is the explicit, real "start over" operation that
        design deliberately doesn't provide implicitly. Deletes the root (and the intermediate,
        if one was bootstrapped) and every leaf's on-disk key/cert, then re-bootstraps the root
        (and intermediate, only if one existed before this call) with new common names, then
        reissues every leaf that was tracked beforehand -- same name/SANs/owner, a fresh keypair
        and validity period for each. Every reissued leaf's cert_pem AND key_pem are included in
        the response -- this is a genuine new issuance moment for each, so it gets the identical
        "returned exactly once, right now" treatment a leaf's cert_pem/key_pem already gets at
        first issuance (POST /pki/certs); there is no second chance to retrieve a reissued leaf's
        private key afterward. A leaf whose reissue itself fails is simply gone, not left in its
        old state -- its old key/cert are already unlinked before any reissue is attempted, since
        they were signed by a CA that no longer exists the moment this proceeds. Any leaf owned by
        a still-live, --pki-issue-created container is automatically redelivered into that
        container's own filesystem afterward (pki_cert_deliver(), same mechanism container
        creation's own pki_issue already uses), so a running service's tls.crt/tls.key don't go
        stale. See ADR-0049.
      operationId: resetPki
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                root_common_name:
                  type: string
                  description: Defaults to "Kanxeo Root CA - <domain_suffix>" (this install's own site config).
                intermediate_common_name:
                  type: string
                  description: >
                    Defaults to "Kanxeo Intermediate CA - <domain_suffix>". Ignored if no
                    intermediate was bootstrapped before this call -- resetting the root alone
                    never creates one that didn't already exist.
                root_days:
                  type: integer
                  default: 3650
                intermediate_days:
                  type: integer
                  default: 1825
                leaf_days:
                  type: integer
                  default: 365
                  description: Validity period applied to every reissued leaf.
      responses:
        "200":
          description: New chain + every successfully reissued leaf
          content:
            application/json:
              schema:
                type: object
                required: [root, reissued]
                properties:
                  root:
                    $ref: "#/components/schemas/PkiCa"
                  intermediate:
                    allOf:
                      - $ref: "#/components/schemas/PkiCa"
                    nullable: true
                    description: null if no intermediate was bootstrapped before this call.
                  reissued:
                    type: array
                    items:
                      $ref: "#/components/schemas/PkiCertIssued"
        "400":
          description: Invalid root_common_name/intermediate_common_name, or the root isn't bootstrapped yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            The underlying openssl regeneration, or a reissue of one of
            the previously-tracked leaves, failed partway through -- the
            old chain and leaves are already unlinked by this point (see
            the destructive-reissue note above), so a 500 here leaves the
            install with a partially-rebuilt PKI state, not the old one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/bootstrap:
    post:
      summary: >
        Stages a real build toolchain (gcc/make/ld/as/cc1/sh/tar and their real headers
        and shared libraries) into the sandboxed build image. No body (or an empty one):
        copies live from this daemon's own host -- works when kanxeod happens to be
        running somewhere with a real toolchain (dev/test), produces an empty,
        non-functional toolchain on a real minimal install (nothing under its own /usr
        beyond kanxeod/kanxeoctl and their bare runtime libs). toolchain_path: imports a
        real, portable artifact (built once, elsewhere, with image/src/mktoolchainimage.c)
        via a local path the operator has already transferred it to (e.g. scp), the same
        "local path, not an upload" precedent /system/update's image_path/kernel_path
        already established. toolchain_url (+ required toolchain_sha256): the daemon
        fetches the artifact itself, host-side, the same real curl primitive every
        recipe's own pkg_source already uses (ADR-0065) -- closes a real gap the other
        two modes both rest on: a genuinely fresh, minimal Kanxeo install has no SSH
        server and no general shell at all (ADR-0034), so "the operator transfers it
        onto the box" was never actually possible without this. The no-body and
        toolchain_path modes stay synchronous (204 on success, unchanged); toolchain_url
        is async (202, poll GET /pkg/bootstrap) since a real network fetch of a real,
        large artifact cannot block this daemon's single-threaded event loop. All modes
        are idempotent -- safe to call again. Not automatic at daemon startup; an
        explicit, one-time action.
      operationId: pkgBootstrap
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                toolchain_path:
                  type: string
                  description: Local filesystem path to a toolchain squashfs artifact (image/src/mktoolchainimage.c's own output)
                toolchain_url:
                  type: string
                  description: URL the daemon fetches the toolchain squashfs from itself, host-side (ADR-0065). Requires toolchain_sha256.
                toolchain_sha256:
                  type: string
                  description: Required alongside toolchain_url -- a 64-char hex sha256 the fetched artifact must match before it's ever staged.
      responses:
        "204":
          description: Build toolchain image staged (or already was) -- no-body or toolchain_path modes only
        "202":
          description: toolchain_url fetch started -- poll GET /pkg/bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgBootstrapStatus"
        "400":
          description: toolchain_path given but missing/unreadable/not a regular file, or toolchain_url given without a valid 64-char toolchain_sha256
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A toolchain_url fetch is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Staging failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Status of the most recent toolchain_url fetch (ADR-0065)
      description: >
        Polling endpoint for POST /pkg/bootstrap's own toolchain_url mode -- the exact
        shape GET /system/iso already established for its own fire-and-forget job. state
        is "none" until the first toolchain_url POST this daemon has ever handled; the
        no-body/toolchain_path modes are synchronous and never touch this state at all.
      operationId: getPkgBootstrapStatus
      responses:
        "200":
          description: Current bootstrap-fetch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgBootstrapStatus"

  /pkg/recipes:
    get:
      summary: List recipes found on disk (metadata only, never sourced/executed)
      operationId: listPkgRecipes
      responses:
        "200":
          description: Recipe list
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: "#/components/schemas/PkgRecipe"
    post:
      summary: >
        Publishes a new recipe version (ADR-0107) -- the real, ongoing way a recipe
        catalog is managed on an already-running system, no ISO rebuild or reinstall
        needed (ADR-0040). content is validated (must parse, and its own pkg_name=/
        pkg_version= must equal name and the version content itself declares) before
        anything on disk changes. Recipe versions are immutable once published: an
        already-published (name, version) pair is 409 Conflict, never a silent
        overwrite -- fixing a mistake means bumping pkg_version= and publishing again.
      operationId: addPkgRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name:
                  type: string
                content:
                  type: string
                  description: The full text of a build.sh file (pkg_name=/pkg_version=/pkg_source=/pkg_sha256=/pkg_depends=)
      responses:
        "204":
          description: Recipe version published
        "400":
          description: name/content missing, name invalid, or content failed to parse / its pkg_name= doesn't match name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This exact (name, version) is already published -- versions are immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Validated but writing the build.sh file to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/recipes/{name}:
    get:
      summary: >
        One recipe version's own {name,version,depends,content,created_at} -- the raw
        build.sh text too, unlike GET /pkg/recipes' list-view metadata-only shape.
        Powers the web dashboard's per-package Recipe tab (view, and edit-then-publish
        as a new version through POST /pkg/recipes). An optional ?version= query
        parameter selects a specific published version; omitted resolves to the
        highest available version for name (ADR-0107). Still never sourced/executed
        here.
      operationId: getPkgRecipe
      parameters:
        - $ref: "#/components/parameters/PkgRecipeName"
        - $ref: "#/components/parameters/PkgRecipeVersionQuery"
      responses:
        "200":
          description: Recipe detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgRecipeDetail"
        "404":
          description: No recipe with this name (or this exact name+version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The recipe exists but reading its file back from disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: >
        Removes recipe version(s) for name. An optional ?version= query parameter
        removes only that one published version, leaving any others intact; omitted
        removes every published version of name (ADR-0107). Does not affect anything
        already installed via it -- only future `pkg install`/update-all lookups.
      operationId: deletePkgRecipe
      parameters:
        - $ref: "#/components/parameters/PkgRecipeName"
        - $ref: "#/components/parameters/PkgRecipeVersionQuery"
      responses:
        "204":
          description: Recipe version(s) removed
        "404":
          description: No recipe with this name (or this exact name+version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The recipe exists but deleting its file(s) from disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/repo-config:
    get:
      summary: >
        The currently configured recipe-sync source (ADR-0121, Part 2 of the pkg/
        redesign). auth_token itself is never echoed back -- only a derived
        auth_token_set boolean, the same "never round-trip a secret" posture as
        every other credential this API handles.
      operationId: getPkgRepoConfig
      responses:
        "200":
          description: Current repo config (repo_url is empty when nothing is configured yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgRepoConfig"
    put:
      summary: >
        Partially updates the configured recipe repo: any field omitted from the
        request body leaves that setting unchanged. An explicit "auth_token": ""
        is the one way to clear an already-set token; omitting auth_token entirely
        leaves whatever token (if any) is already stored. Changing
        sync_interval_seconds re-arms the periodic sync timer immediately (0
        disables it) -- no daemon restart needed.
      operationId: putPkgRepoConfig
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                repo_url:
                  type: string
                repo_kind:
                  type: string
                  enum: [gitea, github, gitlab]
                ref:
                  type: string
                  description: Branch/tag to fetch; defaults to "master" if never set
                auth_token:
                  type: string
                  description: Write-only; "" clears an existing token, omitted leaves it unchanged
                sync_interval_seconds:
                  type: integer
                  description: 0 disables periodic sync (default); positive re-arms a periodic timer
      responses:
        "200":
          description: Updated repo config (same shape as GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgRepoConfig"
        "400":
          description: repo_kind is not one of gitea/github/gitlab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Validated but persisting the config to disk failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/sync:
    post:
      summary: >
        Starts an async fetch-and-merge of the configured repo's recipes (ADR-0121).
        Recipes only -- never package artifacts (that's Part 3's own separate
        cache/fetch mechanism). Merge/additive: an already-known (name,version) is
        counted as skipped, never overwritten or deleted (recipe versions stay
        immutable, ADR-0107) -- a sync can never discard a recipe a host already
        has. 202, poll GET /pkg/sync for the outcome.
      operationId: pkgSync
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgSyncStatus"
        "400":
          description: No repo configured yet (PUT /pkg/repo-config first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A sync is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Spawning/tracking the fetch subprocess failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: The most recent (or currently running) sync's status.
      operationId: getPkgSyncStatus
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgSyncStatus"

  /pkg/cache-config:
    get:
      summary: The configured local build-artifact cache size cap (ADR-0122).
      operationId: getPkgCacheConfig
      responses:
        "200":
          description: Current cache config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgCacheConfig"
    put:
      summary: >
        Sets the cache's own size cap. There is no "unlimited" mode -- a real
        cap always applies. Lowering the cap below the cache's current
        occupancy does not evict anything immediately; eviction only happens
        lazily, the next time a new entry needs room.
      operationId: putPkgCacheConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_bytes]
              properties:
                max_bytes:
                  type: integer
                  description: Must be > 0.
      responses:
        "200":
          description: Updated cache config (same shape as GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgCacheConfig"
        "400":
          description: max_bytes missing, not a number, or <= 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/cache:
    get:
      summary: Current local build-artifact cache occupancy.
      operationId: getPkgCache
      responses:
        "200":
          description: Cache status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgCacheStatus"
    delete:
      summary: >
        Removes every cached artifact -- an explicit operator reset. Nothing
        in the install pipeline calls this itself; a cleared cache just means
        the next install of anything falls back to a real fetch/build (or the
        artifact tier, if configured) exactly as if nothing had ever been
        cached.
      operationId: deletePkgCache
      responses:
        "204":
          description: Cache cleared

  /pkg/artifact-config:
    get:
      summary: >
        The configured plain-HTTP precompiled-artifact server (ADR-0122) --
        deliberately not the git-forge repo config above; see that schema's
        own description for why a compiled binary is never served from the
        same place recipes are.
      operationId: getPkgArtifactConfig
      responses:
        "200":
          description: Current artifact-server config (base_url is empty when none is configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgArtifactConfig"
    put:
      summary: >
        Partially updates the configured artifact server: fields omitted from
        the body are left unchanged. An explicit "auth_token": "" clears an
        already-set token; omitting it leaves whatever's there.
      operationId: putPkgArtifactConfig
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url:
                  type: string
                auth_token:
                  type: string
                  description: Write-only; "" clears an existing token, omitted leaves it unchanged. Sent as an Authorization Bearer header.
      responses:
        "200":
          description: Updated artifact-server config (same shape as GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgArtifactConfig"

  /pkg/install:
    post:
      summary: >
        Starts installing a package: fetches its recipe's source (a host-side `curl`
        subprocess, tracked asynchronously -- this endpoint returns immediately, it does
        not wait for the fetch or the build to finish), then, once fetched and its
        checksum verified, builds it inside an isolated, network-less container and
        merges the result into the target image (request body's "image", default
        "base") every container using that image sees. v1 serializes installs: only
        one may be in flight at a time, across every image.
      operationId: pkgInstall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkgInstallRequest"
      responses:
        "202":
          description: Install started -- poll GET /pkg/{name} for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgEntry"
        "400":
          description: >
            name missing; no such recipe / it failed to parse; or a dependency it names
            (transitively) is missing its own recipe or forms a circular dependency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already installed (see upgrade), or another install is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The package table is full, or spawning/tracking the fetch subprocess failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/update-all:
    post:
      summary: >
        The "automagic" package half of Phase 16 (ADR-0031). Finds the
        first installed package (across every image) whose recipe's
        pkg_version= has drifted from what's installed (the same check
        GET /pkg's own available_version field already reports) and
        starts an upgrade for it, reusing /pkg/install --upgrade's
        entire existing mechanism. Starts at most one job -- the
        existing v1 single-install-in-flight constraint still applies,
        honestly, not parallelized around. Call again once that job
        finishes to pick up the next drifted package.
      operationId: pkgUpdateAll
      responses:
        "200":
          description: Nothing to update -- every installed package already matches its recipe
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: ["nothing to update"]
        "202":
          description: An upgrade was started for the first drifted package found -- poll GET /pkg/{name} for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgEntry"
        "409":
          description: Another install/upgrade is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The package table is full, or spawning/tracking the fetch subprocess failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/hostbuild:
    post:
      summary: >
        Starts a hostbuild job (ADR-0056): a second mode of the same fetch/build
        pipeline /pkg/install uses, except the build container's lowerdir is
        build_image's own rootfs (not the shared toolchain sandbox), and the
        completed output is harvested to a host artifact directory instead of
        being merged into any image. The named recipe's pkg_depends= must be
        empty -- dependency resolution has no meaning for a one-shot artifact
        harvest; every prerequisite must already be present in build_image's own
        rootfs. Subject to the same v1 single-job-in-flight constraint as
        /pkg/install (they share one job slot).
      operationId: pkgHostbuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, build_image]
              properties:
                name:
                  type: string
                  description: The recipe to build.
                build_image:
                  type: string
                  description: >
                    The already-existing image whose rootfs supplies the build
                    container's lowerdir. No default -- always explicit.
                version:
                  type: string
                  description: >
                    Hostbuilds exactly this published recipe version (ADR-0107) --
                    e.g. rebuilding an older kanxeo release on demand. Omitted
                    resolves to the highest available version for name.
                upgrade:
                  type: boolean
                  default: false
                  description: >
                    ADR-0094: without this, a hostbuild entry already in
                    PKG_STATE_INSTALLED makes every later call a bare 409, with
                    no way to rebuild from fresh source under the same recipe
                    name. true re-runs the build if the recipe's own
                    pkg_version= genuinely differs from what's installed --
                    still 409 if the version is unchanged, since nothing would
                    actually be different (mirrors /pkg/install's own upgrade
                    field exactly).
      responses:
        "202":
          description: Hostbuild started -- poll GET /pkg/hostbuild/{name} for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgEntry"
        "400":
          description: name/build_image missing; no such recipe / it failed to parse; or the recipe has a non-empty pkg_depends=
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: build_image does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already installed under this name, or another install/hostbuild is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The package table is full, or spawning/tracking the fetch subprocess failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/hostbuild/{name}:
    get:
      summary: Inspect one hostbuild job's current state -- a thin wrapper over the same lookup GET /pkg/{name} uses, scoped to the reserved "__hostbuild" image
      operationId: getPkgHostbuild
      parameters:
        - $ref: "#/components/parameters/PkgName"
      responses:
        "200":
          description: Hostbuild entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgEntry"
        "404":
          description: No such hostbuild job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The hostbuild entry exists but reading it back failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg/build/log:
    get:
      summary: >
        Live-tail the currently in-flight package build's own
        stdout/stderr, over a WebSocket (task #676, ADR-0101).
      description: >
        Not a normal REST request/response -- like
        /containers/{name}/console, this is an HTTP/1.1 Upgrade to
        WebSocket (RFC 6455), documented as a GET whose success
        response is "101 Switching Protocols." The same `Upgrade:
        websocket`, `Connection: Upgrade`, `Sec-WebSocket-Key`, and
        `Sec-WebSocket-Version: 13` headers are required; missing or
        misusing them is a 400.


        Unlike the console endpoint, this is a one-way relay, not an
        interactive session: nothing sent by the client is ever acted
        on except an eventual WebSocket CLOSE frame. On a successful
        upgrade, the currently-captured tail of the in-flight build's
        output (up to a few KB) is sent immediately as one TEXT frame,
        so a client attaching mid-build isn't starting blind; every
        further chunk is then relayed live as the build produces it.
        A real WebSocket CLOSE frame is sent, and the connection torn
        down, the moment the build finishes (success or failure) --
        there is no notion of "reconnect and keep watching a build
        that's already over."


        Up to 4 clients may be attached to the same in-flight build at
        once; a 5th attempt gets a 503, not silently dropped. 404 if
        no build is currently in progress at all -- this endpoint has
        nothing to do with a completed/failed build's own logged
        output (see GET /pkg/{name}'s `error` field for that).
      operationId: pkgBuildLog
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            enum: [websocket]
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            description: Must contain the token "Upgrade" (case-insensitive), e.g. "Upgrade" or "keep-alive, Upgrade".
        - name: Sec-WebSocket-Key
          in: header
          required: true
          schema:
            type: string
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            enum: ["13"]
      responses:
        "101":
          description: Switching Protocols -- the connection is now a WebSocket streaming the build's own output live, per this endpoint's own description above.
        "400":
          description: Missing/invalid Upgrade, Connection, Sec-WebSocket-Key, or Sec-WebSocket-Version header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No package build is currently in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to compute the WebSocket handshake accept value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Too many live-tail viewers already attached to this build (max 4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pkg:
    get:
      summary: List every known package (installed or in-flight) with its current state
      operationId: listPkg
      responses:
        "200":
          description: Package list
          content:
            application/json:
              schema:
                type: object
                required: [packages]
                properties:
                  packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/PkgEntry"

  /pkg/{name}:
    get:
      summary: Inspect one package's current state (fetching/building/installed/failed)
      operationId: getPkg
      parameters:
        - $ref: "#/components/parameters/PkgName"
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkgEntry"
        "404":
          description: No such package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The package is tracked but reading its entry back failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: >
        Removes a package entry, either installed or permanently failed.
        For an installed package, unlinks its manifested files from its
        target image, producing a new immutable image version
        (ADR-0107/0108). For one stuck in a permanently-failed
        fetch/build state, clears the tracking entry directly -- nothing
        was ever actually merged into any image, so there is nothing to
        unlink and no new image version is produced.
      operationId: deletePkg
      parameters:
        - $ref: "#/components/parameters/PkgName"
      responses:
        "204":
          description: Removed
        "404":
          description: No such package, or still fetching/building (not yet installed or failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This package is currently mid-install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Tracked but unlinking its manifested files from the target image failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}:
    get:
      summary: Inspect one container
      operationId: getContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Container detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "404":
          description: No container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: >
        Stop (if running) and remove a container, permanently, including
        its own on-disk state. If it was created with a "restart" policy,
        this also permanently removes that persisted definition in the
        same call -- it will not come back on the next crash-restart
        (none is pending; this path never triggers one) or on a future
        daemon restart, regardless of policy. See POST /containers/{name}/stop
        for stopping without losing the definition or the disk state.
        Works even if this container currently isn't live (e.g. a
        persisted definition that has never once managed to autostart,
        due to a depends_on cycle or an unknown dependency) -- 404 only
        if neither a live instance nor a persisted definition exists for
        this name. Also unmounts and recursively removes the container's
        own overlay directories (upper/work/merged, ADR-0106) -- best-
        effort: a cleanup failure is logged but never turns this into an
        error response, since the registry/definition state, not the
        disk, is the one source of truth for whether a container exists.
      operationId: deleteContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "204":
          description: Removed
        "404":
          description: No container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/start:
    post:
      summary: >
        Bring a stopped-but-still-defined container back to life,
        without a daemon restart (see ADR-0045).
      description: >
        The counterpart to POST .../stop: replays that name's persisted
        definition (the same body POST /containers originally received)
        through the same creation path a daemon restart's own autostart
        already uses -- one source of truth for "how a definition
        becomes a live container." Idempotent -- already-live is a
        plain 200, not an error. 404 if no persisted definition exists
        for this name at all (this endpoint only ever replays an
        existing definition; POST /containers creates a new one).
        Ignores restart-policy "unless-stopped" gating entirely, unlike
        boot-time autostart -- an explicit, manual start always means
        start it.
      operationId: startContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Already running, or successfully started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "404":
          description: No persisted definition for this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: The persisted definition itself is now invalid (e.g. its image was deleted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            Replaying the definition hit a real internal failure -- the
            same set create_container_from_body() can produce for POST
            /containers itself (no free IPs, container table full, a
            directory/file write failed, or the underlying clone3()/
            registry create failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/pause:
    post:
      summary: Freeze a running container via the cgroup v2 freezer (see ADR-0045).
      description: >
        Writes cgroup.freeze=1 for this container's own cgroup leaf --
        every task in it is stopped at the kernel level, uninterceptable
        and unignorable by the frozen process, unlike SIGSTOP which a
        process can catch or handle. Requires an already-live container
        (404 otherwise -- pausing a stopped-but-defined or nonexistent
        container makes no sense). Unlike POST .../stop's idempotent
        double-call tolerance, pausing an already-paused container is a
        409, not a silent 200 -- the caller should already know this
        from its last GET.
      operationId: pauseContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "404":
          description: No running container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The cgroup.freeze write itself failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/unpause:
    post:
      summary: Thaw a paused container (see ADR-0045).
      description: >
        Writes cgroup.freeze=0 for this container's own cgroup leaf,
        the inverse of POST .../pause. 404 if not currently a live
        container; 409 if it is live but not currently paused.
      operationId: unpauseContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Unpaused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "404":
          description: No running container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The cgroup.freeze write itself failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/stats:
    get:
      summary: >
        Real, host-side CPU/memory/disk/network usage for one container
        (see ADR-0054).
      description: >
        Gathered entirely from kernel interfaces the daemon already
        touches -- the container's own cgroup v2 leaf (cpu.stat,
        memory.current/peak/max, io.stat) and its host-side veth
        interface's own counters -- never anything queried or agent-run
        inside the container itself. A raw, point-in-time snapshot on
        every call: cpu.*_usec and network rx/tx counters are
        cumulative since the container started, not a rate -- compute a
        rate by calling this twice and dividing by the wall-clock delta
        between calls. disk.upper_bytes is a gauge (current space
        consumed by this container's own overlay diff, content only).
        disk.read/write_bytes/ios reflect whatever the cgroup v2 io
        controller has recorded since it was enabled at this daemon's
        own startup -- genuinely empty/zero for a container that hasn't
        done tracked block I/O yet, not an error. Works for an exited-
        but-still-registered container too (a cgroup leaf is never
        removed while its registry entry exists) -- only a fully
        removed or never-existing name is a 404.
      operationId: getContainerStats
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Current usage snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerStats"
        "404":
          description: No such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/migrate-storage:
    get:
      summary: Status of the most recent (or currently running) storage migration job for one container (ADR-0142)
      description: >
        Same shape as the daemon-wide `GET /system/{state,log,rebuildable}-storage/migrate`
        status endpoints, keyed by this one container instead. Reports
        `{"state":"none"}` if this container has never had a migration
        started for it.
      operationId: getContainerStorageMigrateStatus
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Migration job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
        "404":
          description: No such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Moves one container's own overlay storage to a new disk, or back to the default OS-disk placement (ADR-0142)
      description: >
        `disk` is required -- a real disk name (must already carry the
        `container-storage` role and be currently mounted) or `null` to
        migrate back to the default OS-disk placement; omitting the
        field entirely is a 400, the same convention every other
        storage-placement migration endpoint already has. Requires a
        persisted definition to exist (`restart` other than `"no"`) --
        the cutover this triggers always ends with a real stop-then-
        replay, so a container with nothing to replay from is rejected
        with a 400 rather than accepted and left half-done.


        Unlike the three daemon-wide storage kinds, this is not purely
        a background repoint: the bulk copy runs asynchronously while
        the container keeps running and writing normally (same "no
        pause during the bulk phase" design), but once that finishes
        this daemon briefly stops the container, does one more
        synchronous copy pass to capture anything written since, patches
        the persisted definition's own `disk` field, and automatically
        restarts the container from the new location -- the real,
        necessary difference ADR-0142 calls out (a container's own
        overlay is actively read/written by its own live process the
        whole time, unlike a daemon-wide singleton this reactor alone
        touches). A failure at any point after the stop restarts the
        container from its ORIGINAL location rather than leaving it
        down -- the migration is all-or-nothing from the caller's point
        of view. Returns 202 immediately with the job's initial
        `{"state":"running",...}` status; poll GET on this same path
        for completion.
      operationId: migrateContainerStorage
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disk]
              properties:
                disk:
                  type: string
                  nullable: true
                  description: A Disk.name from GET /disks, or null for the default OS-disk placement.
      responses:
        "202":
          description: Migration job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrateStatus"
        "400":
          description: >
            disk field missing, invalid/unknown disk, disk is the OS
            disk, disk doesn't carry the container-storage role, disk
            carries the role but isn't currently mounted, or this
            container has no persisted definition to restart from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A migration for this container is already running, or the requested placement is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/stop:
    post:
      summary: >
        Stop a container right now, without removing its persisted
        definition (see ADR-0027).
      description: >
        Kills the live process (if any) the same way DELETE does, but
        unlike DELETE this does not remove the persisted definition, its
        DNS record, or its PKI cert ownership -- only a "stopped" flag
        is set. For "restart":"unless-stopped", that flag
        survives a daemon restart -- the container will not auto-start
        again until re-POSTed to /containers. For "always"/"on-failure",
        this only prevents restart for the remainder of this daemon's
        current uptime; the next daemon restart attempts to start it
        again unconditionally, same as before this endpoint existed.
        Idempotent -- calling it twice is 200 both times. A no-op
        regarding persisted state if this name was created with
        "restart":"no" (or has no persisted definition at all) -- the
        live container is still killed if one is running.
      operationId: stopContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                required: [name, status]
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum: [stopped]
        "404":
          description: No container with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/console:
    get:
      summary: >
        Open an interactive shell inside an already-running container
        (like `docker exec -it`), over a WebSocket.
      description: >
        Not a normal REST request/response -- this is an HTTP/1.1
        Upgrade to WebSocket (RFC 6455). OpenAPI 3.0 has no first-class
        way to type a WebSocket endpoint, so this is documented as a
        GET whose success response is "101 Switching Protocols," not a
        JSON body. The request MUST carry `Upgrade: websocket`,
        `Connection: Upgrade` (a comma-separated token list containing
        "Upgrade" is also accepted, e.g. "keep-alive, Upgrade"),
        `Sec-WebSocket-Key`, and `Sec-WebSocket-Version: 13` -- any
        request to this path missing or misusing those is a 400, not
        treated as an ordinary GET.


        Once upgraded, the connection carries raw PTY bytes both ways:
        client-to-server WebSocket frames (TEXT or BINARY, always
        masked per RFC 6455) are written verbatim to the exec'd
        process's stdin; PTY output is relayed back as BINARY frames.
        Any frame-parse failure post-upgrade -- including an unmasked
        client frame, which RFC 6455 5.1 requires a server to reject --
        SIGKILLs the exec'd process and closes the raw connection
        immediately; there is no HTTP status to write once the
        connection is a WebSocket, and no WebSocket CLOSE frame is sent
        either, just a raw close. A WebSocket CLOSE frame from either
        side, or the exec'd process exiting on its own, ends the
        session the same way -- SIGKILL, then close.
        Frame fragmentation (FIN=0) is not supported in either
        direction -- every frame this daemon sends or accepts is a
        complete, single-frame message (this endpoint's own traffic
        shape -- keystrokes and modest output chunks -- never needs it).
        Payloads are capped at 64KiB per frame.


        The exec'd process joins the target container's own mount,
        UTS, network, and pid namespaces (its IPC namespace is never
        isolated in the first place, so there's none to join) --
        equivalent to `nsenter --mount --uts --net --pid --target
        <container's pid>`, not a fresh container of its own. Command
        defaults to `/usr/bin/bash` (this project's own package system
        stages everything under `usr/bin/`, never `/bin` -- see
        ADR-0043); a container whose image has neither that nor
        whatever `X-Kanxeo-Exec-Cmd` names installed fails to exec,
        the same real limitation `docker exec` has against a
        scratch-based image, not a bug.


        No new authentication/authorization boundary: this endpoint is
        exactly as protected as every other endpoint here (network
        reachability only) -- a more sensitive capability than most,
        worth naming even though it isn't a gap this endpoint itself
        introduces.
      operationId: consoleContainer
      parameters:
        - $ref: "#/components/parameters/ContainerName"
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            enum: [websocket]
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            description: Must contain the token "Upgrade" (case-insensitive), e.g. "Upgrade" or "keep-alive, Upgrade".
        - name: Sec-WebSocket-Key
          in: header
          required: true
          schema:
            type: string
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            enum: ["13"]
        - name: X-Kanxeo-Exec-Cmd
          in: header
          required: false
          schema:
            type: string
            default: /usr/bin/bash
          description: >
            Absolute path of the program to exec inside the container,
            in place of the default. No argument splitting -- this is a
            single executable path (typically another shell), not a
            full command line; give it interactively once inside.
      responses:
        "101":
          description: Switching Protocols -- the connection is now a WebSocket carrying raw PTY bytes both ways, per this endpoint's own description above.
        "400":
          description: Missing/invalid Upgrade, Connection, Sec-WebSocket-Key, or Sec-WebSocket-Version header, or a malformed container name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such container, or it isn't currently running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to start the console session (handshake computation, or the exec/PTY mechanism itself failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /containers/{name}/files:
    get:
      summary: >
        Read one file's raw bytes back out of a container's rootfs (see
        ADR-0055).
      description: >
        The read-path counterpart to POST /containers' own "files[]"
        (which is write-only, host-to-container, staged before the
        container's own clone3()). Response is raw bytes
        (application/octet-stream), not JSON -- this is the daemon's
        only other non-JSON response body besides the web dashboard's
        own static assets.


        Path resolution depends on whether the container is currently
        running: while running, the file is read through
        /proc/<pid>/root/<path> (the container's own mount namespace and
        root, no privilege boundary crossed since the daemon already
        runs as real root). Once the container has exited on its own
        (but not been DELETEd -- an exited-but-still-registered
        container is a valid target, same as GET .../stats already
        allows) the file is read from the container's own real,
        host-visible overlay upperdir first, falling back to the
        image's own read-only rootfs if the path was never written by
        the container itself.


        The path query parameter must be an absolute, "/"-leading,
        traversal-free path (no "." or ".." component, no empty "//"
        component) -- the exact same validation POST .../containers'
        own "files[].path" already applies, reused verbatim rather than
        a second set of rules. A path resolving to a directory is a 400,
        not a directory listing -- this endpoint reads one file, it does
        not browse a tree.
      operationId: getContainerFile
      parameters:
        - $ref: "#/components/parameters/ContainerName"
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Absolute, container-relative file path, e.g. "/etc/hosts".
      responses:
        "200":
          description: The file's raw content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing/unsafe path (not absolute, or contains a "." or ".." component), or the path resolves to a directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such container, or no such file at that path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file exists but stat()ing it or allocating a buffer to hold it failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    ContainerName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

    NetworkName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,15}$"

    ImageName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

    DnsRecordName:
      name: name
      in: path
      required: true
      schema:
        type: string

    DnsServerContainerName:
      name: container
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

    LdapServerContainerName:
      name: container
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

    LdapGroupName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z_][a-z0-9_-]*$"

    LdapUserName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z_][a-z0-9_-]*$"

    PkiCertName:
      name: name
      in: path
      required: true
      schema:
        type: string

    PkgName:
      name: name
      in: path
      required: true
      description: >
        A bare package name (targets the default "base" image) or the compound
        "{name}@{image}" form to address a package tracked against a specific,
        non-default target image.
      schema:
        type: string

    PkgRecipeName:
      name: name
      in: path
      required: true
      description: >
        A recipe's name (its pkg_name= field, and the {name}/ directory
        under pkg/recipes/, ADR-0107). Unlike PkgName, this has no
        "{name}@{image}" compound form -- a recipe is not tracked
        per-image, so an "@" is simply rejected as an invalid name.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"

    PkgRecipeVersionQuery:
      name: version
      in: query
      required: false
      description: >
        A specific published recipe version (ADR-0107). Omitted resolves to the
        highest available version for GET, or every published version for DELETE.
      schema:
        type: string

  schemas:
    ContainerCreateRequest:
      type: object
      required: [name, image, cmd]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: >
            Unique container name. Used verbatim as the on-disk directory
            name under /var/lib/kanxeo/containers/, so it is restricted to
            [A-Za-z0-9_-].
        image:
          type: string
          description: >
            Name of a pre-existing, pre-populated image whose rootfs lives
            at /var/lib/kanxeo/rebuildable/images/{image}/rootfs (ADR-0141).
            This daemon never creates image content itself -- only 400s if
            it's missing.
        cmd:
          type: array
          items:
            type: string
          minItems: 1
          description: argv for the container's entry process (cmd[0] is the executable path, relative to the container's own root).
        memory_max:
          type: integer
          format: int64
          description: cgroup v2 memory.max in bytes. Omit for no limit.
        pids_max:
          type: integer
          format: int64
          description: cgroup v2 pids.max. Omit for no limit.
        cpu_max:
          type: string
          description: >
            Raw cgroup v2 cpu.max value, "<quota> <period>" in
            microseconds (e.g. "50000 100000" = 50% of one CPU,
            "max 100000" = unlimited quota with a 100ms period).
            Passed through verbatim, not reinterpreted -- same
            convention as memory_max's bytes and pids_max's raw count.
            Omit for no limit.
        cpuset_cpus:
          type: string
          description: >
            Raw cgroup v2 cpuset.cpus range-list value (e.g. "0-1,3"),
            restricting which host CPUs this container's processes may
            run on. Passed through verbatim, not reinterpreted -- same
            pass-through convention as cpu_max. Omit for no
            restriction (every online CPU).
        disk_quota_bytes:
          type: integer
          format: int64
          description: >
            Real, kernel-enforced hard limit in bytes for this
            container's own overlay upperdir. The enforcement
            mechanism is chosen automatically from the backing
            filesystem's own type -- no separate flag needed. On ext4
            (the default for a real installed system's containers
            partition), this is a project quota (rounded up to the
            nearest 1KiB quota block; requires the filesystem to have
            been created with project-quota support, kanxeo-install.c's
            own mkfs.ext4 -O quota -E quotatype=prjquota); writes past
            the limit fail with EDQUOT at the filesystem level. On
            btrfs (see ADR-0103), this is a qgroup hard limit set
            directly on the container's own upperdir subvolume via
            BTRFS_IOC_QGROUP_LIMIT, with the same real, kernel-enforced
            (not advisory) semantics. Either way, if the backing
            filesystem can't support the requested enforcement,
            container creation fails with a clear error rather than
            silently not enforcing the limit. Omit for no limit.
        disk:
          type: string
          description: >
            Bare kernel name (e.g. "sdb", no "/dev/" prefix -- disk.h's
            own naming, see GET /disks) of a real, currently-mounted
            disk this container's own overlay storage (upperdir/
            workdir/merged) should live on, in place of the default
            OS-disk containers directory (task #638, ADR-0102). The
            disk must already carry the "container-storage" role
            (POST /diskroles) -- 400 if it doesn't exist, isn't
            mounted, or lacks that role; this is the one thing that
            makes the role (assignable since Phase B) actually
            connect to anything. Omit for the default placement.
        dns_servers:
          type: array
          items:
            type: string
          maxItems: 3
          description: >
            IPv4 nameserver addresses (ADR-0143) to stage as a real
            /etc/resolv.conf inside this container's own overlay,
            before its process ever starts -- the same "written
            directly into the upperdir pre-clone3()" mechanism `files`
            above already uses, a dedicated field rather than requiring
            hand-constructed resolv.conf content via `files`. Up to 3
            (matches glibc's own resolv.conf MAXNS). Deliberately
            explicit -- no automatic discovery of a registered internal
            DNS server container (see `dns server register`); point
            this at that container's own real IP directly if `.internal`
            resolution is wanted. 400 if combined with a `files` entry
            whose path is "/etc/resolv.conf" -- an unresolvable
            ambiguity about which one should apply. Omit for no
            resolver config staged (a container brings its own, or has
            none).
        networks:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/NetworkAttachmentRequest"
          minItems: 1
          maxItems: 64
          description: >
            Networks (see POST /networks) to attach to, in order -- any
            name not currently known to this daemon is a 400. Each entry
            is either a bare network name (an IP is auto-allocated, the
            original v1 behavior) or a {name, ip} object naming an
            explicit, operator-chosen address instead -- 400 if ip isn't
            a usable address on that network (wrong subnet, the reserved
            address/network address, or out of the network's host range),
            409 if it's already assigned to a running container. Omit
            networks entirely for no networking at all (an isolated netns
            with only lo, the same as every container got before this
            field existed). The first entry is "primary" and receives the
            default route; any further entries only get their own
            subnet's connected route (no default route of their own).
        ip_forward:
          type: boolean
          default: false
          description: >
            Enables net.ipv4.ip_forward inside this container's own
            netns -- combined with two or more networks, lets it act
            as a router between them. Per-netns; never affects the
            host or other containers.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteSpec"
          maxItems: 8
          description: >
            Extra static routes installed inside the container's netns
            at creation time, after the primary default route. Set
            once at creation; not modifiable on an already-running
            container. Format only is validated (dest/via must be
            well-formed IPv4, prefix_len 0-32) -- whether via is
            actually reachable is the caller's responsibility.
        capture_output:
          type: boolean
          default: false
          description: >
            If true, captures this container's own stdout/stderr into
            a bounded in-memory buffer (4096 bytes, oldest bytes kept,
            newest dropped past the cap), readable back afterward via
            GET .../{name}'s captured_output field -- the same
            mechanism pkg.c's own build containers already use
            internally, now opt-in for ordinary operator-created
            containers too. Meant for diagnosing a process that starts
            fine (a successful execve()) but then exits on its own
            with no other visible signal -- e.g. a daemon whose real
            config-validation error would otherwise only ever have
            gone to a terminal nobody was watching. Not a live tail:
            the buffer fills as the process runs but is only useful to
            read after it has produced output, not as an ongoing log
            stream (see the console/exec endpoint for that). Default
            false: capturing costs one pipe and one small buffer per
            container, worth paying only when actually needed.
        dns_register:
          type: boolean
          default: false
          description: >
            If true, automatically creates a DNS record (see POST
            /dns/records) named after this container, pointing at its
            primary network's IP, as part of container creation --
            requires networks to be set (400 otherwise). Best-effort:
            if a record with this name already exists (e.g. a stale
            persisted one from a same-named container created before a
            daemon restart), registration is silently skipped and the
            container is still created successfully -- it never
            overwrites a colliding record. The record's owner field is
            set to this container's name, and it is automatically
            removed when the container is deleted.
        pki_issue:
          type: boolean
          default: false
          description: >
            If true, automatically issues a leaf TLS certificate (see POST
            /pki/certs) named after this container (CN and sole SAN) and
            delivers it into the container's own filesystem as part of
            container creation -- requires the CA to already be
            bootstrapped (400 otherwise; unlike dns_register this does NOT
            require networks, since the cert identifies the container by
            name and delivery works regardless of networking). Best-effort
            past that point: if a cert with this name already exists (e.g.
            a stale one from a same-named container created before a
            daemon restart), issuance is silently skipped and the
            container is still created successfully -- it never overwrites
            a colliding cert. The cert's owner field is set to this
            container's name, and it is automatically removed when the
            container is deleted. Delivery is one-time (no live resync) --
            reused verbatim from POST /pki/certs's own reasoning, since a
            cert doesn't change after a container starts.
        pki_cert_dir:
          type: string
          default: "/etc/kanxeo-tls"
          description: >
            Destination directory inside the container (its own filesystem
            view) that the cert (tls.crt) and key (tls.key, chmod 0600)
            are written into when pki_issue is true. Ignored otherwise.
        pki_days:
          type: integer
          default: 365
          description: Validity period in days for the pki_issue certificate. Ignored otherwise.
        ldap_provision:
          type: boolean
          default: false
          description: >
            If true, automatically creates an LDAP service/bind account
            (see POST /ldap/users) for the container itself -- NOT a
            human login account, those are created directly via POST
            /ldap/users -- as part of container creation, and delivers a
            freshly generated secret into the container's own filesystem.
            Requires ldap_group to name an existing LDAP group (400
            otherwise). A "search" capability is granted by default
            (glauth denies all LDAP operations by default otherwise). The
            plaintext secret is never persisted anywhere in Kanxeo's own
            state -- only its SHA-256 hash survives -- so every
            restart-always respawn regenerates and re-delivers a fresh
            one. Best-effort past validation: an "already exists" account
            (e.g. a respawn under restart:always) is tolerated and just
            gets its secret re-delivered rather than failing container
            creation. The account's owner field is set to this
            container's name, and it is automatically removed when the
            container is deleted.
        ldap_user:
          type: string
          description: >
            LDAP username for the ldap_provision service account.
            Defaults to the container's own name. Ignored unless
            ldap_provision is true.
        ldap_group:
          type: string
          description: >
            Name of an existing LDAP group (see POST /ldap/groups) the
            provisioned service account joins as its primarygroup.
            Required when ldap_provision is true (400 if omitted or the
            group doesn't exist).
        ldap_uid:
          type: integer
          description: >
            uidnumber for the ldap_provision service account. Defaults to
            an auto-allocated uid. Ignored unless ldap_provision is true.
        ldap_secret_dir:
          type: string
          default: "/etc/kanxeo-ldap"
          description: >
            Destination directory inside the container (its own
            filesystem view) that the delivered secret (bind.secret,
            chmod 0600) is written into when ldap_provision is true.
            Ignored otherwise.
        devices:
          type: array
          items:
            type: string
          maxItems: 16
          description: >
            ids (see GET /devices) of host PCI/USB/GPU devices to grant
            this container access to -- any id not currently
            discoverable, or not assignable (no driver bound and/or no
            owned /dev node found), is a 400. Omit for no device
            passthrough at all (the same "no /dev beyond the base image"
            behavior every container had before this field existed). Set
            once at creation; not modifiable on an already-running
            container. Enforced by a BPF_CGROUP_DEVICE program (ADR-0017)
            attached to the container's own cgroup, not just by the /dev
            node's mere presence -- a container granted no devices, or a
            different set, cannot open another container's granted
            device even if it already knows its major:minor.

            One entry here doesn't always mean one grant: a GPU's bare
            logical id ("gpu:0", not itself listed by GET /devices --
            only its individual member nodes are, see Device.bus) atomically
            expands into every one of that GPU's currently assignable
            nodes (e.g. both "gpu:0:card0" and "gpu:0:renderD128" from a
            single "gpu:0" entry here) -- ADR-0028. GET /containers'
            own response then reflects what was actually granted (the
            expanded member ids), not a static echo of what this field
            was given. maxItems bounds this field's own array length,
            not the total grant count after expansion (still capped at
            16 overall, a 400 if a grouped id would exceed it). An
            individual GPU node can still be named directly (e.g. just
            "gpu:0:renderD128") instead of the whole group, if that's
            all a container needs.

            Each entry may also be a persisted device mapping's own
            name (see POST /devicemaps, ADR-0048) instead of a raw
            Device.id -- resolved first; only falls back to the raw id
            namespace if no mapping exists by that name. A mapping
            that exists but currently resolves to nothing (its device
            is unplugged) is a 400, same as an unknown/unassignable
            raw id -- it is not silently reinterpreted as a literal id.
        interfaces:
          type: array
          items:
            type: string
          maxItems: 16
          description: >
            Bare kernel interface names (e.g. "wlan0") of real,
            physically-backed network interfaces to move wholesale into
            this container's own netns -- any name not currently listed
            under a "net" bus entry in GET /devices (unknown, or already
            attached elsewhere) is a 400. No veth, no bridge, no rename,
            no address configured: the interface keeps its real kernel
            name and comes up automatically, but addressing/routing is
            entirely the operator's own job inside the container (e.g.
            bird or dhclient, once installed via `pkg install`) -- this
            is independent of, and can be combined with, networks above.
            Set once at creation; not modifiable on an already-running
            container.
        files:
          type: array
          items:
            $ref: "#/components/schemas/ConfigFile"
          maxItems: 16
          description: >
            Config files (or scripts -- see cmd) to write into this
            container's own filesystem before its process ever starts,
            so multiple containers built from the same image can each
            run their own configuration. Written directly into this
            container's own private overlay upperdir on the daemon's
            own host process, entirely before the container is created
            -- unlike a running container's filesystem (no operator-
            facing way to reach that at all today), the file is already
            there the moment cmd execve()s, so it can safely be cmd
            itself (e.g. ["/bin/bash", "/usr/local/bin/pbr.sh"]). Each
            `path` must be absolute and contain no "." or ".."
            component (400 otherwise -- the one real security boundary
            in this field, since a validated path becomes a real host
            filesystem write target). Persisted and re-staged correctly
            on every future boot/crash-restart alongside everything
            else "restart" persists, for free -- no separate mechanism.
        sysctls:
          type: object
          additionalProperties:
            type: string
          maxProperties: 32
          description: >
            Arbitrary net.* sysctls to apply inside this container's own
            network namespace at creation time (e.g.
            "net.ipv4.conf.all.rp_filter": "0"), alongside ip_forward
            above -- ip_forward stays its own field as a simple shorthand
            for the single most common case; this is the general escape
            hatch, not a replacement. Deliberately restricted to keys
            starting with "net." (400 otherwise): that's the one sysctl
            subtree the kernel actually namespaces end to end -- most
            others (vm.*, fs.*, ...) are host-wide regardless of netns,
            so allowing arbitrary keys here would be a real host-wide
            write primitive from inside a container, not a per-container
            knob. See ADR-0030.
        restart:
          type: string
          enum: [always, on-failure, unless-stopped, no]
          default: "no"
          description: >
            Any value other than "no" persists this container's exact
            create request (survives a daemon restart) and replays it
            automatically -- once now (if creation succeeds), again at
            every future daemon startup, and again after an unprompted
            exit, each restart after a real, exponentially-backed-off
            delay (see restart_delay_seconds -- not instant, avoids
            hammering the host if it keeps failing).

            "always": restarts regardless of exit code, including a
            clean 0 exit -- unaffected by a prior POST .../stop once the
            daemon itself restarts.

            "on-failure": restarts only after a nonzero-exit-code (or
            signal-killed) exit, not a clean 0 exit -- but only for the
            crash-restart timer; boot-time autostart always attempts it
            regardless of how it last exited, since that fact is never
            persisted (a stated v1 boundary, see ADR-0027).

            "unless-stopped": behaves like "always", except a prior POST
            .../stop is remembered across a daemon restart -- it will
            not auto-start again until explicitly re-POSTed. This is the
            one policy where a stop actually changes daemon-restart
            behavior; for "always"/"on-failure" a daemon restart is
            always a fresh chance.

            "no" (the default): today's original behavior, unchanged --
            purely in-memory, gone the moment the daemon restarts or
            this container exits, no persistence at all.

            DELETE /containers/{name} removes the persisted definition
            too, permanently, regardless of policy -- see that
            endpoint's own description, and POST .../stop for stopping
            without losing it.
        restart_delay_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 2
          description: >
            Base crash-restart delay in seconds, ignored (not an error)
            when restart is "no". The actual delay applied backs off
            automatically and uniformly on repeated failures -- doubling
            per consecutive failure, capped at a fixed 30s -- not itself
            a further per-container knob. A restart is no longer
            considered "consecutive" (the backoff resets to this base
            value) once the container has stayed up at least 30s before
            exiting again. See ADR-0027 for the full reasoning,
            including why even a container's own first-ever failure
            already applies one doubling (consecutive_failures goes 0 ->
            1 on that first exit, same as any subsequent one).
        follow_rolling:
          type: boolean
          default: false
          description: >
            Opt-in (ADR-0124): whenever this container's own image is
            rolling and its current_version advances, this container's own
            pinned image_version is patched to match and the container is
            live-restarted onto it -- after an independent, uniformly-random
            delay in [0, jitter_window_seconds] (see PUT
            /system/rolling-config) to spread out simultaneous restarts of
            many containers following the same image. Reconciled after
            every completed pkg install/hostbuild/image-recipe-apply job,
            not just rolling auto-rebuilds. Silently ignored (not an
            error), same as restart_delay_seconds above, when restart is
            "no" -- meaningless without a persisted definition to replay.
        follow_rolling_jitter_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: >
            Optional per-container override of the daemon-wide jitter
            window (GET/PUT /system/rolling-config's own
            jitter_window_seconds) used when this container's own
            follow_rolling restarts fire -- lets one particularly
            latency-sensitive or particularly tolerant container use a
            different spread than the daemon-wide default without
            changing that default for every other follow_rolling
            container. Omitted means "use the daemon-wide default."
            Same "ignored, not an error" precedent as follow_rolling
            itself when restart is "no" or follow_rolling is false --
            meaningless without both.
        depends_on:
          type: array
          items:
            type: string
          maxItems: 16
          description: >
            Other persisted (any restart policy other than "no")
            container names that must be started -- and, if that
            dependency's own `readiness` is set, TCP-ready per that
            check -- before this one, at daemon-boot autostart time only
            (never for a live POST, and never for crash-restart -- see
            `readiness` below for both). Ignored for a live POST that
            isn't itself persisted (nothing to persist, so no future
            boot ordering to honor). A dependency naming an unknown
            definition, or one that participates in a cycle, is skipped
            at boot (logged, not fatal to the rest of startup).
        readiness:
          $ref: "#/components/schemas/Readiness"

    SystemBackupBundle:
      type: object
      description: >
        The shared request/response shape for GET /system/backup and
        POST /system/restore. Every field is optional (at least one
        required on restore) and independent -- each is the raw,
        already-JSON content of the matching real state file, embedded
        as an escaped string (not nested raw JSON), so a round trip
        through this schema is exact. See ADR-0033.
      properties:
        version:
          type: integer
          description: Bundle format version (currently always 1). Response-only -- ignored on restore.
        container_defs:
          type: string
          description: Raw content of container_defs.json (every persisted container's exact create request, verbatim -- ADR-0025).
        networks:
          type: string
          description: Raw content of networks.json.
        dns_records:
          type: string
          description: Raw content of dns_records.json.
        pkg_installed:
          type: string
          description: Raw content of pkg_installed.json (which packages are installed, into which images, at which version).
        pkg_recipes:
          type: object
          additionalProperties:
            type: string
          description: >
            Every *.recipe file currently on disk, keyed by package
            name (not just currently-installed packages -- recipes are
            cheap, and the operator may want them all preserved).
        site_config:
          type: string
          description: >
            Raw content of site_config.json (this install's own
            instance_name/site_name/domain_suffix, ADR-0046). Restored
            state takes effect on the daemon's next boot, same as
            every other field in this bundle.

    ConfigFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: >
            Absolute container-relative path (e.g. "/etc/bird.conf").
            No "." or ".." component (400 otherwise).
        content:
          type: string
          description: >
            Written verbatim. Bounded per file (a generous 64KiB) on top
            of the 1MiB whole-request-body limit that already applies
            regardless.
        mode:
          type: string
          default: "0644"
          description: Octal permission string, e.g. "0755" for a script.
        owner:
          type: integer
          description: >
            (ADR-0144) Numeric uid this file lands owned as. Staged
            before the container's own process ever execve()s, so no
            NSS lookup and no ordering dependency on another staged
            file (e.g. a /etc/passwd entry) existing first -- always a
            raw uid, never a username. Omitted means root (this
            daemon's own real euid), the same default every file had
            before this field existed.
        group:
          type: integer
          description: Numeric gid, same real semantics as owner above. Omitted means root's own real egid.

    Readiness:
      type: object
      required: [tcp_port]
      description: >
        An optional plain-TCP-connect readiness check (ADR-0026) on
        this container's own primary network address
        (`networks[0]`'s assigned IP -- so `networks` must be
        non-empty, 400 otherwise). Consulted in exactly one place:
        daemon-boot autostart (`containerdef_autostart_all()`), right
        after this container itself starts and before any
        "restart":"always" container that lists it in `depends_on`
        starts. Never consulted for a live POST (this container's own
        creation never blocks on its own readiness) or for
        crash-restart (that path only ever restarts the one container
        that exited -- its dependents, if any, are normally already
        running/ready). Best-effort: if the check never succeeds
        within `timeout_seconds`, a warning is logged and dependents
        start anyway -- this never blocks or fails boot.
      properties:
        tcp_port:
          type: integer
          minimum: 1
          maximum: 65535
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30

    NetworkAttachmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Name of an existing network (see POST /networks).
        ip:
          type: string
          description: >
            An explicit, operator-chosen IPv4 address on this network
            (dotted-quad) instead of an auto-allocated one. Must be
            within the network's own subnet, not its reserved address
            or network address, and not already assigned to a running
            container.

    RouteSpec:
      type: object
      required: [dest, prefix_len, via]
      properties:
        dest:
          type: string
          description: Destination network address (dotted-quad).
        prefix_len:
          type: integer
          minimum: 0
          maximum: 32
        via:
          type: string
          description: Gateway IPv4 address (dotted-quad). Required -- v1 has no on-link/direct route support.

    Container:
      type: object
      required: [name, image, status, pid]
      properties:
        name:
          type: string
        image:
          type: string
          description: The image this container's rootfs was built from (see GET /images).
        status:
          type: string
          enum: [running, paused, exited]
        paused:
          type: boolean
          description: >
            True while frozen via the cgroup v2 freezer (ADR-0045, POST
            .../pause). Always false once status is exited. Redundant
            with status == "paused" -- provided as a plain boolean too
            since some clients prefer switching on a flag over a string
            enum.
        pid:
          type: integer
          description: PID in the daemon's own PID namespace. Meaningless once status is exited.
        exit_status:
          type: integer
          nullable: true
          description: Exit status once status is exited; null while running.
        exit_reason:
          type: string
          nullable: true
          description: >
            Human-readable why, once status is exited; null while running
            (ADR-0080). Either the real diagnostic text the container's
            own pre-exec setup or final exec wrote before failing (e.g.
            "child: execve(/usr/bin/foo): No such file or directory"), or
            a fixed category string (e.g. "clean exit", "overlay: mount(2)
            itself failed") when that text isn't available. exit_status
            alone was never enough to act on -- this is the same numeric
            scheme documented in src/container.c decoded into something
            an operator can actually read, without needing serial console
            or shell access to the host.
        networks:
          type: array
          items:
            $ref: "#/components/schemas/ContainerNetworkAttachment"
          description: Every network this container is attached to, in the order given at creation (first is primary). Empty if not networked.
        ip_forward:
          type: boolean
          description: >
            Whether net.ipv4.ip_forward is enabled inside this
            container's netns. Static routes given at creation are not
            echoed back here -- the caller already has them, and v1
            doesn't support introspecting or modifying them after
            creation.
        captured_output:
          type: string
          nullable: true
          description: >
            This container's own captured stdout/stderr (interleaved,
            oldest-first, bounded at 4096 bytes -- bytes past the cap
            are dropped, not the earliest ones), present only if
            capture_output was set to true at creation time. null (not
            an empty string) if capture was never requested -- the two
            are deliberately distinguishable: null means "opted out",
            "" means "opted in, nothing written yet." Updates live
            while the container runs and stops growing once it exits,
            so it remains readable afterward -- meant for diagnosing a
            process that starts (a successful execve()) but exits on
            its own with no other visible signal.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/ContainerDeviceAttachment"
          description: Every device this container was granted at creation. Empty if none.
        interfaces:
          type: array
          items:
            type: string
          description: >
            Bare kernel names of every real network interface moved into
            this container's own netns at creation. Empty if none.
        files:
          type: array
          items:
            type: string
          description: >
            Container-relative paths of every config file staged at
            creation (see ContainerCreateRequest.files) -- paths only,
            not content. Empty if none.
        sysctls:
          type: object
          additionalProperties:
            type: string
          description: >
            The net.* sysctls applied inside this container's own netns
            at creation (see ContainerCreateRequest.sysctls). Empty if
            none.
        cmd:
          type: array
          items:
            type: string
          description: >
            The entrypoint argv this container was created with (see
            ContainerCreateRequest.cmd) -- cmd[0] is the executable
            path. Previously not retrievable at all after creation: the
            create request's own argv only ever pointed into that
            request's transient parsed-JSON tree, freed immediately
            once the process was spawned. Sourced from the live
            registry entry while running/recently-exited, or from the
            persisted create-request body while genuinely stopped (see
            ADR-0100) -- either way, one real answer to "what is this
            container actually running."
        disk:
          type: string
          nullable: true
          description: >
            The disk (see ContainerCreateRequest.disk) this
            container's own overlay storage lives on, or null for the
            default OS-disk placement (task #638, ADR-0102).
        dns_servers:
          type: array
          items:
            type: string
          description: >
            The nameserver IPs (see ContainerCreateRequest.dns_servers,
            ADR-0143) staged into this container's own /etc/resolv.conf
            at creation time, id-only like `files` above (not the
            resolv.conf content itself, already implied by the list).
            Empty if none were given.
        restart:
          type: string
          enum: [always, on-failure, unless-stopped, no]
          description: >
            The persisted restart policy (see
            ContainerCreateRequest.restart), or "no" if this container's
            create request was never persisted. Sourced live from the
            persisted definition, not a static echo of what creation was
            originally given.
        restart_delay_seconds:
          type: integer
          nullable: true
          description: Base crash-restart delay; null unless restart is not "no".
        image_version:
          type: string
          description: >
            The image version this container was actually built from --
            resolved once at creation to whatever the image's own
            current_version was at that moment, or an explicit
            "image_version" on the create request. Stable from then on
            unless follow_rolling patches it and the container is
            restarted onto the new pin (ADR-0124).
        follow_rolling:
          type: boolean
          description: >
            Whether this container auto-follows its image's own rolling
            version drift (see ContainerCreateRequest.follow_rolling,
            ADR-0124). Always false unless restart is not "no".
        follow_rolling_jitter_seconds:
          type: integer
          nullable: true
          description: >
            This container's own per-container jitter-window override
            (see ContainerCreateRequest.follow_rolling_jitter_seconds).
            null means "use the daemon-wide default" -- either because
            none was set, or because restart is "no".
        stopped:
          type: boolean
          description: >
            Whether this definition was explicitly stopped via POST
            .../stop (see ContainerCreateRequest.restart's
            "unless-stopped" description). Always false unless restart
            is not "no".
        depends_on:
          type: array
          items:
            type: string
          description: Empty unless restart is not "no".
        readiness:
          allOf:
            - $ref: "#/components/schemas/Readiness"
          nullable: true
          description: >
            Sourced live from the persisted definition, same as restart/
            depends_on above; null if none was configured or restart is
            "no".

    HostauthConfig:
      type: object
      required: [admin_groups, idle_timeout_seconds, ldap_enabled, ldap_servers, ldap_port, ldap_base_dn]
      properties:
        admin_groups:
          type: array
          items:
            type: string
        idle_timeout_seconds:
          type: integer
        ldap_enabled:
          type: boolean
        ldap_servers:
          type: array
          items:
            type: string
        ldap_port:
          type: integer
        ldap_base_dn:
          type: string
    ResolvConfig:
      type: object
      required: [nameservers]
      properties:
        nameservers:
          type: array
          items:
            type: string
    PingStatus:
      type: object
      required: [state, host, reachable, rtt_ms, timed_out]
      properties:
        state:
          type: string
          enum: [none, pending, done]
          description: none -- no ping ever started on this daemon instance. pending -- sent, awaiting reply or timeout. done -- resolved.
        host:
          type: string
          nullable: true
          description: The target IPv4 address, or null if state is none.
        reachable:
          type: boolean
          nullable: true
          description: Null until state is done.
        rtt_ms:
          type: number
          nullable: true
          description: Round-trip time in milliseconds. Null unless reachable.
        timed_out:
          type: boolean
          nullable: true
          description: Null until state is done.
    Pressure:
      type: object
      required: [some, full]
      description: >
        One cgroup v2 PSI file's own "some"/"full" lines (ADR-0074).
        avg10/avg60/avg300 are percentages (0-100): the share of the
        last N seconds some/all tasks in this cgroup were stalled
        waiting on this resource. total_usec is cumulative stalled
        microseconds since the cgroup was created. Zeroed (not an
        error) on a kernel without CONFIG_PSI.
      properties:
        some:
          $ref: "#/components/schemas/PressureLine"
        full:
          $ref: "#/components/schemas/PressureLine"
          description: >
            Always near-zero for cpu.pressure specifically on a
            lightly-threaded cgroup -- the kernel only populates it
            when every runnable task is stalled simultaneously, which
            a single task can't produce.
    PressureLine:
      type: object
      required: [avg10, avg60, avg300, total_usec]
      properties:
        avg10:
          type: number
        avg60:
          type: number
        avg300:
          type: number
        total_usec:
          type: integer
    SystemStats:
      type: object
      required: [load, cpu, memory, disk, networks]
      properties:
        load:
          type: object
          required: [load1, load5, load15]
          description: /proc/loadavg's own 1/5/15-minute load averages.
          properties:
            load1:
              type: number
            load5:
              type: number
            load15:
              type: number
        cpu:
          type: object
          required:
            [user_jiffies, nice_jiffies, system_jiffies, idle_jiffies,
             iowait_jiffies, irq_jiffies, softirq_jiffies, steal_jiffies, pressure]
          description: /proc/stat's own first "cpu" line -- cumulative jiffies since boot, in the kernel's own fixed field order.
          properties:
            user_jiffies:
              type: integer
            nice_jiffies:
              type: integer
            system_jiffies:
              type: integer
            idle_jiffies:
              type: integer
            iowait_jiffies:
              type: integer
            irq_jiffies:
              type: integer
            softirq_jiffies:
              type: integer
            steal_jiffies:
              type: integer
            pressure:
              $ref: "#/components/schemas/Pressure"
              description: Host-wide cpu.pressure, from the cgroup v2 root (not any single container's own).
        memory:
          type: object
          required:
            [total_bytes, free_bytes, available_bytes, buffers_bytes,
             cached_bytes, swap_total_bytes, swap_free_bytes, pressure]
          description: From /proc/meminfo (kB in the source file, converted to bytes here).
          properties:
            total_bytes:
              type: integer
            free_bytes:
              type: integer
            available_bytes:
              type: integer
              description: The kernel's own best estimate of reclaimable-and-usable memory -- the number that actually answers "is the box under real memory pressure."
            buffers_bytes:
              type: integer
            cached_bytes:
              type: integer
            swap_total_bytes:
              type: integer
            swap_free_bytes:
              type: integer
            pressure:
              $ref: "#/components/schemas/Pressure"
              description: Host-wide memory.pressure, from the cgroup v2 root.
        disk:
          type: object
          required: [total_bytes, free_bytes, avail_bytes, pressure]
          description: statvfs() on the daemon's own data directory.
          properties:
            total_bytes:
              type: integer
            free_bytes:
              type: integer
            avail_bytes:
              type: integer
            pressure:
              $ref: "#/components/schemas/Pressure"
              description: Host-wide io.pressure, from the cgroup v2 root.
        networks:
          type: array
          description: Every real interface under /sys/class/net (not scoped to containers).
          items:
            type: object
            required: [name, rx_bytes, tx_bytes, rx_packets, tx_packets]
            properties:
              name:
                type: string
              rx_bytes:
                type: integer
              tx_bytes:
                type: integer
              rx_packets:
                type: integer
              tx_packets:
                type: integer
    HostProcess:
      type: object
      required: [pid, ppid, comm, command_line, container, user_id, group_id]
      properties:
        pid:
          type: integer
        ppid:
          type: integer
        comm:
          type: string
          description: /proc/<pid>/stat's own short process name.
        command_line:
          type: string
          description: Space-joined argv from /proc/<pid>/cmdline; "[comm]" for a kernel thread or a process caught between execve() calls.
        container:
          type: string
          description: The container this pid belongs to (by a real host ppid-chain walk, ADR-0131), or empty string if none.
        user_id:
          type: integer
          description: Real (not effective/saved/filesystem) uid.
        group_id:
          type: integer
          description: Real (not effective/saved/filesystem) gid.
    ContainerStats:
      type: object
      required: [cpu, memory, disk, networks]
      properties:
        cpu:
          type: object
          required: [usage_usec, user_usec, system_usec, pressure]
          description: Straight from this container's own cgroup v2 cpu.stat -- cumulative since it started.
          properties:
            usage_usec:
              type: integer
              description: Total CPU time consumed, microseconds.
            user_usec:
              type: integer
            system_usec:
              type: integer
            pressure:
              $ref: "#/components/schemas/Pressure"
              description: This container's own cpu.pressure (ADR-0074).
        memory:
          type: object
          required: [current, peak, max, pressure]
          description: From memory.current/memory.peak/memory.max.
          properties:
            current:
              type: integer
              description: Bytes in use right now.
            peak:
              type: integer
              description: Highest current has ever been.
            max:
              type: integer
              nullable: true
              description: The memory_max limit set at creation, or null if unlimited.
            pressure:
              $ref: "#/components/schemas/Pressure"
              description: This container's own memory.pressure.
        disk:
          type: object
          required: [upper_bytes, read_bytes, write_bytes, read_ios, write_ios, pressure]
          properties:
            upper_bytes:
              type: integer
              description: >
                Real space consumed by this container's own overlay
                upperdir (its content diff from the shared image) --
                content only, not directory-tree overhead.
            read_bytes:
              type: integer
              description: Cumulative bytes read, from cgroup v2 io.stat (0 if no tracked block I/O has happened yet).
            write_bytes:
              type: integer
            read_ios:
              type: integer
            write_ios:
              type: integer
            pressure:
              $ref: "#/components/schemas/Pressure"
              description: This container's own io.pressure.
        networks:
          type: array
          items:
            type: object
            required: [name, rx_bytes, tx_bytes, rx_packets, tx_packets]
            properties:
              name:
                type: string
                description: The network name (see Container.networks) -- never the internal host-side veth name.
              rx_bytes:
                type: integer
              tx_bytes:
                type: integer
              rx_packets:
                type: integer
              tx_packets:
                type: integer
          description: One entry per network this container is attached to, same order as Container.networks.

    ContainerNetworkAttachment:
      type: object
      required: [name, ip]
      properties:
        name:
          type: string
          description: Name of the attached network (see /networks).
        ip:
          type: string
          description: Assigned IPv4 address (dotted-quad) within that network.

    ContainerDeviceAttachment:
      type: object
      required: [id, dev_path]
      properties:
        id:
          type: string
          description: The granted device's id (see GET /devices).
        dev_path:
          type: string
          description: Path the device node was mknod()'d at inside this container's own /dev.

    DeviceMapCreateRequest:
      type: object
      required: [name, kind, selector]
      properties:
        name:
          type: string
          description: Same charset as a container/network/package name ([A-Za-z0-9_-]) -- never contains ':', so it can never collide with a real Device.id.
        kind:
          type: string
          enum: [exact, vendor_model]
          description: >
            "exact" pins to one specific device's own stable id (a fixed
            bus location -- e.g. a specific PCI slot, or one exact USB
            device by serial). "vendor_model" matches by vendor:product
            ID regardless of port -- follows a USB device that moves
            around, and can resolve to more than one currently-present
            device if several identical ones are plugged in (all are
            granted, the same group-expansion behavior GPU passthrough,
            ADR-0028, already established).
        selector:
          type: string
          description: >
            For "exact": a Device.id verbatim, copied from GET /devices.
            For "vendor_model": "<vendor_id>:<product_id>" (e.g.
            "1058:2630"), matching Device.vendor_id/product_id.

    DeviceMap:
      type: object
      required: [name, kind, selector, present, resolved_ids]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [exact, vendor_model]
        selector:
          type: string
        present:
          type: boolean
          description: Whether this mapping currently resolves to at least one real device -- re-derived fresh on every call, never cached.
        resolved_ids:
          type: array
          items:
            type: string
          description: The real Device.id(s) currently matching this mapping (0, 1, or more for "vendor_model").

    Device:
      type: object
      required: [id, bus, vendor_id, product_id, class, description, driver, dev_path, type, major, minor, assignable]
      properties:
        id:
          type: string
          description: >
            Stable identifier: "usb:{idVendor}:{idProduct}:{serial-or-port-path}",
            "pci:{bdf-address}[:{node-name}]", "net:{ifname}", or
            "gpu:{index}:{node-name}" (e.g. "gpu:0:card0",
            "gpu:0:renderD128" for one physical GPU's two DRM nodes).
            Never derived from USB busnum/devnum (reassigned on every
            replug) or from anything else that changes across a
            reboot/replug on the same physical port. GPU indices are
            stable only within one daemon's own enumeration pass
            (first-seen order among distinct underlying PCI addresses),
            not a hardware-assigned number.
        bus:
          type: string
          enum: [usb, pci, net, gpu]
          description: >
            "net" entries are real, physically-backed network interfaces
            only -- any interface the kernel itself creates (bridges,
            veths, kanxeo's own managed networks, ...) is never listed.
            An interface currently attached to a running container simply
            doesn't appear here at all (it isn't visible in this netns
            any more) -- the same rule that makes exclusivity automatic,
            with no separate "already claimed" state to represent.
            "gpu" entries are DRM display/render nodes (see ADR-0028);
            each individual node (e.g. "gpu:0:card0") is listed here,
            but the bare logical id (e.g. "gpu:0") that grants every
            node for that GPU at once is not itself a listed entry --
            see ContainerCreateRequest.devices.
        vendor_id:
          type: string
          description: 4 hex digits, no "0x" prefix.
        product_id:
          type: string
          description: 4 hex digits, no "0x" prefix.
        class:
          type: string
          description: PCI class/subclass/progif (6 hex digits), empty for USB and net.
        description:
          type: string
          description: Human-readable label (manufacturer/product strings, or a synthesized PCI description).
        driver:
          type: string
          description: Kernel driver currently bound, or empty if unbound.
        dev_path:
          type: string
          description: >
            The /dev node path this device owns, or empty if none was
            found (see assignable). Always empty for "net" -- a network
            interface has no /dev node at all; it's moved wholesale into
            a container's own netns instead (see
            ContainerCreateRequest.interfaces), not mknod()'d.
        type:
          type: string
          enum: [char, block]
          description: Meaningless for "net" (no /dev node to describe).
        major:
          type: integer
          description: Meaningless for "net".
        minor:
          type: integer
          description: Meaningless for "net".
        assignable:
          type: boolean
          description: >
            USB/PCI: true only if a driver is bound AND a real /dev node
            was found. net: always true (if it's listed at all, it's in
            this netns and free -- see bus's own description). A device
            with assignable=false still appears (so an operator can see
            it exists and why it isn't offered), but referencing its id
            in a container's own devices/interfaces field is a 400.

    Disk:
      type: object
      required: [name, dev_path, model, size_bytes, removable, is_os_disk, mounted, mount_path,
                 reads_completed, writes_completed, sectors_read, sectors_written, io_time_ms,
                 used_bytes, free_bytes]
      properties:
        name:
          type: string
          description: sysfs block device name with no "/dev/" prefix (e.g. "sda", "nvme0n1").
        dev_path:
          type: string
          description: '"/dev/" + name.'
        model:
          type: string
          description: From sysfs device/model; empty string if the kernel has none for this device.
        size_bytes:
          type: integer
          description: Real capacity, computed from sysfs's own 512-byte-sector "size" attribute.
        removable:
          type: boolean
        is_os_disk:
          type: boolean
          description: >
            True for the one disk backing this platform's own fixed
            ESP/root-a/root-b/config/containers partition layout --
            never a candidate for a future role assignment. False
            (including for every disk) on a dev/test daemon with no
            real containers partition to resolve.
        mounted:
          type: boolean
          description: >
            Real, current ground truth read fresh from /proc/mounts on
            every call -- true if any partition on this disk (or the
            whole-disk device itself) is currently mounted, regardless
            of whether this daemon is the one that mounted it or knows
            about it at all. Deliberately independent of the disk
            format job's own DISKFORMAT_STATE_READY (GET
            /diskformat/{name}), which is purely in-memory,
            per-daemon-process state forgotten across a restart even
            though the real mount persists.
        mount_path:
          type: string
          description: The real current mountpoint when mounted is true; empty string otherwise.
        reads_completed:
          type: integer
          description: >
            ADR-0142. Real, live, monotonically-increasing lifetime-
            since-boot counter straight from /sys/block/<name>/stat --
            a client polling this endpoint computes its own rate by
            differencing two samples, the same convention this API's
            other cumulative counters (container network stats) already
            use.
        writes_completed:
          type: integer
        sectors_read:
          type: integer
        sectors_written:
          type: integer
        io_time_ms:
          type: integer
          description: >
            Milliseconds this device has spent with I/O in flight
            (kernel's own "time spent doing I/Os" field) -- the closest
            real, cheaply-available proxy for disk I/O delay/business
            this daemon exposes, short of cgroup io.stat/PSI-level
            integration.
        used_bytes:
          type: integer
          description: Real statvfs(2) usage of mount_path. Only meaningful (non-zero) when mounted is true.
        free_bytes:
          type: integer
          description: Real statvfs(2) free space of mount_path. Only meaningful (non-zero) when mounted is true.

    DiskRole:
      type: object
      required: [disk_name, role, present]
      properties:
        disk_name:
          type: string
          description: A Disk.name from GET /disks (e.g. "sdb") -- not an operator-chosen alias, the real disk's own kernel name.
        role:
          type: string
          enum: [container-storage, backup, state-storage, rebuildable-storage, log-storage]
          description: >
            A small, fixed, closed vocabulary -- not free-form, since a
            role is only meaningful insofar as this daemon actually
            understands and acts on it. "swap" is deliberately not a
            role here: this platform already has a dedicated on-demand
            host swap FILE mechanism (POST /system/swap, ADR-0069) with
            no disk-level equivalent defined. state-storage/rebuildable-
            storage/log-storage (ADR-0141) are each a daemon-wide
            singleton -- multiple disks can carry the same one of these
            (eligible candidates), but only one is ever the *active*
            placement, tracked separately (GET /system/state-storage
            etc.), not by this role alone.
        fs_type:
          type: string
          enum: [ext4, btrfs]
          description: >
            Present once this disk has been successfully formatted
            (ADR-0142) -- persisted alongside the role itself so a
            later boot's own auto-remount pass knows which real
            filesystem to mount with, since POST /disks/{name}/format's
            own job state is purely in-memory and forgotten across a
            restart. Absent if this disk has never been formatted.
        present:
          type: boolean
          description: Whether disk_name currently resolves to a real disk (GET /disks) -- re-derived fresh on every call, never cached.

    DiskRoleCreateRequest:
      type: object
      required: [disk_name, role]
      properties:
        disk_name:
          type: string
        role:
          type: string
          enum: [container-storage, backup, state-storage, rebuildable-storage, log-storage]

    DiskFormatRequest:
      type: object
      required: [confirm_disk_name]
      properties:
        confirm_disk_name:
          type: string
          description: >
            Must exactly match disk_name in the URL path -- the
            deliberate double-confirmation this destructive endpoint
            requires (see /disks/{disk_name}/format's own description).
        fs_type:
          type: string
          enum: [ext4, btrfs]
          default: ext4
          description: >
            Which filesystem to format the disk with (ADR-0104). Optional --
            omitting it keeps this endpoint's original ext4-only behavior.
            "btrfs" requires a real mkfs.btrfs to actually be staged on this
            box (btrfs-progs.recipe, via a real kanxeo-hosttools image) --
            if it isn't, the job still starts but fails fast with a clear
            "mkfs.btrfs failed" once the child process's own exec attempt
            hits ENOENT, the same failure shape any other mkfs failure
            already has.

    DiskFormatStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [none, running, ready, failed]
        disk_name:
          type: string
          description: Omitted when state is "none".
        fs_type:
          type: string
          enum: [ext4, btrfs]
          description: Present once state is "running" or "ready".
        mount_path:
          type: string
          description: Present once state is "running" or "ready".
        error:
          type: string
          description: >
            Present once state is "failed" -- distinguishes "mkfs.<fs_type>
            failed" from "mkfs.<fs_type> succeeded but mount(2) failed" from
            an abnormal job process exit.

    StoragePlacement:
      type: object
      required: [disk]
      properties:
        disk:
          type: string
          nullable: true
          description: The active placement disk, or null for the default OS-disk placement.

    StorageMigrateStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [none, running, ready, failed]
        disk:
          type: string
          nullable: true
          description: >
            The migration's own target (omitted when state is "none") --
            null means this job migrated back to the default OS-disk
            placement.
        error:
          type: string
          description: Present once state is "failed".

    BackupConfig:
      type: object
      required: [disk, enabled, interval_hours]
      properties:
        disk:
          type: string
          nullable: true
          description: Must carry the `backup` role. Null means no automatic snapshots are possible.
        enabled:
          type: boolean
        interval_hours:
          type: integer
          description: 0 means no automatic schedule -- POST .../snapshot-now is the only trigger.

    BackupConfigUpdateRequest:
      type: object
      properties:
        disk:
          type: string
          nullable: true
        enabled:
          type: boolean
        interval_hours:
          type: integer
          minimum: 0
      description: All fields optional -- only the ones present are changed (at least one expected).

    BackupSnapshotStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [never, ok, failed]
        last_attempt_unixtime:
          type: integer
          description: Present once state is "ok" or "failed" (omitted when "never").
        error:
          type: string
          description: Present once state is "failed".

    NetworkCreateRequest:
      type: object
      required: [name, subnet, prefix_len]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,15}$"
          description: >
            Unique network name. Used verbatim as the Linux bridge
            interface's name, so it is restricted to IFNAMSIZ (15
            chars) and [A-Za-z0-9_-].
        subnet:
          type: string
          description: >
            The network's address (dotted-quad), with prefix_len's
            host bits already zero -- e.g. "172.31.0.0" for a /24.
            Rejected (400) if the host bits aren't actually zero, or
            if it overlaps any existing network's range.
        prefix_len:
          type: integer
          minimum: 8
          maximum: 30
          description: CIDR prefix length.
        address:
          type: string
          description: >
            Optional. Omitted (the default): the bridge is created
            purely L2, with no host-owned IP address at all -- for
            networks whose own routing is owned by whatever's attached
            to them (a router pair running a routing protocol, a
            shared VRRP address, etc.), not the host. When given, must
            be a real address within subnet (not the network or
            broadcast address); it's assigned to the bridge device
            itself and every attached container's primary network
            attachment gets it as an automatic default route.

    Network:
      type: object
      required: [name, subnet, prefix_len, has_address, address, is_management]
      properties:
        name:
          type: string
        subnet:
          type: string
        prefix_len:
          type: integer
        has_address:
          type: boolean
          description: Whether this network has a host-owned address at all.
        address:
          type: string
          nullable: true
          description: The host-owned address, or null when has_address is false.
        is_management:
          type: boolean
          description: >
            Whether this network's own address is kanxeod's own bind
            address (Part 0.5). At most one network has this set at a
            time; see GET /system/daemon-config for which one. While
            true, DELETE on this network and DELETE on any of its
            attached interfaces are refused (409) -- repoint
            management to a different network first via
            PUT /system/daemon-config's management_network field.
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/NetworkAttachedInterface"

    NetworkAttachedInterface:
      type: object
      required: [ifname, vlan_id]
      properties:
        ifname:
          type: string
          description: >
            The real interface name the operator attached -- for a VLAN
            attach, this is the parent link, not the derived
            "<ifname>.<vlan_id>" sub-interface actually enslaved to the
            bridge.
        vlan_id:
          type: integer
          description: 0 if ifname itself is enslaved directly (untagged).

    NetworkInterfaceAttachRequest:
      type: object
      required: [ifname]
      properties:
        ifname:
          type: string
          description: A currently assignable "net:<ifname>" device (see GET /devices).
        vlan_id:
          type: integer
          minimum: 0
          maximum: 4094
          description: Optional, default 0 (untagged). 1-4094 creates and enslaves an 802.1q sub-interface instead.

    ImageCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Unique image name. Used verbatim as the directory name under
            /var/lib/kanxeo/rebuildable/images/ (ADR-0141), so it is
            restricted to [A-Za-z0-9_-] -- the same rule pkg_install's own
            image field already follows.

    Image:
      type: object
      required: [name, manifest, current_version, versions]
      properties:
        name:
          type: string
          description: >
            A client wanting per-image *installed* package detail already
            has it via GET /pkg's own "image" field per entry, not
            duplicated here.
        manifest:
          type: array
          items:
            $ref: "#/components/schemas/ImageManifestEntry"
          description: >
            Operator-declared package intent (ADR-0107) -- distinct from
            what's currently installed. Empty for an image that has never
            had POST .../manifest called against it.
        current_version:
          type: string
          description: >
            The version hash (ADR-0108) whose immutable rootfs
            (IMAGES_DIR/<name>/<version>/rootfs) new containers built from
            this image are pinned to at creation time. Empty string if this
            image has never had a package installed/upgraded/removed
            against it (no version has been produced yet).
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ImageVersionHistoryEntry"
          description: >
            Every version this image has ever produced, newest first.
            Deduplicated by manifest-content hash (ADR-0108) -- an
            install/upgrade/uninstall cycle that reproduces an
            already-seen package set does not add a new entry.

    ImageVersionHistoryEntry:
      type: object
      required: [version, created_at]
      properties:
        version:
          type: string
          description: The version hash, as used in current_version and IMAGES_DIR/<name>/<version>/.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) this version was produced.

    ImageManifestEntry:
      type: object
      required: [package, mode, version]
      properties:
        package:
          type: string
        mode:
          type: string
          enum: [pinned, rolling]
          description: >
            "pinned": version is the exact recipe version to install, never
            auto-advances. "rolling": version is a floor -- resolves to the
            highest available recipe version >= it.
        version:
          type: string

    DnsRecordCreateRequest:
      type: object
      required: [name, ip]
      properties:
        name:
          type: string
          description: >
            Hostname: dot-separated labels of [A-Za-z0-9-], each 1-63 chars, ≤253 chars
            total (RFC 1035). Deliberately a different charset from network/container
            names, which don't allow dots.
        ip:
          type: string
          description: IPv4 address (dotted-quad) this name resolves to.

    DnsRecord:
      type: object
      required: [name, ip]
      properties:
        name:
          type: string
        ip:
          type: string
        owner:
          type: string
          nullable: true
          description: >
            Name of the container this record was auto-registered for
            (via ContainerCreateRequest.dns_register), or null for a
            record created directly via POST /dns/records. Owned
            records are automatically deleted when their container is.
            "__host" is a reserved sentinel (never a real container
            name, ADR-0128): the daemon's own auto-maintained instance
            DNS record for its own FQDN (ADR-0053).

    DnsServerBindingCreateRequest:
      type: object
      required: [container, hosts_path]
      properties:
        container:
          type: string
          description: Name of an existing, running container (see /containers) to keep in sync.
        hosts_path:
          type: string
          description: >
            Absolute path, as the container's own filesystem sees it (e.g.
            "/etc/dnsmasq-hosts"), that the daemon writes the current record set into
            (dnsmasq --addn-hosts format) and re-writes on every future record change.
            Rejected if not absolute or if it contains "..".

    DnsServerBinding:
      type: object
      required: [container, hosts_path]
      properties:
        container:
          type: string
        hosts_path:
          type: string

    LdapServerBindingCreateRequest:
      type: object
      required: [container, config_path]
      properties:
        container:
          type: string
          description: Name of an existing, running container (see /containers) -- the LDAP-serving target.
        config_path:
          type: string
          description: >
            Absolute path, as the container's own filesystem sees it (e.g.
            "/etc/glauth/glauth.cfg"), to glauth's own config file (the one it was
            started with -c) -- recorded for the LDAP user/group CRUD endpoints
            (task #726) to render into. Rejected if not absolute or if it contains
            "..".

    LdapServerBinding:
      type: object
      required: [container, config_path]
      properties:
        container:
          type: string
        config_path:
          type: string

    LdapConfig:
      type: object
      required: [start_uid, start_gid]
      properties:
        start_uid:
          type: integer
          minimum: 1
          default: 10000
          description: Floor ldap_uid_alloc() scans upward from when POST /ldap/users omits uidnumber.
        start_gid:
          type: integer
          minimum: 1
          default: 10000
          description: Floor ldap_gid_alloc() scans upward from when POST /ldap/groups omits gidnumber.

    LdapGroupCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z_][a-z0-9_-]*$"
        gidnumber:
          type: integer
          minimum: 1
          description: >
            Optional (task #748) -- omit to auto-allocate the next free
            gidnumber starting from the current GET /ldap/config
            start_gid floor (10000 by default).

    LdapGroup:
      type: object
      required: [name, gidnumber]
      properties:
        name:
          type: string
        gidnumber:
          type: integer

    LdapUserCreateRequest:
      type: object
      required: [name, primarygroup]
      properties:
        name:
          type: string
          pattern: "^[a-z_][a-z0-9_-]*$"
        uidnumber:
          type: integer
          minimum: 1
          description: >
            Optional on POST (task #748) -- omit to auto-allocate the next
            free uidnumber starting from the current GET /ldap/config
            start_uid floor (10000 by default). Required in practice on
            PUT (an omitted value is treated as 0, which fails validation)
            -- PUT never auto-allocates, matching every other PUT
            resource's full-replacement semantics.
        primarygroup:
          type: integer
          description: Must name an existing group's gidnumber.
        secondary_groups:
          type: array
          items:
            type: integer
          description: >
            (ADR-0144) Zero or more additional gidnumbers, each of which
            must already name a real group (same validation primarygroup
            gets). Rendered as glauth's own "othergroups" array. Omitted
            or empty means no secondary groups; PUT is full-field-
            replacement like every other field here.
        givenname:
          type: string
        sn:
          type: string
        mail:
          type: string
        loginshell:
          type: string
        homedirectory:
          type: string
        password:
          type: string
          description: >
            Plaintext, hashed server-side with bcrypt (ADR-0144) into
            glauth's own "passbcrypt" config field, hex-encoded there to
            match glauth's own real hex.DecodeString()-then-compare
            expectation -- never persisted or echoed as plaintext.
            Omitted on PUT: the existing credential is kept.
        ssh_public_key:
          type: string
          description: >
            A single OpenSSH public key line (task #731). Rendered as
            glauth's own real "sshkeys" LDAP attribute (ADR-0144 task
            #838) -- queried live by a container's own
            AuthorizedKeysCommand at connection time (see "Real,
            live-LDAP SSH login" in docs/api/README.md). Empty/omitted
            means no key for this user.
        can_search:
          type: boolean
          default: false
          description: >
            (ADR-0144 task #838) Grants this user glauth's own minimal
            "search" capability (object "*") -- needed for a real bind/
            service account used as an nslcd binddn or a live
            AuthorizedKeysCommand's own search bind. Off by default;
            most users never need it. Full-field-replacement on PUT like
            every other field here.
        disabled:
          type: boolean
          default: false

    LdapUser:
      type: object
      required: [name, uidnumber, primarygroup, has_password, disabled]
      properties:
        name:
          type: string
        uidnumber:
          type: integer
        primarygroup:
          type: integer
        secondary_groups:
          type: array
          items:
            type: integer
        givenname:
          type: string
        sn:
          type: string
        mail:
          type: string
        loginshell:
          type: string
        homedirectory:
          type: string
        has_password:
          type: boolean
          description: True iff a password has been set. The hash itself is never returned.
        ssh_public_key:
          type: string
          description: >
            Returned as given, unlike password -- an SSH public key is
            not a secret. Empty string means no key for this user.
        can_search:
          type: boolean
        disabled:
          type: boolean

    SiteConfig:
      type: object
      required: [instance_name, domain_suffix]
      properties:
        instance_name:
          type: string
          default: kanxeo
          description: >
            This specific install's own label (e.g. "kanxeo1") --
            always non-empty, shown in the dashboard header, CLI
            output, and backup bundle. Defaults to "kanxeo".
        site_name:
          type: string
          description: >
            Operator-chosen label (e.g. "lab1"). Optional on PUT (a
            request that omits it entirely defaults to "" server-side,
            same as an explicit ""); always present in a GET response.
            "" means no site tier -- a single-site deployment.
        domain_suffix:
          type: string
          default: internal
          description: >
            The private TLD this site's names notionally live under.
            Defaults to "internal" (IANA-reserved for exactly this
            use, RFC 9476) but is a real, settable value.

    PkgBootstrapStatus:
      type: object
      required: [state, error]
      properties:
        state:
          type: string
          enum: [none, fetching, ready, failed]
          description: >
            "none" until the first toolchain_url POST /pkg/bootstrap
            this daemon has ever handled. Only one fetch is ever in
            flight -- a POST while state is "fetching" gets 409, not
            a second job.
        error:
          type: string
          nullable: true
          description: Non-null only when state is "failed" (curl failure, checksum mismatch, or staging failure).

    IsoStatus:
      type: object
      required: [state, iso_path, error]
      properties:
        state:
          type: string
          enum: [none, building, ready, failed]
          description: >
            "none" until the first POST /system/iso this daemon has
            ever handled. Only one build is ever in flight -- a POST
            while state is "building" gets 409, not a second job.
        iso_path:
          type: string
          nullable: true
          description: Host filesystem path to the finished ISO. Non-null only when state is "ready".
        error:
          type: string
          nullable: true
          description: Non-null only when state is "failed".

    IsoBuildRequest:
      type: object
      description: >
        Every field is optional and independent -- composed server-side
        into the exact kernel-command-line flags kanxeo-install.c itself
        parses (--disk=/--ip=/--prefix=/--gateway=/--interface=). An
        omitted field becomes the literal placeholder "CHANGEME",
        mkinstalleriso's own original default -- editable at the GRUB
        boot menu with 'e' before booting; kanxeo-install's own stat()
        check on --disk= fails safely if left unedited.
      properties:
        disk:
          type: string
          description: Target block device, e.g. "/dev/sda".
        ip:
          type: string
          description: Static management IP to assign at install time.
        prefix:
          type: string
          description: CIDR prefix length for ip, e.g. "24".
        gateway:
          type: string
          description: Upstream default-route address (distinct from a network's own address -- see ADR-0058).
        interface:
          type: string
          description: Physical NIC name to attach to the "management" network, e.g. "eth0".

    DaemonConfig:
      type: object
      required: [port, bind, bind_ip, management_network, http_enabled, https_enabled, https_port]
      properties:
        port:
          type: integer
          default: 80
          description: The plain-HTTP listener's port.
        bind:
          type: string
          description: >
            kanxeod's own current bind address -- the management_
            network's own address, unless bind_ip is set, in which case
            this equals bind_ip instead (both listeners, HTTP and
            HTTPS, always share this same address; only the port
            differs).
        bind_ip:
          type: string
          nullable: true
          description: >
            A dedicated second address on the management network's own
            bridge that kanxeod binds to instead of that network's own
            address (ADR-0068), or null when unset (the default --
            kanxeod binds to the management network's own address,
            same as before this field existed). Decoupling the two
            lets an operator dedicate a specific address to kanxeod
            itself on a bridge shared with other traffic.
        management_network:
          type: string
          nullable: true
          description: >
            The network currently carrying kanxeod's own bind address
            (network_def.is_management, queried live from GET
            /networks -- not a second copy of that state). Null only in
            the unusual case no network is currently designated
            management (e.g. a --data-dir= test invocation that never
            bootstrapped one).
        http_enabled:
          type: boolean
          default: true
          description: Whether the plain-HTTP listener is currently up. Every install starts HTTP-only.
        https_enabled:
          type: boolean
          default: false
          description: Whether the HTTPS listener is currently up. Reuses the PKI-issued "host" leaf certificate (see POST /pki/ca) -- no separate cert-issuance path.
        https_port:
          type: integer
          default: 443
          description: The HTTPS listener's port.

    DaemonConfigPutRequest:
      type: object
      description: >
        Every field is optional -- PUT accepts a partial body, only the
        fields actually being changed. port, management_network, and
        bind_ip may all be given together and are applied as a single
        rebind rather than several. Repointing management_network
        without also giving a fresh bind_ip in the same request
        implicitly clears any previously-set bind_ip (ADR-0068) -- a
        dedicated bind_ip only ever makes sense relative to whichever
        network is management at the time.
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        management_network:
          type: string
          description: >
            Name of an existing network with has_address true (see
            POST /networks). Its own address becomes kanxeod's new
            bind address for both HTTP and HTTPS, unless bind_ip is
            also given in the same request.
        bind_ip:
          type: string
          nullable: true
          description: >
            Set to a real IPv4 address within the (possibly just-
            repointed) management network's own subnet to make kanxeod
            bind there instead of that network's own address (ADR-
            0068) -- added to the bridge via rtnl_addr_add_ipv4()
            before the listener rebinds to it. Set explicitly to null
            to clear it and revert to the management network's own
            address. Omit the key entirely to leave it unchanged.
        http_enabled:
          type: boolean
        https_enabled:
          type: boolean
        https_port:
          type: integer
          minimum: 1
          maximum: 65535

    LogEntry:
      type: object
      required: [ts, source, level, container, msg]
      properties:
        ts:
          type: integer
          description: Unix seconds.
        source:
          type: string
          enum: [kernel, kanxeod, audit, container]
        level:
          type: string
        container:
          type: string
          description: >
            The container this line came from -- only ever non-empty
            when source="container" (ADR-0126); empty string for every
            other source (this store's own established convention,
            same as every other field here -- never null).
        msg:
          type: string

    LogsConfig:
      type: object
      required: [max_bytes, min_level]
      description: >
        On PUT, both fields are optional in the request body (at least
        one required) -- the response always echoes back the resulting
        full config regardless of which field(s) were actually given.
      properties:
        max_bytes:
          type: integer
          minimum: 1048576
          maximum: 107374182400
        min_level:
          type: string
          enum: [emerg, alert, crit, err, error, warning, warn, notice, info, debug]
          description: >
            Entries less severe than this are dropped at write time,
            before ever touching a segment file -- not merely hidden
            from GET's own `level` query filter. "error"/"warn" are
            accepted as synonyms for "err"/"warning" (kanxeod/audit's
            own logstore_write() callers always say "error", never
            "err"). Default "debug" (log everything).

    SwapStatus:
      type: object
      required: [enabled, size_mb, path]
      properties:
        enabled:
          type: boolean
        size_mb:
          type: integer
          description: 0 when not enabled.
        path:
          type: string
          description: The swap file's real path on the host, or "" when not enabled.

    NtpConfig:
      type: object
      required: [upstream]
      properties:
        upstream:
          type: array
          items:
            type: string

    NtpStatus:
      type: object
      required: [state, synced_from, last_sync_unixtime]
      properties:
        state:
          type: string
          enum: [never, ok, failed]
          description: never -- no sync attempted yet since the daemon started. ok -- last attempt succeeded. failed -- last attempt exhausted every candidate with no valid reply (or a valid reply arrived but clock_settime() itself failed).
        synced_from:
          type: string
          nullable: true
          description: The IPv4 address the last successful sync used. Null unless state is ok.
        last_sync_unixtime:
          type: integer
          nullable: true
          description: Null unless state is ok.

    NtpServerBindingCreateRequest:
      type: object
      required: [container]
      properties:
        container:
          type: string
          description: Name of an existing, running container (see /containers) to register as a time source.

    NtpServerBinding:
      type: object
      required: [container]
      properties:
        container:
          type: string

    SyslogTargetCreateRequest:
      type: object
      required: [container]
      properties:
        container:
          type: string
          description: Name of an existing, running container (see /containers) to register as a syslog forward target.

    SyslogTarget:
      type: object
      required: [container]
      properties:
        container:
          type: string

    TimeConfig:
      type: object
      required: [unixtime]
      properties:
        unixtime:
          type: integer

    KernelRoute:
      type: object
      required: [dest, prefix, gateway, interface, protocol, scope]
      properties:
        dest:
          type: string
          description: >
            An IPv4 address (no prefix suffix), or the literal string
            "default" for the default route (prefix is 0 in that case).
        prefix:
          type: integer
          description: Destination prefix length (0 for the default route).
        gateway:
          type: string
          nullable: true
          description: Null for an on-link route the kernel derives automatically from an interface's own assigned address.
        interface:
          type: string
          nullable: true
          description: Null only if the kernel didn't report an outgoing interface for this route.
        protocol:
          type: integer
          description: Raw rtm_protocol value (e.g. 2 = kernel-derived on-link route, 3 = boot-time static route) -- not reinterpreted into a name.
        scope:
          type: integer
          description: Raw rtm_scope value -- not reinterpreted into a name.

    RouteMutationRequest:
      type: object
      description: >
        Shared body shape for POST/DELETE /system/routes (ADR-0067
        Part 3). Every field is optional; an empty body identifies the
        default route (prefix 0, no gateway) -- the same convention
        rtnl_route_add_ipv4() itself uses.
      properties:
        dest:
          type: string
          description: Destination network address (dotted-quad). Required when prefix is given and nonzero; ignored otherwise.
        prefix:
          type: integer
          minimum: 0
          maximum: 32
          description: Destination prefix length. Omitted or 0 means the default route (dest is then ignored).
        gateway:
          type: string
          nullable: true
          description: Next-hop IPv4 address. Omitted means a direct/on-link route with no gateway.

    PkiCaCreateRequest:
      type: object
      properties:
        common_name:
          type: string
          default: "Kanxeo Root CA"
          description: >
            A free-form display label (not a hostname -- dots/spaces are fine), embedded
            as the CA's subject CN. Must not contain "/" (would inject additional,
            unintended DN fields into the openssl -subj argument) or control characters.
        days:
          type: integer
          default: 3650
          description: Validity period in days.

    PkiCa:
      type: object
      required: [subject, serial, not_before, not_after, cert_pem]
      properties:
        subject:
          type: string
        serial:
          type: string
        not_before:
          type: string
        not_after:
          type: string
        cert_pem:
          type: string
          description: PEM-encoded CA certificate. The CA private key is never included here or anywhere else.

    PkiIntermediateCreateRequest:
      type: object
      properties:
        common_name:
          type: string
          default: "Kanxeo Intermediate CA"
          description: Same free-form display-label rules as PkiCaCreateRequest.common_name.
        days:
          type: integer
          default: 1825
          description: Validity period in days.

    PkiCertCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Hostname (same RFC 1035 rules as DnsRecord.name) -- becomes the leaf
            certificate's CN, and this endpoint's REST identifier.
        sans:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 8
          description: >
            Subject Alternative Names (each a hostname). Omit to default to [name] --
            a cert always carries at least its own name as a SAN.
        days:
          type: integer
          default: 365
          description: Validity period in days.

    PkiCert:
      type: object
      required: [name, serial, not_after, sans]
      properties:
        name:
          type: string
        serial:
          type: string
        not_after:
          type: string
        sans:
          type: array
          items:
            type: string
        cert_pem:
          type: string
          description: PEM-encoded leaf certificate. Present on GET /pki/certs/{name}; omitted from the GET /pki/certs list view.
        owner:
          type: string
          nullable: true
          description: >
            Name of the container this cert was auto-issued for (via
            ContainerCreateRequest.pki_issue), or null for a cert created
            directly via POST /pki/certs. Owned certs are automatically
            deleted when their container is. "__host" is a reserved
            sentinel (never a real container name, ADR-0128): the
            daemon's own auto-issued "host" leaf cert (ADR-0050).

    PkiCertIssued:
      allOf:
        - $ref: "#/components/schemas/PkiCert"
        - type: object
          required: [cert_pem, key_pem]
          properties:
            key_pem:
              type: string
              description: >
                PEM-encoded private key. Present ONLY in this POST /pki/certs response --
                never returned again by any later GET, list, or any other endpoint.

    PkgRecipe:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
          description: >
            One published version of name (ADR-0107) -- a package name may have
            multiple recipe versions coexisting; each appears as its own separate
            entry in GET /pkg/recipes' list, not merged/deduplicated by name.
        depends:
          type: string
          description: >
            Raw pkg_depends= value from the recipe: a whitespace-separated
            list of other recipe names. Real and acted on -- POST
            /pkg/install and /pkg/update-all both recursively resolve and
            install any of these not already satisfied in the target
            image before this recipe's own build starts, with cycle and
            diamond-dependency handling (dependencies always resolve to
            their own highest available version, regardless of any
            pinned version on the package actually being installed). A
            hostbuild recipe (POST /pkg/hostbuild) must leave this empty
            -- dependency resolution has no meaning for a one-shot
            artifact harvest.
        created_at:
          type: integer
          description: >
            Unix epoch seconds this recipe version's file was first published
            (ADR-0108) -- real filesystem mtime, accurate because a published
            version's file is never rewritten (ADR-0107's immutability rule).

    PkgRecipeDetail:
      allOf:
        - $ref: "#/components/schemas/PkgRecipe"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: The full text of the build.sh file, never sourced/executed by the daemon.

    ImageRecipe:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Also the target image's own name -- an image recipe's name is always its image's name (ADR-0123).

    ImageRecipeDetail:
      allOf:
        - $ref: "#/components/schemas/ImageRecipe"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: The full text of the image recipe file (image_packages=/image_artifact_sha256=).

    ImageRecipeApplyStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [never, running, success, failed]
        image:
          type: string
          nullable: true
          description: The image the most recent apply attempt targeted; null if one has never run.
        last_attempt:
          type: integer
          nullable: true
          description: Unix epoch seconds the most recent artifact-fetch apply was started; null if one has never run.
        error:
          type: string
          nullable: true
          description: Set when state is "failed" (fetch failure, checksum mismatch, or extraction failure).

    PkgRepoConfig:
      type: object
      required: [repo_url, repo_kind, ref, auth_token_set, sync_interval_seconds]
      properties:
        repo_url:
          type: string
          description: >
            Empty when no repo has ever been configured on this host.
            Only <scheme>://<host>/<owner>/<repo> is ever read from
            this -- a real forge browse URL pasted verbatim (e.g.
            ".../owner/repo/src/branch/<ref>/<path>") also works,
            since anything past the repo segment is ignored (ADR-0133).
        repo_kind:
          type: string
          enum: [gitea, github, gitlab]
        ref:
          type: string
          description: Branch/tag fetched on sync; "master" until explicitly set otherwise.
        auth_token_set:
          type: boolean
          description: Whether an auth token is currently stored -- the token itself is never returned.
        sync_interval_seconds:
          type: integer
          description: 0 means periodic sync is disabled (the default) -- only manual POST /pkg/sync runs.

    PkgSyncStatus:
      type: object
      required: [state, added, skipped]
      properties:
        state:
          type: string
          enum: [never, running, success, failed]
        last_attempt:
          type: integer
          nullable: true
          description: Unix epoch seconds the most recent sync was started; null if one has never run.
        added:
          type: integer
          description: Recipe versions newly added by the most recent completed sync.
        skipped:
          type: integer
          description: >
            Recipe versions the most recent completed sync found already present
            locally (merge/additive semantics -- ADR-0107 immutability means these
            are never overwritten, only counted).
        error:
          type: string
          nullable: true
          description: Set when state is "failed"; also non-null if some recipes failed to parse even on an otherwise-successful sync.

    PkgCacheConfig:
      type: object
      required: [max_bytes]
      properties:
        max_bytes:
          type: integer
          description: The cache's own real, always-enforced size cap; default 2 GiB. No "unlimited" mode.

    PkgCacheStatus:
      type: object
      required: [max_bytes, current_bytes, entry_count]
      properties:
        max_bytes:
          type: integer
        current_bytes:
          type: integer
          description: Total bytes currently occupied by cached artifacts.
        entry_count:
          type: integer
          description: Number of distinct (name,version) artifacts currently cached.

    PkgArtifactConfig:
      type: object
      required: [base_url, auth_token_set]
      properties:
        base_url:
          type: string
          description: >
            Empty when no artifact server is configured. A plain HTTP(S)
            location -- never a git forge; recipe artifacts are fetched at
            <base_url>/<name>-<version>.tar.gz, the same naming convention
            the local cache uses.
        auth_token_set:
          type: boolean
          description: Whether a bearer auth token is currently stored -- the token itself is never returned.

    RollingConfig:
      type: object
      required: [jitter_window_seconds]
      properties:
        jitter_window_seconds:
          type: integer
          description: >
            Default 60. 0 disables jitter -- a follow_rolling container
            restarts immediately when its image's rolling version advances.

    TlsThrottleConfig:
      type: object
      required: [enabled, threshold, window_seconds, block_seconds, log_interval_seconds]
      properties:
        enabled:
          type: boolean
          description: Default true.
        threshold:
          type: integer
          description: Default 20. Failures within window_seconds before a source is blocked.
        window_seconds:
          type: integer
          description: Default 60. The rolling window threshold is counted over.
        block_seconds:
          type: integer
          description: Default 300. How long a tripped source stays blocked.
        log_interval_seconds:
          type: integer
          description: >
            Default 5. Caps how often a "handshake failed" log line is
            written for a given source, independent of threshold/blocking --
            0 logs every single failure.

    TlsThrottleStatusEntry:
      type: object
      required: [ip, fail_count, blocked, blocked_until]
      properties:
        ip:
          type: string
        fail_count:
          type: integer
          description: Failures counted within the current rolling window.
        blocked:
          type: boolean
        blocked_until:
          type: integer
          description: Unix seconds the block lifts at, or 0 if not currently blocked.

    PkgInstallRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Must match a published <name>/<version>/build.sh's own pkg_name=. Its
            pkg_depends are resolved and installed first automatically
            (already-installed dependencies are skipped; a circular or unresolvable
            dependency is a 400).
        image:
          type: string
          default: base
          description: >
            The target image name/version's own rootfs are merged into once built.
            Defaults to "base" (every container using the base image). A package name
            is tracked independently per image -- installing "bash" into both "base"
            and "router" are two separate, independently upgradable/removable entries.
            Every dependency name pulls in installs into this same target image.
        version:
          type: string
          description: >
            Pins name to exactly this published recipe version (ADR-0107). Omitted
            resolves to the highest available version for name -- the pre-existing
            behavior every caller before ADR-0107 relied on. Every dependency name
            pulls in always resolves to its own highest available version regardless
            of this field -- pinning applies only to the single package actually
            being installed, never transitively to its build-time prerequisites.
            404/400 if no such (name, version) recipe exists.
        upgrade:
          type: boolean
          default: false
          description: >
            If name is already installed, a plain POST (upgrade omitted or false) is
            always 409, even if the recipe's version has since changed -- explicit intent
            is required to rebuild a working install. Set true to allow it: still 409 if
            the recipe's version already matches what's installed (nothing to do),
            otherwise proceeds -- the old version's files are removed and the new
            version's are installed once the rebuild succeeds. Only ever applies to name
            itself, never to a dependency pulled in transitively.

    PkgEntry:
      type: object
      required: [name, image, version, state, files]
      properties:
        name:
          type: string
        image:
          type: string
          description: >
            The target image this specific (name, image) entry is tracked/installed
            against. "base" unless a non-default image was given at install time.
        version:
          type: string
        state:
          type: string
          enum: [fetching, building, installed, failed]
          description: >
            The response to POST /pkg/install describes whichever package actually
            started fetching first, which may be a dependency rather than the requested
            name if that name needed something installed first.
        error:
          type: string
          nullable: true
          description: Populated only when state is "failed".
        available_version:
          type: string
          nullable: true
          description: >
            Only meaningful when state is "installed": null if the installed version
            matches the recipe currently on disk, otherwise the recipe's current
            pkg_version= -- re-read fresh on every response, not cached. The concrete
            answer to "is this out of date."
        files:
          type: array
          items:
            type: string
          description: >
            Paths (relative to the base image root) this package installed. Empty until
            state is "installed". Symlinks in a package's own DESTDIR output are skipped
            in v1 (a documented boundary) -- only regular files are copied and manifested.
            Always empty for a hostbuild entry (is_hostbuild=true), by design, not a bug:
            a hostbuild's output is copied to artifact_path, a plain host directory outside
            any image, which has nothing to ever pkg_delete() and so no manifest is kept
            for it -- artifact_path's own directory listing is the real answer to "what did
            this hostbuild produce."
        is_hostbuild:
          type: boolean
          description: >
            true if this entry was started via POST /pkg/hostbuild (ADR-0056) rather than
            an ordinary /pkg/install -- derived from image=="__hostbuild", never a
            separately stored flag.
        artifact_path:
          type: string
          nullable: true
          description: >
            Only meaningful for a hostbuild entry (is_hostbuild=true) once state is
            "installed": the host directory its harvested output landed in
            (ARTIFACTS_DIR/<name>/), never merged into any image's rootfs. null for
            every ordinary install, and for a hostbuild entry that hasn't finished yet.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        ADR-0144's write-gating: every POST/PUT/DELETE, plus the
        container console (`GET .../console`, a WebSocket upgrade that
        is arbitrary command execution in real effect, gated by intent
        rather than HTTP method), needs a valid `Authorization: Bearer
        <token>` from `POST /login` naming a user in one of the
        configured `admin_groups` (`GET/PUT /system/hostauth-config`).
        Every `GET` (this one included) stays open, unconditionally,
        always -- reads were never the concern. Gating itself only
        activates once at least one such admin-group user actually
        exists (`hostauth_gating_active()`) -- a fresh install can
        never lock itself out of its own API, and every mutating
        operation in this document behaves exactly as documented
        whether or not gating happens to be active on a given
        deployment. This scheme is referenced explicitly on `POST
        /logout` and `PUT /system/hostauth-config` above as the two
        operations most directly about authentication itself; it is
        the same requirement every other mutating operation in this
        document is subject to, not repeated on each one individually.
